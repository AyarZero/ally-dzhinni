<style>
:root,:root[data-theme="graphite"]{
  color-scheme:dark;
  --bg:#171716;
  --sheet:#21201e;
  --surface-raised:#2d2c28;
  --ink:#eceae5;
  --muted:#aaa79f;
  --line:#403b36;
  --accent:#c98569;
  --accent-soft:rgba(201,133,105,.15);
  --code-bg:#111110;
  --code-ink:#e9edf2;
  --bar-bg:rgba(23,23,22,.92);
  --ok:#9fbd9a;
  --ok-bg:rgba(159,189,154,.14);
  --plan:#e6b97c;
  --plan-bg:rgba(230,185,124,.14);
  --shadow:0 22px 60px rgba(0,0,0,.45);
}
:root[data-theme="teal"]{
  color-scheme:dark;
  --bg:#141b1a;
  --sheet:#1e2826;
  --surface-raised:#27342f;
  --ink:#e7efec;
  --muted:#a3b5b0;
  --line:#36443f;
  --accent:#74b3a6;
  --accent-soft:rgba(116,179,166,.15);
  --code-bg:#0d1413;
  --code-ink:#dceeea;
  --bar-bg:rgba(20,27,26,.92);
  --ok:#89c5a3;
  --ok-bg:rgba(137,197,163,.14);
  --plan:#e0b36a;
  --plan-bg:rgba(224,179,106,.14);
  --shadow:0 22px 60px rgba(0,0,0,.45);
}
:root[data-theme="midnight"]{
  color-scheme:dark;
  --bg:#000000;
  --sheet:#18181c;
  --surface-raised:#25252b;
  --ink:#f2f2f5;
  --muted:#a6a6ae;
  --line:#35353c;
  --accent:#4da3ff;
  --accent-soft:rgba(77,163,255,.15);
  --code-bg:#0b0b0e;
  --code-ink:#e7ecf7;
  --bar-bg:rgba(0,0,0,.92);
  --ok:#86c9a7;
  --ok-bg:rgba(134,201,167,.14);
  --plan:#e0b36a;
  --plan-bg:rgba(224,179,106,.14);
  --shadow:0 22px 60px rgba(0,0,0,.6);
}
:root[data-theme="noir"]{
  color-scheme:dark;
  --bg:#101216;
  --sheet:#1a1d22;
  --surface-raised:#252b32;
  --ink:#e8eaed;
  --muted:#a5abb1;
  --line:#353c45;
  --accent:#8fb4d4;
  --accent-soft:rgba(143,180,212,.15);
  --code-bg:#0c0e11;
  --code-ink:#e3e9f0;
  --bar-bg:rgba(16,18,22,.92);
  --ok:#8cbea3;
  --ok-bg:rgba(140,190,163,.14);
  --plan:#d9a05b;
  --plan-bg:rgba(217,160,91,.14);
  --shadow:0 22px 60px rgba(0,0,0,.48);
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f4f0e7;
  --sheet:#fbf9f3;
  --surface-raised:#e9e2d6;
  --ink:#38352f;
  --muted:#686357;
  --line:#d7cfbf;
  --accent:#a34c32;
  --accent-soft:rgba(163,76,50,.11);
  --code-bg:#1c1e22;
  --code-ink:#e9edf2;
  --bar-bg:rgba(244,240,231,.92);
  --ok:#36704d;
  --ok-bg:rgba(54,112,77,.12);
  --plan:#895608;
  --plan-bg:rgba(137,86,8,.12);
  --shadow:0 18px 50px rgba(24,18,12,.09);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:16px/1.72 "Segoe UI",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  scrollbar-color:var(--line) transparent;
}
html.is-embedded .brand{display:none}
.topbar{
  position:sticky;
  top:0;
  z-index:30;
  background:var(--bar-bg);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  user-select:none;
}
.topbar-inner{
  max-width:1360px;
  margin:0 auto;
  padding:10px 24px;
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  margin-inline-end:8px;
}
.brand strong{font-size:15.5px;letter-spacing:.02em}
.ver-pill{
  font:600 12px/1 ui-monospace,Consolas,monospace;
  padding:4px 9px;
  border-radius:999px;
  background:var(--accent-soft);
  color:var(--accent);
  border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);
}
.mode-tabs,.quick-langs,.controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.search-wrap{
  position:relative;
  display:flex;
  align-items:center;
  flex:1 1 180px;
  min-width:160px;
  max-width:300px;
  margin-inline:auto 4px;
}
.search-input{
  width:100%;
  min-height:32px;
  padding:5px 28px 5px 11px;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--sheet);
  color:var(--ink);
  font:400 13px/1.2 inherit;
}
.search-input:focus{outline:none;border-color:var(--accent)}
.search-input::placeholder{color:var(--muted)}
.search-clear{
  position:absolute;
  inset-inline-end:6px;
  all:unset;
  position:absolute;
  right:7px;
  cursor:pointer;
  color:var(--muted);
  font:600 15px/1 system-ui,sans-serif;
  padding:2px 4px;
}
[dir="rtl"] .search-clear{right:auto;left:7px}
.search-clear:hover{color:var(--ink)}
.search-count{font:600 11px/1 ui-monospace,Consolas,monospace;color:var(--accent);margin-inline-start:6px;white-space:nowrap}
.btn,.tab-btn,.lang-chip{
  appearance:none;
  border:1px solid var(--line);
  background:var(--sheet);
  color:var(--muted);
  border-radius:9px;
  padding:6px 12px;
  font:500 13px/1.2 inherit;
  cursor:pointer;
  transition:border-color .15s,color .15s,background .15s;
}
.btn:hover,.tab-btn:hover,.lang-chip:hover{color:var(--ink);border-color:var(--accent)}
.tab-btn.on,.lang-chip.on{
  color:var(--ink);
  border-color:var(--accent);
  background:var(--accent-soft);
  font-weight:600;
}
.lang-select,.theme-select{
  border:1px solid var(--line);
  background:var(--sheet);
  color:var(--ink);
  border-radius:9px;
  padding:6px 10px;
  font:500 13px/1.2 inherit;
  cursor:pointer;
}
.shell{
  max-width:1360px;
  margin:24px auto 64px;
  padding:0 24px;
  display:grid;
  grid-template-columns:260px minmax(0,1fr);
  gap:28px;
  align-items:start;
}
.shell.no-toc{grid-template-columns:minmax(0,1fr)}
.shell.no-toc .sheet{max-width:1040px;width:100%;margin:0 auto}
.toc{
  position:sticky;
  top:74px;
  max-height:calc(100vh - 96px);
  overflow:auto;
  padding:16px;
  border:1px solid var(--line);
  border-radius:14px;
  background:var(--sheet);
  font-size:13px;
}
.toc h3{
  margin:0 0 10px;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.1em;
  color:var(--muted);
}
.toc a{
  display:block;
  padding:6px 9px;
  margin:2px 0;
  border-radius:7px;
  color:var(--muted);
  text-decoration:none;
  line-height:1.35;
  transition:background .12s,color .12s;
}
.toc a:hover,.toc a.on{
  color:var(--ink);
  background:var(--accent-soft);
}
.toc a.on{color:var(--accent);font-weight:600}
.toc a[hidden]{display:none}
.sheet{
  min-width:0;
  max-width:980px;
  background:var(--sheet);
  border:1px solid var(--line);
  border-radius:18px;
  padding:42px 52px 52px;
  box-shadow:var(--shadow);
}
.sheet h1{
  margin:0 0 14px;
  font:700 31px/1.22 Georgia,"Times New Roman",serif;
  letter-spacing:-.01em;
}
.sheet h2{
  margin:36px 0 14px;
  padding-bottom:8px;
  border-bottom:1px solid var(--line);
  font:600 22px/1.3 Georgia,"Times New Roman",serif;
  scroll-margin-top:78px;
}
.sheet h3{margin:24px 0 10px;font:600 17px/1.35 inherit;color:var(--ink)}
.sheet p{margin:0 0 14px}
.sheet ul,.sheet ol{margin:8px 0 16px;padding-inline-start:24px}
.sheet li{margin:6px 0}
.sheet hr{border:0;border-top:1px solid var(--line);margin:26px 0}
.sheet blockquote{
  margin:14px 0;
  padding:10px 16px;
  border-inline-start:3px solid var(--accent);
  background:var(--accent-soft);
  border-radius:8px;
}
.sheet a{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.sheet code{
  font:13.5px/1.4 ui-monospace,Consolas,monospace;
  padding:2px 6px;
  border-radius:5px;
  background:var(--surface-raised);
}
.table-wrap{overflow-x:auto;margin:16px 0 22px;border:1px solid var(--line);border-radius:12px}
.sheet table{width:100%;border-collapse:collapse;font-size:14.5px;line-height:1.5}
.sheet th,.sheet td{padding:11px 14px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
.sheet tr:last-child td{border-bottom:0}
.sheet thead th{background:var(--surface-raised);font-weight:600}
.code-box{
  margin:14px 0 18px;
  border-radius:12px;
  overflow:hidden;
  border:1px solid var(--line);
  background:var(--code-bg);
  color:var(--code-ink);
  direction:ltr;
  text-align:left;
}
.code-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:7px 14px;
  background:rgba(255,255,255,.05);
  border-bottom:1px solid rgba(255,255,255,.08);
  font:500 11.5px/1 ui-monospace,Consolas,monospace;
  color:#a8b2c0;
}
.copy-btn{
  appearance:none;
  border:1px solid rgba(255,255,255,.18);
  background:transparent;
  color:#e4ebe8;
  border-radius:6px;
  padding:4px 10px;
  font:500 11.5px/1 system-ui,sans-serif;
  cursor:pointer;
}
.copy-btn:hover{border-color:#fff}
.code-box pre{
  margin:0;
  padding:14px 16px;
  overflow-x:auto;
  font:13px/1.55 ui-monospace,Consolas,monospace;
  white-space:pre-wrap;
  word-break:break-word;
}
.code-box pre code{padding:0;background:transparent;color:inherit;font-size:inherit}
.timeline{display:grid;gap:18px;margin-top:20px}
.rel-card{
  border:1px solid var(--line);
  border-radius:14px;
  padding:20px 24px;
  background:color-mix(in srgb,var(--surface-raised) 45%,var(--sheet));
}
.rel-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.rel-ver{font:700 18px/1.2 ui-monospace,Consolas,monospace;color:var(--ink)}
.rel-date{font:500 13px/1 ui-monospace,Consolas,monospace;color:var(--muted)}
.badge{
  font:600 11.5px/1 system-ui,sans-serif;
  padding:4px 9px;
  border-radius:999px;
}
.badge.released{background:var(--ok-bg);color:var(--ok)}
.badge.planned{background:var(--plan-bg);color:var(--plan)}
.rel-filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 6px}
.empty-search{padding:28px 18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;margin:16px 0}
.top-btn{
  position:fixed;
  right:24px;
  bottom:24px;
  z-index:25;
  border:1px solid var(--line);
  background:var(--sheet);
  color:var(--ink);
  border-radius:999px;
  padding:8px 14px;
  font:600 13px/1 inherit;
  cursor:pointer;
  box-shadow:var(--shadow);
}
[dir="rtl"] .top-btn{right:auto;left:24px}
.top-btn:hover{border-color:var(--accent);color:var(--accent)}
.top-btn[hidden]{display:none}
.meta-foot{
  margin-top:28px;
  padding-top:14px;
  border-top:1px solid var(--line);
  font-size:13px;
  color:var(--muted);
  display:flex;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
}
@media(max-width:1120px){
  .shell{grid-template-columns:1fr}
  .toc{display:none}
  .sheet{max-width:none}
}
@media(max-width:640px){
  .sheet{padding:24px 20px 32px;border-radius:14px}
  .sheet h1{font-size:25px}
  .sheet h2{font-size:19px}
  .search-wrap{max-width:none;order:10;flex-basis:100%}
}
@media print{
  body{background:#fff!important;color:#111!important;font-size:11.5pt;line-height:1.55}
  .topbar,.toc,.copy-btn,.rel-filters,.top-btn{display:none!important}
  .shell{display:block;max-width:none;margin:0;padding:0}
  .sheet{border:0;box-shadow:none;padding:0;max-width:none;background:#fff!important;color:#111!important}
  .sheet code{background:#efefef!important;color:#111!important}
  .sheet thead th{background:#f2f2f2!important}
  .code-box{border:1px solid #ccc;background:#f7f7f7!important;color:#111!important}
  .code-head{background:#eee!important;color:#333!important;border-bottom:1px solid #ccc}
  h1,h2,h3,table,.code-box,.rel-card{break-inside:avoid}
}
</style>
</head>

ler", "searchPh": "Rehberde ara…", "clear": "Temizle", "top": "Yukarı çık", "noHits": "Eşleşen bölüm bulunamadı. Aramayı temizleyin.", "copy": "Kopyala", "copied": "Kopyalandı ✓", "print": "PDF / Yazdır", "released": "Yayımlandı", "planned": "Planlanan", "all": "Tüm aşamalar", "themes": {"graphite": "Grafit", "teal": "Turkuaz", "midnight": "Gece yarısı", "noir": "Koyu", "light": "Açık"}, "vTitle": "AllY Sürüm Geçmişi ve Yol Haritası", "vLead": "v0.1’den itibaren tüm sürümler ve onaylı hedefler burada docs/versions.json içinde takip edilir.", "knownTitle": "Sürümdeki bilinen sınırlar:", "nextTitle": "Sonraki odak:", "srcLabel": "Kaynak Markdown:", "birthday": "Doğum günü: 23 Kasım 2026 · Lisans: MIT"}, "id": {"brand": "AllY · Jin", "docTitle": "AllY · Jin — Panduan & Versi", "guide": "Dokumentasi", "versions": "Riwayat Versi", "toc": "Daftar Isi", "searchPh": "Cari di panduan…", "clear": "Hapus", "top": "Ke atas", "noHits": "Tidak ada bagian yang cocok. Hapus pencarian untuk melihat semua.", "copy": "Salin", "copied": "Disalin ✓", "print": "PDF / Cetak", "released": "Dirilis", "planned": "Direncanakan", "all": "Semua tonggak", "themes": {"graphite": "Grafit", "teal": "Biru kehijauan", "midnight": "Tengah malam", "noir": "Gelap", "light": "Terang"}, "vTitle": "Riwayat Versi & Perkembangan AllY", "vLead": "Setiap rilis sejak v0.1 ke depan dan tonggak rencana berikutnya dicatat di sini dalam docs/versions.json.", "knownTitle": "Batasan yang diketahui saat rilis:", "nextTitle": "Fokus berikutnya:", "srcLabel": "Markdown sumber:", "birthday": "Ulang tahun: 23 November 2026 · Lisensi: MIT"}}, "docs": {"ru": {"label": "Русский", "dir": "ltr", "rawFile": "README.md", "markdown": "# AllY · Джинни (v0.1)\n\nЛокальная десктопная оболочка для Windows, объединяющая несколько нейросетей в одном окне с общей историей разговора, локальной памятью на диске, очередью задач и контролем лимитов.\n\n*День рождения AllY · Джинни — 23 ноября 2026 года. Лицензия: MIT.*\n\n---\n\n## Что это за приложение и какую проблему оно решает\n\nПри регулярной работе с ИИ задачи быстро расползаются по разным вкладкам браузера, консольным окнам и отдельным ключам. Когда у одной модели заканчивается пятичасовой лимит, приходится открывать другую и заново объяснять контекст проекта.\n\n**AllY · Джинни** закрывает четыре практические задачи:\n\n- **Единый контекст между моделями.** История разговора и ваша база правил хранятся локально в Markdown-файлах (`pamyat/`). Переключить нейросеть, модель или глубину рассуждений можно прямо в строке ввода, чтобы следующая модель продолжила задачу с того же места.\n- **Прозрачная работа CLI-агентов.** В обычном терминале сложно вовремя увидеть текущий шаг агента и вмешаться по ходу дела. В AllY слева показаны сфера состояния и лента текущих действий за плавной вертикальной границей с изменяемой шириной, а справа идут переписка и очередь задач с поддержкой уточнения на лету (`live-steer`), правки очереди и ускорения важного сообщения.\n- **Контроль лимитов и контекстного окна.** Виджет **«Ресурсы»** показывает ведущую нейросеть, заполнение контекста (с порогом `350k`), 5-часовые и недельные квоты подписок, а вкладка **«Помощники»** собирает балансы остальных подключений. Показатели считываются локально без платных фоновых вызовов.\n- **Контроль данных и прямые подключения.** Переписка, заметки `pamyat/`, навыки `.claude/skills/` и локальные настройки `.ally-data/` остаются на вашем компьютере. Вы используете собственные подписки и ключи напрямую у выбранных провайдеров.\n\n---\n\n## Для кого сделано приложение\n\n- **Разработчики и вайбкодеры**, которые ведут проекты через Claude Code, Codex, Antigravity или DeepSeek и хотят видеть шаги агентов, очередь и расход контекста в одном управляемом окне.\n- **Авторы, предприниматели и специалисты**, которым нужна единая локальная память под свои проекты на собственном ПК.\n- **Пользователи Windows 10/11**, которым нужен локальный инструмент с настройкой раскладки под свои задачи и возможностью влиять на следующие релизы через встроенную обратную связь.\n\n---\n\n## Что реально работает в версии 0.1\n\n### 1. Подключения и режим «Авто»\nДля старта достаточно подключить хотя бы один вариант. В режиме **«Авто»** система выбирает доступного исполнителя сама:\n\n| Подключение | Способ работы | Что умеет в v0.1 |\n|---|---|---|\n| **Claude Code** | Официальный CLI по подписке Anthropic Pro / Max | Сложные задачи, код, тексты, планирование и авто-сжатие контекста |\n| **Codex** | Официальный CLI по подписке ChatGPT Plus / Pro | Работа по репозиториям и уточнение прямо по ходу ответа (`live-steer`) |\n| **Antigravity** | Официальный CLI Google AI | Разборы с большим контекстом (порог окна `350k`) и отслеживанием квот |\n| **DeepSeek Harness** | Локальный headless-профиль `dsh` по балансу DeepSeek | Резервный и экономичный исполнитель, проверка баланса во вкладке «Помощники» |\n| **Агрегатор API (OpenRouter)** | Любой Anthropic-совместимый шлюз по Base URL и ключу | Подключение внешних моделей через локальный процесс Claude Code CLI (без подписки Anthropic) |\n| **Qoder CLI** | Локальный CLI (обнаружение и вход) | Определяется мастером подключения (включая вход из окна); роль ведущего в чате выйдет в следующем обновлении |\n\n### 2. Рабочее пространство и интерфейс\n- **Стартовый экран:** слева расположена **«Переписка»** с чистой сферой состояния, лентой текущих шагов и плавной вертикальной границей с изменяемой шириной; справа находятся виджеты **«Ресурсы» / «Помощники»** (сверху) и **«Ноутбук»** (снизу), границы которых можно свободно тянуть в режиме настройки.\n- **Верхняя панель (справа налево):** часы у правого края, кнопка **обратной связи (букашка)** с широкой панелью для текста и вложений, **кисть** (перетаскивание виджетов, вкладок и иконок, настройка высоты и ширины блоков, сброс раскладки), **темы оформления** (по умолчанию **Графит**, также доступны Бирюзовая, Полночь, Тёмная и Светлая), **книга (справка и свод версий)** прямо внутри окна и акцентная **молния** (3-шаговый мастер подключений с широким «Режимом чтения»).\n- **Локальное хранение:** `pamyat/` (локальная Markdown-память), `.claude/skills/` (локальные навыки), `.ally-data/` (ключи и раскладка окна, исключена из Git).\n\n---\n\n## Установка и запуск (Windows 10/11)\n\n**Перед установкой убедитесь, что в системе уже стоят и доступны в `PATH`:**\n1. **Node.js 24+** (с поддержкой встроенного модуля `node:sqlite`)\n2. **Python 3**\n3. **Git**\n4. Доступ в интернет на время первой сборки (`npm ci` и загрузка Electron) и хотя бы один подключённый ИИ-движок или ключ.\n\nВыберите любой из трёх удобных способов установки:\n\n### Способ 1 — через архив и знакомый `.exe`\n1. Скачайте ZIP-архив репозитория и распакуйте его в короткий путь без кириллицы, например `C:\\AllY`.\n2. Дважды нажмите на **`AllY.exe`** — при первом запуске он проверит `node` 24+, `python` и `git`, установит зависимости, скачает Electron, соберёт исполняемый файл **`programma\\Dzhinni.exe`**, создаст ярлык **`AllY`** на рабочем столе и сам откроет окно.\n  *Если Windows SmartScreen покажет предупреждение для нового неподписанного `.exe`, нажмите «Подробнее» → «Выполнить в любом случае» (исходники лаунчеров открыты в `docs/launchers/`, также можно запустить `.\\ustanovka.ps1` напрямую).*\n3. В дальнейшем запускайте приложение двойным кликом по **`AllY.exe`**, ярлыку **`AllY`** на рабочем столе или напрямую через **`programma\\Dzhinni.exe`**. Документацию и свод версий в отдельном окне приложения открывает **`AllY-Guide.exe`**.\n4. При первом запуске откроется 3-шаговый мастер старта — подключите нужную нейросеть и отправьте первое сообщение.\n\n### Способ 2 — командами в терминале (PowerShell / cmd)\nОткройте PowerShell и выполните по порядку:\n\n```powershell\ngit clone https://github.com/AyarZero/ally-dzhinni.git C:\\AllY\ncd C:\\AllY\n.\\AllY.exe\n```\n\nПроверить готовность сборки позже можно командой:\n\n```powershell\n.\\AllY.exe -Proverka\n```\n\nЗапуск из терминала:\n\n```powershell\n.\\AllY.exe\n```\n\n### Способ 3 — готовый промпт для вашей локальной нейросети\nЕсли у вас уже работает Claude Code, Codex, Antigravity или другой ИИ-помощник на компьютере, скопируйте этот текст целиком и отправьте ему:\n\n```text\nУстанови и подготовь к запуску локальное десктоп-приложение AllY · Джинни (v0.1) на этом ПК Windows из репозитория https://github.com/AyarZero/ally-dzhinni:\n1. Проверь в терминале наличие `git`, `python` (Python 3) и `node` (нужна версия Node.js 24+ с рабочей проверкой `node -e \"require('node:sqlite')\"`). Если чего-то не хватает или версия Node ниже 24 — сообщи мне и помоги доустановить перед сборкой.\n2. Клонируй репозиторий в короткий путь без кириллицы и пробелов, например `C:\\AllY`, и перейди в эту папку.\n3. Запусти установку: `powershell -NoProfile -ExecutionPolicy Bypass -File .\\ustanovka.ps1` и дождись сборки `programma\\Dzhinni.exe`.\n4. Проверь сборку командой `powershell -NoProfile -ExecutionPolicy Bypass -File .\\ustanovka.ps1 -Proverka`.\n5. Проверь, какие CLI-движки (Claude Code, Codex, Antigravity, DeepSeek Harness, Qoder) или ключи OpenRouter уже доступны в системе, и коротко подскажи мне, что уже готово.\n6. Запусти `programma\\Dzhinni.exe` (или `.\\AllY.exe`) и скажи мне, что можно открывать окно AllY и начинать работу.\n```\n\n*Примечание: подключённые CLI-исполнители работают с файлами открытой рабочей папки напрямую без запроса на каждое чтение или правку — держите важные проекты под Git.*\n\n---\n\n## Обратная связь и участие в развитии проекта\n\nВ правой части шапки (левее часов) расположена кнопка со **значком букашки — «Обратная связь»**. Через неё прямо из интерфейса можно:\n\n- сообщить об ошибке, поломке интерфейса или проблеме запуска;\n- прикрепить к сообщению до **3 файлов** подтверждения: текстовые логи `.txt` / `.md` (до `2 МБ`), скриншоты `.png` / `.jpg` / `.jpeg` / `.webp` / `.gif` (до `10 МБ`) или короткие видео `.mp4` / `.webm` / `.mov` (до `25 МБ`, суммарно до `30 МБ`);\n- предложить новый модуль, навык или сценарий использования.\n\nОтправляются **только текст формы и выбранные вами файлы** — переписка, личные заметки и ключи остаются локально. Ответы разработчиков приходят обратно в переписку приложения. Проект открыт под лицензией MIT: вы можете создавать собственные навыки в `.claude/skills/` и участвовать в доработке ядра.\n\n---\n\n## Известные проблемы и ограничения v0.1, над которыми мы сейчас работаем\n\nМы честно фиксируем то, что пока ограничено или доводится прямо сейчас:\n\n1. **Зависимости окружения ставятся заранее:** для установки `v0.1` требуются уже установленные `Node.js 24+`, `Python 3` и `Git` — единый автономный `.exe`-инсталлятор без ручной подготовки софта ещё в работе.\n2. **Голосовой ввод и озвучка скрыты в клиентской сборке v0.1:** кнопки микрофона и голоса временно убраны на этапе доводки локального распознавания речи (`GigaAM`) и его установщика.\n3. **Дневник («Честный разговор») скрыт в клиентской сборке v0.1:** дорабатывается поддержка всех движков и отдельный мастер; вкладка откроется в ближайшем обновлении.\n4. **Плавное засыпание фонового моста после закрытия окна:** при закрытии окна локальный сервер моста может завершаться через таймаут простоя (до ~9 минут), если сразу переоткрывать другой экземпляр.\n5. **Qoder в процессе интеграции:** мастер подключений определяет локальный CLI Qoder и статус входа, но использование Qoder в роли ведущего в переписке пока закрыто до следующего релиза.\n6. **Серверная волна приёма крупных вложений в отзывах:** если при отправке скриншота или видео сервер отзывов вернёт ошибку размера или непринятия файла до завершения обновления бэкенда, форму можно сразу отправить текстом без потери черновика.\n7. **Платформа:** протестировано и собрано только под **Windows 10/11**.\n\n---\n\n## Дорожная карта и ориентировочные сроки\n\nСроки ориентировочные — ближайшие релизы расписаны по неделям, более дальние даны широкими отрезками и сдвигаются по реальным отзывам пользователей:\n\n| Ориентировочный срок | Что планируется выпустить |\n|---|---|\n| **Конец ноября — начало декабря 2026** *(1–2 недели)* | Правки по первым отзывам из интерфейса, полный серверный приём фото/видео вложений в отзывах, мгновенное завершение фонового моста при закрытии окна |\n| **Вторая половина декабря 2026** | Встроенный трекер **«Задачи и Проекты»** (фокус на день, доска, календарь, карточки) и работа вкладки **«Дневник»** через любой выбранный движок |\n| **Январь 2027** | Возвращение **локального голосового режима** (оффлайн-диктовка без облака + озвучка ответов) и упрощённый установщик без ручной постановки `Node.js` и `Git` |\n| **Февраль — март 2027** | Раздел **«Обучение»** (библиотека уроков внутри окна и бесплатный вводный курс по AllY и подготовке релизов), конструктор пользовательских виджетов и модули ревизии/контента |\n| **Апрель — май 2027** | Интерактивный **граф знаний** рабочего пространства, панель **«Здоровье проекта»** (покрытие связей и устаревшие узлы) и полноценная работа Qoder как помощника по чтению кода |\n| **Июнь — июль 2027** | Бета-релиз **Android-клиента** с подключением к домашнему ПК по защищённому каналу без второй базы данных + адаптация десктопа под macOS и Linux |\n| **Август 2027 и далее** | Стабильный релиз `v1.0`, каталог общих навыков сообщества и синхронизация рабочего пространства между несколькими устройствами пользователя |\n"}, "en": {"label": "English", "dir": "ltr", "rawFile": "readme/README.en.md", "markdown": "# AllY · Genie (v0.1)\n\nA local desktop shell for Windows that brings multiple AI models into one window with shared conversation history, local on-disk memory, a task queue, and usage tracking.\n\n*AllY · Genie's birthday is November 23, 2026. License: MIT.*\n\n---\n\n## What this app is and what problem it solves\n\nWhen you work with AI regularly, tasks quickly spread across browser tabs, terminal windows, and separate API keys. When one model hits its five-hour limit, you have to open another and explain the project context all over again.\n\n**AllY · Genie** addresses four practical needs:\n\n- **Shared context across models.** Conversation history and your rule base are stored locally in Markdown files (`pamyat/`). Switch the AI engine, model, or reasoning depth directly in the input field so the next model can pick up where the previous one left off.\n- **Visibility into CLI agents.** In a regular terminal, it is hard to spot an agent's current step in time and intervene as it works. AllY shows a status sphere and a live activity feed on the left, separated by a smooth, adjustable vertical divider from the conversation and task queue on the right, with support for on-the-fly clarification (`live-steer`), queue editing, and prioritizing an important message.\n- **Usage limits and context window tracking.** The **Resources** widget shows the lead AI engine, context usage (with a `350k` threshold), and five-hour and weekly subscription quotas, while the **Assistants** tab brings together balances for the other connections. Metrics are read locally without paid background calls.\n- **Data control and direct connections.** Conversations, `pamyat/` notes, `.claude/skills/` skills, and `.ally-data/` local settings stay on your computer. You use your own subscriptions and keys directly with your chosen providers.\n\n---\n\n## Who this app is for\n\n- **Developers and vibe coders** who work on projects through Claude Code, Codex, Antigravity, or DeepSeek and want agent steps, the queue, and context usage in one manageable window.\n- **Writers, entrepreneurs, and professionals** who need unified local memory for their projects on their own PC.\n- **Windows 10/11 users** who want a local tool with a customizable layout and a way to influence future releases through built-in feedback.\n\n---\n\n## What actually works in version 0.1\n\n### 1. Connections and Auto mode\nConnect at least one option to get started. In **Auto** mode, the system selects an available agent automatically:\n\n| Connection | How it works | Capabilities in v0.1 |\n|---|---|---|\n| **Claude Code** | Official CLI with an Anthropic Pro / Max subscription | Complex tasks, code, writing, planning, and automatic context compaction |\n| **Codex** | Official CLI with a ChatGPT Plus / Pro subscription | Repository work and clarification while a response is in progress (`live-steer`) |\n| **Antigravity** | Official Google AI CLI | Large-context analysis (`350k` window threshold) and quota tracking |\n| **DeepSeek Harness** | Local headless `dsh` profile using your DeepSeek balance | A backup, low-cost agent, with balance checks in the Assistants tab |\n| **API aggregator (OpenRouter)** | Any Anthropic-compatible gateway using a Base URL and key | External models through a local Claude Code CLI process (without an Anthropic subscription) |\n| **Qoder CLI** | Local CLI (discovery and sign-in) | Detected by the connection wizard (including in-window sign-in); support as the lead chat agent is coming in the next update |\n\n### 2. Workspace and interface\n- **Start screen:** **Conversation** is on the left with a clean status sphere, live activity rail, and smooth parallax divider; on the right sit resizable **Resources / Assistants** (top) and **Laptop** monitor (bottom).\n- **Top bar (right to left):** clock on the right, wide **feedback drawer (bug icon)** for messages and attachments, **brush** (drag widgets, tabs, and icons; resize blocks horizontally or vertically; reset layout), **themes** (**Graphite** by default, plus Turquoise, Midnight, Dark, and Light), **book icon** (built-in Guide & Version History right inside the app), and a highlighted **lightning bolt** (3-step wizard with full-width **Reading mode**).\n- **Local storage:** `pamyat/` (local Markdown memory), `.claude/skills/` (local skills), `.ally-data/` (keys and window layout, excluded from Git).\n\n## Installation and launch (Windows 10/11)\n\n**Before installing, make sure the following are already installed and available in `PATH`:**\n1. **Node.js 24+** (with support for the built-in `node:sqlite` module)\n2. **Python 3**\n3. **Git**\n4. Internet access for the initial build (`npm ci` and the Electron download), plus at least one connected AI engine or key.\n\nChoose any of these three installation methods:\n\n### Method 1 — ZIP archive and a familiar `.exe`\n1. Download the repository ZIP archive and extract it to a short path without Cyrillic characters, such as `C:\\AllY`.\n2. Double-click **`AllY.exe`**—on first launch it checks for `node` 24+, `python`, and `git`, installs dependencies, downloads Electron, builds the **`programma\\Dzhinni.exe`** executable, creates an **`AllY`** desktop shortcut, and opens the app window.\n  *If Windows SmartScreen warns about a new unsigned `.exe`, click **More info → Run anyway** (full launcher source code is in `docs/launchers/`, or run `.\\ustanovka.ps1` directly).*\n3. Next time, launch the app by double-clicking **`AllY.exe`**, the **`AllY`** desktop shortcut, or **`programma\\Dzhinni.exe`** directly. To open the interactive guide and version history in a separate app window, run **`AllY-Guide.exe`**.\n4. On first launch, a three-step setup wizard opens—connect your preferred AI engine and send your first message.\n\n### Method 2 — terminal commands (PowerShell / cmd)\nOpen PowerShell and run these commands in order:\n\n```powershell\ngit clone https://github.com/AyarZero/ally-dzhinni.git C:\\AllY\ncd C:\\AllY\n.\\AllY.exe\n```\n\nTo check build readiness later, run:\n\n```powershell\n.\\AllY.exe -Proverka\n```\n\nLaunch from the terminal:\n\n```powershell\n.\\AllY.exe\n```\n\n### Method 3 — ready-to-use prompt for your local AI assistant\nIf Claude Code, Codex, Antigravity, or another AI assistant is already running on your computer, copy this entire prompt and send it:\n\n```text\nInstall and prepare the local AllY · Genie (v0.1) desktop app for launch on this Windows PC from the repository https://github.com/AyarZero/ally-dzhinni:\n1. Check in the terminal that `git`, `python` (Python 3), and `node` are available (Node.js 24+ is required, with a successful `node -e \"require('node:sqlite')\"` check). If anything is missing or the Node version is below 24, tell me and help install it before building.\n2. Clone the repository to a short path without Cyrillic characters or spaces, such as `C:\\AllY`, and change to that folder.\n3. Run the installation: `powershell -NoProfile -ExecutionPolicy Bypass -File .\\ustanovka.ps1` and wait for `programma\\Dzhinni.exe` to finish building.\n4. Verify the build with `powershell -NoProfile -ExecutionPolicy Bypass -File .\\ustanovka.ps1 -Proverka`.\n5. Check which CLI engines (Claude Code, Codex, Antigravity, DeepSeek Harness, Qoder) or OpenRouter keys are already available on the system, and briefly tell me what is ready.\n6. Launch `programma\\Dzhinni.exe` (or `.\\AllY.exe`) and tell me I can open the AllY window and start working.\n```\n\n*Note: connected CLI agents work directly with files in the open working folder without asking permission for each read or edit—keep important projects under Git version control.*\n\n---\n\n## Feedback and contributing\n\nOn the right side of the header (to the left of the clock), the **bug icon opens Feedback**. From there, you can:\n\n- report a bug, a broken interface, or a startup problem;\n- attach up to **3 supporting files**: text logs `.txt` / `.md` (up to `2 MB`), screenshots `.png` / `.jpg` / `.jpeg` / `.webp` / `.gif` (up to `10 MB`), or short videos `.mp4` / `.webm` / `.mov` (up to `25 MB`, with a total limit of `30 MB`);\n- suggest a new module, skill, or use case.\n\n**Only the form text and the files you select** are sent—conversations, personal notes, and keys stay local. Developer replies arrive in the app's conversation view. The project is open source under the MIT license: you can create your own skills in `.claude/skills/` and contribute to the core.\n\n---\n\n## Known v0.1 issues and limitations we are working on\n\nHere is an honest account of what is still limited or being refined:\n\n1. **Environment dependencies must be installed beforehand:** installing `v0.1` requires `Node.js 24+`, `Python 3`, and `Git` to be installed already—a single standalone `.exe` installer without manual software setup is still in progress.\n2. **Voice input and speech output are hidden in the v0.1 client build:** microphone and voice buttons have been temporarily removed while local speech recognition (`GigaAM`) and its installer are being refined.\n3. **The Diary (\"Honest Conversation\") is hidden in client build v0.1:** multi-engine support and a dedicated flow are being finalized; the tab will open in an upcoming update.\n4. **Delayed shutdown of the background bridge after closing the window:** the local bridge server may take until its idle timeout (up to ~9 minutes) to shut down after the window closes if another instance is reopened immediately.\n5. **Qoder integration is in progress:** the connection wizard detects the local Qoder CLI and sign-in status, but using Qoder as the lead conversation agent remains disabled until the next release.\n6. **Server-side rollout for large feedback attachments:** if the feedback server returns a size or file-rejection error when you send a screenshot or video before the backend update is complete, you can immediately submit the form as text only without losing your draft.\n7. **Platform:** tested and built only for **Windows 10/11**.\n\n---\n\n## Roadmap and approximate timeframes\n\nDates are approximate—near-term releases are planned by week, while later releases use broader timeframes and may shift based on actual user feedback:\n\n| Approximate timeframe | Planned release |\n|---|---|\n| **Late November — early December 2026** *(1–2 weeks)* | Fixes based on initial in-app feedback, full server-side support for photo/video feedback attachments, immediate background bridge shutdown when the window closes |\n| **Second half of December 2026** | Built-in **Tasks and Projects** tracker (daily focus, board, calendar, cards) and support for any selected engine in the **Diary** tab |\n| **January 2027** | Return of **local voice mode** (offline dictation without cloud services + spoken responses) and a simplified installer without manual `Node.js` and `Git` installation |\n| **February — March 2027** | **Learning** section (an in-window lesson library and a free introductory course on AllY and release preparation), a custom widget builder, and review/content modules |\n| **April — May 2027** | Interactive workspace **knowledge graph**, a **Project Health** panel (link coverage and outdated nodes), and full Qoder support as a code-reading assistant |\n| **June — July 2027** | **Android client** beta with a secure connection to your home PC and no second database + desktop adaptation for macOS and Linux |\n| **August 2027 onward** | Stable `v1.0` release, a shared community skills catalog, and workspace synchronization across multiple user devices |\n"}, "zh-CN": {"label": "简体中文", "dir": "ltr", "rawFile": "readme/README.zh-CN.md", "markdown": "# AllY · 精灵 (v0.1)\n\n面向 Windows 的本地桌面应用，将多个 AI 集成在同一窗口中，共享对话历史，并提供磁盘本地记忆、任务队列与额度监控。\n\n*AllY · 精灵的生日是 2026 年 11 月 23 日。许可证：MIT。*\n\n---\n\n## 这是什么应用，解决什么问题\n\n经常使用 AI 时，任务很快就会分散到不同的浏览器标签页、终端窗口和独立密钥中。当一个模型的 5 小时额度耗尽时，就得打开另一个模型，重新解释项目上下文。\n\n**AllY · 精灵**解决四个实际问题：\n\n- **模型之间共享上下文。** 对话历史和你的规则库以 Markdown 文件保存在本地（`pamyat/`）。可直接在输入栏切换 AI、模型或推理深度，让下一个模型从原处继续任务。\n- **CLI 智能体的操作透明可见。** 在普通终端中，很难及时看到智能体当前执行的步骤并中途干预。AllY 左侧显示状态球和实时操作流，通过可拖动调宽的平滑垂直分隔线与右侧分开；右侧显示对话和任务队列，支持即时补充指令（`live-steer`）、编辑队列和优先处理重要消息。\n- **监控额度和上下文窗口。** **“资源”**组件显示主力 AI、上下文占用情况（阈值为 `350k`），以及订阅的 5 小时和每周额度；**“助手”**标签页汇总其他连接的余额。这些指标在本地读取，不会产生付费的后台调用。\n- **掌控数据，直连服务。** 对话、`pamyat/` 笔记、`.claude/skills/` 技能和 `.ally-data/` 本地设置均保留在你的电脑上。你直接使用所选服务商的个人订阅和密钥。\n\n---\n\n## 适用人群\n\n- **开发者和氛围编程用户**：通过 Claude Code、Codex、Antigravity 或 DeepSeek 开发项目，希望在同一个可控窗口中查看智能体步骤、任务队列和上下文消耗。\n- **创作者、创业者和专业人士**：需要在自己的电脑上为项目维护统一的本地记忆。\n- **Windows 10/11 用户**：需要可按任务调整布局的本地工具，并希望通过内置反馈影响后续版本。\n\n---\n\n## 0.1 版本中已可用的功能\n\n### 1. 连接与“自动”模式\n至少配置一种连接即可开始使用。在**“自动”**模式下，系统会自行选择可用的执行引擎：\n\n| 连接 | 工作方式 | v0.1 中的能力 |\n|---|---|---|\n| **Claude Code** | 使用 Anthropic Pro / Max 订阅的官方 CLI | 复杂任务、代码、文本、规划和上下文自动压缩 |\n| **Codex** | 使用 ChatGPT Plus / Pro 订阅的官方 CLI | 处理代码仓库，并在回复过程中即时补充指令（`live-steer`） |\n| **Antigravity** | Google AI 官方 CLI | 大上下文分析（窗口阈值 `350k`）和额度跟踪 |\n| **DeepSeek Harness** | 使用 DeepSeek 余额的本地无界面配置 `dsh` | 备用且经济的执行引擎，可在“助手”标签页查看余额 |\n| **API 聚合器（OpenRouter）** | 通过 Base URL 和密钥接入任意兼容 Anthropic 的网关 | 通过本地 Claude Code CLI 进程连接外部模型（无需 Anthropic 订阅） |\n| **Qoder CLI** | 本地 CLI（检测与登录） | 连接向导可检测并支持在窗口内登录；作为对话主力引擎的功能将在下次更新推出 |\n\n### 2. 工作区与界面\n- **初始界面：**左侧为**“对话”**，带纯净状态球（球内无文字）、实时步骤流与平滑视差分隔线；右侧上方为**“资源” / “助手”**、下方为**“笔记本硬件”**，可在编辑模式下自由拖动边界调整大小。\n- **顶部栏（从右到左）：**最右侧为时钟，依次为加宽版**反馈面板（小虫图标）**、**画笔**（拖动与调整组件大小、标签和图标顺序、重置布局）、**主题**（默认**石墨**，另含青绿、午夜、深色、浅色）、**书本图标（内置指南与版本历史）**，以及**闪电图标**（含全宽**“阅读模式”**的 3 步连接向导）。\n- **本地存储：**`pamyat/`（Markdown 本地记忆）、`.claude/skills/`（本地技能）、`.ally-data/`（密钥和窗口布局，已从 Git 中排除）。\n\n## 安装与启动（Windows 10/11）\n\n**安装前，请确认系统已安装以下工具，并且可通过 `PATH` 访问：**\n1. **Node.js 24+**（支持内置模块 `node:sqlite`）\n2. **Python 3**\n3. **Git**\n4. 首次构建期间可访问互联网（用于 `npm ci` 和下载 Electron），并至少配置一个 AI 引擎或密钥。\n\n任选以下三种安装方式：\n\n### 方式 1 — 使用压缩包和熟悉的 `.exe`\n1. 下载仓库的 ZIP 压缩包，解压到不含西里尔字母的短路径，例如 `C:\\AllY`。\n2. 双击 **`AllY.exe`**——首次启动会自动检查 `node` 24+、`python` 和 `git`，安装依赖，下载 Electron，构建可执行文件 **`programma\\Dzhinni.exe`**，在桌面创建 **`AllY`** 快捷方式并打开应用窗口。\n  *若 Windows SmartScreen 对未签名的新 `.exe` 弹出提示，点击「更多信息」→「仍要运行」（启动器源码公开在 `docs/launchers/`，也可直接运行 `.\\ustanovka.ps1`）。*\n3. 之后双击 **`AllY.exe`**、桌面上的 **`AllY`** 快捷方式，或直接运行 **`programma\\Dzhinni.exe`** 即可启动。双击 **`AllY-Guide.exe`** 可在独立应用窗口中查看交互式文档与版本历史。\n4. 首次启动会打开 3 步入门向导——连接所需的 AI，然后发送第一条消息。\n\n### 方式 2 — 在终端中执行命令（PowerShell / cmd）\n打开 PowerShell，依次执行：\n\n```powershell\ngit clone https://github.com/AyarZero/ally-dzhinni.git C:\\AllY\ncd C:\\AllY\n.\\AllY.exe\n```\n\n之后可用以下命令检查构建是否就绪：\n\n```powershell\n.\\AllY.exe -Proverka\n```\n\n从终端启动：\n\n```powershell\n.\\AllY.exe\n```\n\n### 方式 3 — 给本机 AI 助手的现成提示词\n如果你的电脑上已经可以使用 Claude Code、Codex、Antigravity 或其他 AI 助手，请完整复制以下文本并发送给它：\n\n```text\n请从仓库 https://github.com/AyarZero/ally-dzhinni 在这台 Windows 电脑上安装本地桌面应用 AllY · 精灵 (v0.1)，并做好启动准备：\n1. 在终端中检查是否有 `git`、`python`（Python 3）和 `node`（需要 Node.js 24+，且能通过 `node -e \"require('node:sqlite')\"` 检查）。如果缺少工具或 Node 版本低于 24，请告知我，并在构建前帮我补装。\n2. 将仓库克隆到不含西里尔字母和空格的短路径，例如 `C:\\AllY`，然后进入该文件夹。\n3. 运行安装命令：`powershell -NoProfile -ExecutionPolicy Bypass -File .\\ustanovka.ps1`，等待 `programma\\Dzhinni.exe` 构建完成。\n4. 使用命令 `powershell -NoProfile -ExecutionPolicy Bypass -File .\\ustanovka.ps1 -Proverka` 检查构建。\n5. 检查系统中已有的 CLI 引擎（Claude Code、Codex、Antigravity、DeepSeek Harness、Qoder）或 OpenRouter 密钥，并简要告诉我哪些已就绪。\n6. 启动 `programma\\Dzhinni.exe`（或 `.\\AllY.exe`），并告诉我可以打开 AllY 窗口开始使用了。\n```\n\n*注意：已连接的 CLI 执行引擎会直接操作当前工作文件夹中的文件，不会在每次读取或修改时请求确认——请用 Git 管理重要项目。*\n\n---\n\n## 反馈与参与项目开发\n\n顶部栏右侧（时钟左侧）有一个**小虫图标按钮——“反馈”**。你可以直接通过界面：\n\n- 报告错误、界面故障或启动问题；\n- 随消息附加最多 **3 个文件**作为依据：文本日志 `.txt` / `.md`（不超过 `2 MB`）、截图 `.png` / `.jpg` / `.jpeg` / `.webp` / `.gif`（不超过 `10 MB`），或短视频 `.mp4` / `.webm` / `.mov`（不超过 `25 MB`，附件总计不超过 `30 MB`）；\n- 提议新模块、技能或使用场景。\n\n发送的**仅限表单文本和你选择的文件**——对话、个人笔记和密钥仍保留在本地。开发者的回复会回到应用内的对话中。项目采用 MIT 许可证开放：你可以在 `.claude/skills/` 中创建自己的技能，也可以参与核心功能开发。\n\n---\n\n## v0.1 的已知问题和正在处理的限制\n\n我们如实列出目前的限制和正在完善的部分：\n\n1. **需提前安装环境依赖：**安装 `v0.1` 前，必须已安装 `Node.js 24+`、`Python 3` 和 `Git`——无需手动准备软件的一体化独立 `.exe` 安装程序仍在开发中。\n2. **v0.1 客户端构建暂不显示语音输入和朗读功能：**本地语音识别（`GigaAM`）及其安装程序仍在完善，麦克风和语音按钮已暂时移除。\n3. **日记（“坦诚对话”）在 v0.1 客户端版本中暂未开放：**正在完善多引擎支持，该标签页将在近期更新中上线。\n4. **关闭窗口后，后台桥接服务延迟休眠：**关闭窗口后，如果立即重新打开另一个实例，本地桥接服务器可能要等空闲超时后才退出（最长约 9 分钟）。\n5. **Qoder 正在集成中：**连接向导可以检测本地 Qoder CLI 和登录状态，但在下个版本发布前，暂不开放将 Qoder 用作对话主力引擎。\n6. **反馈服务器的大附件接收功能正在更新：**如果在后端更新完成前，发送截图或视频时服务器返回文件大小超限或拒收错误，可立即改为仅发送文本，草稿不会丢失。\n7. **平台：**目前仅针对 **Windows 10/11** 进行构建和测试。\n\n---\n\n## 路线图与预计时间\n\n以下时间仅供参考——近期版本按周安排，较远的计划采用较宽的时间范围，并会根据用户实际反馈调整：\n\n| 预计时间 | 计划发布内容 |\n|---|---|\n| **2026 年 11 月底至 12 月初** *（1–2 周）* | 根据首批应用内反馈修复问题，完善服务器对反馈中图片/视频附件的接收支持，关闭窗口时立即终止后台桥接服务 |\n| **2026 年 12 月下半月** | 内置**“任务与项目”**管理器（每日重点、看板、日历、卡片），以及通过任意所选引擎使用**“日记”**标签页 |\n| **2027 年 1 月** | 恢复**本地语音模式**（无需云端的离线听写 + 回复朗读），推出无需手动安装 `Node.js` 和 `Git` 的简化安装程序 |\n| **2027 年 2–3 月** | **“学习”**板块（窗口内课程库，以及 AllY 使用和版本发布准备的免费入门课程）、自定义组件构建器，以及审查/内容模块 |\n| **2027 年 4–5 月** | 工作区交互式**知识图谱**、**“项目健康度”**面板（关联覆盖情况和过时节点），以及完整支持 Qoder 作为代码阅读助手 |\n| **2027 年 6–7 月** | **Android 客户端**测试版，通过安全通道连接家用电脑，无需第二套数据库；同时适配 macOS 和 Linux 桌面端 |\n| **2027 年 8 月及以后** | `v1.0` 稳定版、社区共享技能目录，以及用户多设备间的工作区同步 |\n"}, "uk": {"label": "Українська", "dir": "ltr", "rawFile": "readme/README.uk.md", "markdown": "# AllY · Джинні (v0.1)\n\nЛокальна десктопна оболонка для Windows, що об’єднує кілька нейромереж в одному вікні зі спільною історією розмови, локальною пам’яттю на диску, чергою завдань, і контролем лімітів.\n\n*День народження AllY · Джинні — 23 листопада 2026 року. Ліцензія: MIT.*\n\n---\n\n## Що це за застосунок і яку проблему він розв’язує\n\nЗа регулярної роботи з ШІ завдання швидко розпорошуються між різними вкладками браузера, консольними вікнами й окремими ключами. Коли в однієї моделі вичерпується п’ятигодинний ліміт, доводиться відкривати іншу й заново пояснювати контекст проєкту.\n\n**AllY · Джинні** розв’язує чотири практичні завдання:\n\n- **Єдиний контекст між моделями.** Історія розмови й ваша база правил зберігаються локально в Markdown-файлах (`pamyat/`). Перемкнути нейромережу, модель або глибину міркувань можна прямо в рядку введення, щоб наступна модель продовжила завдання з того самого місця.\n- **Прозора робота CLI-агентів.** У звичайному терміналі складно вчасно побачити поточний крок агента й втрутитися під час роботи. В AllY ліворуч показано сферу стану й стрічку поточних дій за плавною вертикальною межею зі змінною шириною, а праворуч — листування й чергу завдань із підтримкою уточнень на ходу (`live-steer`), редагування черги та прискорення важливого повідомлення.\n- **Контроль лімітів і контекстного вікна.** Віджет **«Ресурси»** показує провідну нейромережу, заповнення контексту (з порогом `350k`), 5-годинні й тижневі квоти підписок, а вкладка **«Помічники»** збирає баланси решти підключень. Показники зчитуються локально без платних фонових викликів.\n- **Контроль даних і прямі підключення.** Листування, нотатки `pamyat/`, навички `.claude/skills/` і локальні налаштування `.ally-data/` залишаються на вашому комп’ютері. Ви використовуєте власні підписки й ключі безпосередньо в обраних провайдерів.\n\n---\n\n## Для кого створено застосунок\n\n- **Розробники й вайбкодери**, які ведуть проєкти через Claude Code, Codex, Antigravity або DeepSeek і хочуть бачити кроки агентів, чергу й витрати контексту в одному керованому вікні.\n- **Автори, підприємці й фахівці**, яким потрібна єдина локальна пам’ять для своїх проєктів на власному ПК.\n- **Користувачі Windows 10/11**, яким потрібен локальний інструмент із налаштуванням компонування під свої завдання й можливістю впливати на наступні релізи через вбудований зворотний зв’язок.\n\n---\n\n## Що реально працює у версії 0.1\n\n### 1. Підключення й режим «Авто»\nДля початку достатньо підключити хоча б один варіант. У режимі **«Авто»** система сама вибирає доступного виконавця:\n\n| Підключення | Спосіб роботи | Що вміє у v0.1 |\n|---|---|---|\n| **Claude Code** | Офіційний CLI за підпискою Anthropic Pro / Max | Складні завдання, код, тексти, планування й автоматичне стиснення контексту |\n| **Codex** | Офіційний CLI за підпискою ChatGPT Plus / Pro | Робота з репозиторіями й уточнення безпосередньо під час відповіді (`live-steer`) |\n| **Antigravity** | Офіційний CLI Google AI | Розбір із великим контекстом (поріг вікна `350k`) і відстеженням квот |\n| **DeepSeek Harness** | Локальний headless-профіль `dsh` з оплатою з балансу DeepSeek | Резервний і економний виконавець, перевірка балансу на вкладці «Помічники» |\n| **Агрегатор API (OpenRouter)** | Будь-який Anthropic-сумісний шлюз за Base URL і ключем | Підключення зовнішніх моделей через локальний процес Claude Code CLI (без підписки Anthropic) |\n| **Qoder CLI** | Локальний CLI (виявлення та вхід) | Визначається майстром підключення (включно зі входом із вікна); роль провідного виконавця в чаті з’явиться в наступному оновленні |\n\n### 2. Робочий простір та інтерфейс\n- **Початковий екран:** ліворуч розташоване **«Листування»** з чистою сферою стану, стрічкою кроків і плавною вертикальною межею; праворуч — віджети **«Ресурси» / «Помічники»** (згори) і **«Ноутбук»** (знизу), межі яких вільно тягнуться в режимі налаштування.\n- **Верхня панель (справа наліво):** годинник праворуч, широка панель **зворотного зв’язку (жучок)** для тексту та вкладень, **пензель** (перетягування й зміна розмірів блоків, вкладок та іконок, скидання), **теми** (типово **Графіт**, також Бірюзова, Північ, Темна й Світла), **книга (довідка та звід версій)** усередині вікна й акцентна **блискавка** (3-кроковий майстер підключень із широким **«Режимом читання»**).\n- **Локальне зберігання:** `pamyat/` (локальна Markdown-пам’ять), `.claude/skills/` (локальні навички), `.ally-data/` (ключі й компонування вікна, виключена з Git).\n\n## Встановлення й запуск (Windows 10/11)\n\n**Перед встановленням переконайтеся, що в системі вже встановлені й доступні в `PATH`:**\n1. **Node.js 24+** (з підтримкою вбудованого модуля `node:sqlite`)\n2. **Python 3**\n3. **Git**\n4. Доступ до інтернету на час першого збирання (`npm ci` і завантаження Electron) та хоча б один підключений ШІ-рушій або ключ.\n\nВиберіть будь-який із трьох зручних способів встановлення:\n\n### Спосіб 1 — через архів і знайомий `.exe`\n1. Завантажте ZIP-архів репозиторію й розпакуйте його в короткий шлях без кирилиці, наприклад `C:\\AllY`.\n2. Двічі клацніть **`AllY.exe`** — під час першого запуску він перевірить `node` 24+, `python` і `git`, встановить залежності, завантажить Electron, збере виконуваний файл **`programma\\Dzhinni.exe`**, створить ярлик **`AllY`** на робочому столі й одразу відкриє вікно.\n  *Якщо Windows SmartScreen покаже попередження для нового непідписаного `.exe`, натисніть «Докладніше» → «Виконати в будь-якому разі» (вихідний код лаунчерів відкритий у `docs/launchers/`, або запустіть `.\\ustanovka.ps1` напряму).*\n3. Надалі запускайте застосунок подвійним клацанням **`AllY.exe`**, ярлика **`AllY`** на робочому столі або безпосередньо через **`programma\\Dzhinni.exe`**. Документацію та звід версій в окремому вікні застосунку відкриває **`AllY-Guide.exe`**.\n4. Під час першого запуску відкриється 3-кроковий майстер початкового налаштування — підключіть потрібну нейромережу й надішліть перше повідомлення.\n\n### Спосіб 2 — командами в терміналі (PowerShell / cmd)\nВідкрийте PowerShell і виконайте по черзі:\n\n```powershell\ngit clone https://github.com/AyarZero/ally-dzhinni.git C:\\AllY\ncd C:\\AllY\n.\\AllY.exe\n```\n\nПеревірити готовність збірки пізніше можна командою:\n\n```powershell\n.\\AllY.exe -Proverka\n```\n\nЗапуск із термінала:\n\n```powershell\n.\\AllY.exe\n```\n\n### Спосіб 3 — готовий промпт для вашої локальної нейромережі\nЯкщо у вас на комп’ютері вже працює Claude Code, Codex, Antigravity або інший ШІ-помічник, скопіюйте цей текст повністю й надішліть йому:\n\n```text\nВстанови й підготуй до запуску локальний десктопний застосунок AllY · Джинні (v0.1) на цьому ПК Windows із репозиторію https://github.com/AyarZero/ally-dzhinni:\n1. Перевір у терміналі наявність `git`, `python` (Python 3) і `node` (потрібна версія Node.js 24+ з успішною перевіркою `node -e \"require('node:sqlite')\"`). Якщо чогось бракує або версія Node нижча за 24 — повідом мені й допоможи встановити потрібне перед збиранням.\n2. Клонуй репозиторій у короткий шлях без кирилиці й пробілів, наприклад `C:\\AllY`, і перейди в цю папку.\n3. Запусти встановлення: `powershell -NoProfile -ExecutionPolicy Bypass -File .\\ustanovka.ps1` і дочекайся збирання `programma\\Dzhinni.exe`.\n4. Перевір збірку командою `powershell -NoProfile -ExecutionPolicy Bypass -File .\\ustanovka.ps1 -Proverka`.\n5. Перевір, які CLI-рушії (Claude Code, Codex, Antigravity, DeepSeek Harness, Qoder) або ключі OpenRouter уже доступні в системі, і коротко підкажи мені, що вже готове.\n6. Запусти `programma\\Dzhinni.exe` (або `.\\AllY.exe`) і скажи мені, що можна відкривати вікно AllY та починати роботу.\n```\n\n*Примітка: підключені CLI-виконавці працюють із файлами відкритої робочої папки безпосередньо, без запиту на кожне читання чи редагування — тримайте важливі проєкти під Git.*\n\n---\n\n## Зворотний зв’язок та участь у розвитку проєкту\n\nУ правій частині шапки (ліворуч від годинника) розташована кнопка зі **значком жучка — «Зворотний зв’язок»**. Через неї прямо з інтерфейсу можна:\n\n- повідомити про помилку, несправність інтерфейсу або проблему запуску;\n- прикріпити до повідомлення до **3 файлів** на підтвердження: текстові журнали `.txt` / `.md` (до `2 МБ`), знімки екрана `.png` / `.jpg` / `.jpeg` / `.webp` / `.gif` (до `10 МБ`) або короткі відео `.mp4` / `.webm` / `.mov` (до `25 МБ`, сумарно до `30 МБ`);\n- запропонувати новий модуль, навичку або сценарій використання.\n\nНадсилаються **лише текст форми й вибрані вами файли** — листування, особисті нотатки й ключі залишаються локально. Відповіді розробників надходять назад у листування застосунку. Проєкт відкритий за ліцензією MIT: ви можете створювати власні навички в `.claude/skills/` і брати участь у доопрацюванні ядра.\n\n---\n\n## Відомі проблеми й обмеження v0.1, над якими ми зараз працюємо\n\nМи чесно фіксуємо те, що поки обмежене або доопрацьовується саме зараз:\n\n1. **Залежності середовища встановлюються заздалегідь:** для встановлення `v0.1` потрібні вже встановлені `Node.js 24+`, `Python 3` і `Git` — єдиний автономний `.exe`-інсталятор без ручної підготовки програмного забезпечення ще в роботі.\n2. **Голосове введення й озвучення приховані в клієнтській збірці v0.1:** кнопки мікрофона й голосу тимчасово прибрано на етапі доопрацювання локального розпізнавання мовлення (`GigaAM`) і його інсталятора.\n3. **Щоденник («Чесна розмова») прихований у клієнтській збірці v0.1:** доопрацьовується підтримка всіх рушіїв; вкладка відкриється у найближчому оновленні.\n4. **Поступове засинання фонового мосту після закриття вікна:** після закриття вікна локальний сервер мосту може завершувати роботу за тайм-аутом простою (до ~9 хвилин), якщо одразу повторно відкривати інший екземпляр.\n5. **Qoder у процесі інтеграції:** майстер підключень визначає локальний CLI Qoder і статус входу, але використання Qoder у ролі провідного виконавця в листуванні поки закрите до наступного релізу.\n6. **Поетапне впровадження серверного приймання великих вкладень у відгуках:** якщо під час надсилання знімка екрана або відео сервер відгуків поверне помилку розміру чи відхилить файл до завершення оновлення бекенду, форму можна одразу надіслати текстом без втрати чернетки.\n7. **Платформа:** протестовано й зібрано лише під **Windows 10/11**.\n\n---\n\n## Дорожня карта й орієнтовні терміни\n\nТерміни орієнтовні — найближчі релізи розписані за тижнями, віддаленіші наведені широкими проміжками й зсуваються відповідно до реальних відгуків користувачів:\n\n| Орієнтовний термін | Що планується випустити |\n|---|---|\n| **Кінець листопада — початок грудня 2026** *(1–2 тижні)* | Виправлення за першими відгуками з інтерфейсу, повноцінне серверне приймання фото- й відеовкладень у відгуках, миттєве завершення фонового мосту після закриття вікна |\n| **Друга половина грудня 2026** | Вбудований трекер **«Завдання та Проєкти»** (фокус на день, дошка, календар, картки) і робота вкладки **«Щоденник»** через будь-який вибраний рушій |\n| **Січень 2027** | Повернення **локального голосового режиму** (офлайн-диктування без хмари + озвучення відповідей) і спрощений інсталятор без ручного встановлення `Node.js` і `Git` |\n| **Лютий — березень 2027** | Розділ **«Навчання»** (бібліотека уроків усередині вікна й безплатний вступний курс з AllY та підготовки релізів), конструктор користувацьких віджетів і модулі ревізії/контенту |\n| **Квітень — травень 2027** | Інтерактивний **граф знань** робочого простору, панель **«Здоров’я проєкту»** (покриття зв’язків і застарілі вузли) та повноцінна робота Qoder як помічника з читання коду |\n| **Червень — липень 2027** | Бета-реліз **Android-клієнта** з підключенням до домашнього ПК захищеним каналом без другої бази даних + адаптація десктопного застосунку під macOS і Linux |\n| **Серпень 2027 і далі** | Стабільний реліз `v1.0`, каталог спільних навичок спільноти й синхронізація робочого простору між кількома пристроями користувача |\n"}, "vi": {"label": "Tiếng Việt", "dir": "ltr", "rawFile": "readme/README.vi.md", "markdown": "# AllY · Djinni (v0.1)\n\nỨng dụng desktop cục bộ cho Windows, kết hợp nhiều mô hình AI trong một cửa sổ với lịch sử trò chuyện chung, bộ nhớ cục bộ trên ổ đĩa, hàng đợi tác vụ và công cụ theo dõi hạn mức.\n\n*Ngày sinh của AllY · Djinni — ngày 23 tháng 11 năm 2026. Giấy phép: MIT.*\n\n---\n\n## Ứng dụng này là gì và giải quyết vấn đề nào\n\nKhi thường xuyên làm việc với AI, các tác vụ nhanh chóng phân tán qua nhiều tab trình duyệt, cửa sổ dòng lệnh và khóa riêng lẻ. Khi một mô hình hết hạn mức 5 giờ, bạn phải mở mô hình khác rồi giải thích lại ngữ cảnh dự án.\n\n**AllY · Djinni** giải quyết bốn nhu cầu thực tế:\n\n- **Ngữ cảnh thống nhất giữa các mô hình.** Lịch sử trò chuyện và bộ quy tắc của bạn được lưu cục bộ trong các tệp Markdown (`pamyat/`). Bạn có thể đổi hệ thống AI, mô hình hoặc độ sâu suy luận ngay tại ô nhập để mô hình tiếp theo tiếp tục tác vụ từ đúng chỗ đang dở.\n- **Theo dõi rõ hoạt động của tác nhân CLI.** Trong terminal thông thường, khó kịp thấy bước hiện tại của tác nhân và can thiệp khi đang chạy. Trong AllY, bên trái hiển thị quả cầu trạng thái và dòng hoạt động hiện tại, ngăn với bên phải bằng đường phân cách dọc có thể kéo để điều chỉnh chiều rộng; bên phải là cuộc trò chuyện và hàng đợi tác vụ, hỗ trợ bổ sung chỉ dẫn ngay khi đang xử lý (`live-steer`), sửa hàng đợi và ưu tiên thông điệp quan trọng.\n- **Theo dõi hạn mức và cửa sổ ngữ cảnh.** Tiện ích **“Tài nguyên”** hiển thị hệ thống AI chính, mức sử dụng ngữ cảnh (với ngưỡng `350k`), hạn mức 5 giờ và hằng tuần của các gói đăng ký; tab **“Trợ lý”** tổng hợp số dư của các kết nối còn lại. Các chỉ số được đọc cục bộ, không phát sinh lệnh gọi nền có tính phí.\n- **Kiểm soát dữ liệu và kết nối trực tiếp.** Cuộc trò chuyện, ghi chú `pamyat/`, kỹ năng `.claude/skills/` và thiết lập cục bộ `.ally-data/` đều ở trên máy tính của bạn. Bạn dùng trực tiếp gói đăng ký và khóa của mình với nhà cung cấp đã chọn.\n\n---\n\n## Ứng dụng dành cho ai\n\n- **Lập trình viên và người lập trình theo kiểu vibe coding**, đang làm dự án qua Claude Code, Codex, Antigravity hoặc DeepSeek và muốn theo dõi các bước của tác nhân, hàng đợi và mức sử dụng ngữ cảnh trong một cửa sổ dễ kiểm soát.\n- **Người viết, doanh nhân và chuyên gia**, cần bộ nhớ cục bộ thống nhất cho các dự án trên PC của mình.\n- **Người dùng Windows 10/11**, cần công cụ cục bộ có bố cục tùy chỉnh theo công việc và có thể góp ý cho các bản phát hành tiếp theo qua tính năng phản hồi tích hợp.\n\n---\n\n## Những gì thực sự hoạt động trong phiên bản 0.1\n\n### 1. Kết nối và chế độ “Tự động”\nChỉ cần thiết lập ít nhất một kết nối để bắt đầu. Trong chế độ **“Tự động”**, hệ thống tự chọn công cụ thực thi đang khả dụng:\n\n| Kết nối | Cách hoạt động | Khả năng trong v0.1 |\n|---|---|---|\n| **Claude Code** | CLI chính thức qua gói đăng ký Anthropic Pro / Max | Tác vụ phức tạp, mã nguồn, văn bản, lập kế hoạch và tự động nén ngữ cảnh |\n| **Codex** | CLI chính thức qua gói đăng ký ChatGPT Plus / Pro | Làm việc với kho mã và bổ sung chỉ dẫn ngay khi đang trả lời (`live-steer`) |\n| **Antigravity** | CLI chính thức của Google AI | Phân tích với ngữ cảnh lớn (ngưỡng cửa sổ `350k`) và theo dõi hạn mức |\n| **DeepSeek Harness** | Cấu hình headless cục bộ `dsh`, sử dụng số dư DeepSeek | Công cụ thực thi dự phòng, tiết kiệm chi phí; kiểm tra số dư trong tab “Trợ lý” |\n| **Bộ tổng hợp API (OpenRouter)** | Bất kỳ cổng tương thích Anthropic nào, qua Base URL và khóa | Kết nối mô hình bên ngoài qua tiến trình Claude Code CLI cục bộ (không cần gói đăng ký Anthropic) |\n| **Qoder CLI** | CLI cục bộ (phát hiện và đăng nhập) | Được trình hướng dẫn kết nối nhận diện (bao gồm đăng nhập ngay trong cửa sổ); vai trò chính trong trò chuyện sẽ có ở bản cập nhật tiếp theo |\n\n### 2. Không gian làm việc và giao diện\n- **Màn hình khởi đầu:** bên trái là **“Trò chuyện”** với quả cầu trạng thái gọn sạch và luồng bước thực thi; bên phải gồm **“Tài nguyên” / “Trợ lý”** (trên) và **“Máy tính”** (dưới), cho phép kéo giãn kích thước mượt mà.\n- **Thanh trên cùng (từ phải sang trái):** đồng hồ ở mép phải, khung **phản hồi rộng (con bọ)** cho văn bản và tệp đính kèm, **cọ vẽ** (kéo thả, chỉnh kích thước khối và đặt lại bố cục), **chủ đề** (mặc định **Than chì**, cùng Ngọc lam, Nửa đêm, Tối, Sáng), **biểu tượng sách (Hướng dẫn & Lịch sử phiên bản tích hợp)** và **tia sét** (trình hướng dẫn 3 bước với **“Chế độ đọc”** toàn khung).\n- **Lưu trữ cục bộ:** `pamyat/` (bộ nhớ Markdown cục bộ), `.claude/skills/` (kỹ năng cục bộ), `.ally-data/` (khóa và bố cục cửa sổ, được loại trừ khỏi Git).\n\n## Cài đặt và khởi chạy (Windows 10/11)\n\n**Trước khi cài đặt, hãy bảo đảm hệ thống đã cài và có thể truy cập qua `PATH`:**\n1. **Node.js 24+** (hỗ trợ mô-đun tích hợp `node:sqlite`)\n2. **Python 3**\n3. **Git**\n4. Kết nối internet trong lần dựng đầu tiên (`npm ci` và tải Electron), cùng ít nhất một bộ máy AI đã kết nối hoặc một khóa.\n\nChọn một trong ba cách cài đặt thuận tiện sau:\n\n### Cách 1 — dùng tệp nén và tệp `.exe` quen thuộc\n1. Tải tệp ZIP của kho mã và giải nén vào đường dẫn ngắn, không có ký tự Cyrillic, chẳng hạn `C:\\AllY`.\n2. Nhấp đúp vào **`AllY.exe`** — ở lần chạy đầu tiên, tệp sẽ kiểm tra `node` 24+, `python` và `git`, cài các phần phụ thuộc, tải Electron, dựng **`programma\\Dzhinni.exe`**, tạo lối tắt **`AllY`** trên màn hình desktop và tự mở cửa sổ ứng dụng.\n  *Nếu Windows SmartScreen cảnh báo tệp `.exe` mới chưa ký số, chọn **More info → Run anyway** (mã nguồn bộ khởi chạy công khai tại `docs/launchers/`, hoặc chạy trực tiếp `.\\ustanovka.ps1`).*\n3. Những lần sau, hãy khởi chạy ứng dụng bằng cách nhấp đúp **`AllY.exe`**, lối tắt **`AllY`** trên desktop hoặc trực tiếp **`programma\\Dzhinni.exe`**. Để mở tài liệu và lịch sử phiên bản trong cửa sổ ứng dụng riêng, hãy chạy **`AllY-Guide.exe`**.\n4. Ở lần chạy đầu tiên, trình hướng dẫn khởi động 3 bước sẽ mở — kết nối hệ thống AI bạn cần rồi gửi tin nhắn đầu tiên.\n\n### Cách 2 — dùng lệnh trong terminal (PowerShell / cmd)\nMở PowerShell và chạy lần lượt:\n\n```powershell\ngit clone https://github.com/AyarZero/ally-dzhinni.git C:\\AllY\ncd C:\\AllY\n.\\AllY.exe\n```\n\nSau đó, bạn có thể kiểm tra bản dựng đã sẵn sàng bằng lệnh:\n\n```powershell\n.\\AllY.exe -Proverka\n```\n\nKhởi chạy từ terminal:\n\n```powershell\n.\\AllY.exe\n```\n\n### Cách 3 — lời nhắc soạn sẵn cho AI cục bộ của bạn\nNếu máy tính của bạn đã có Claude Code, Codex, Antigravity hoặc một trợ lý AI khác đang hoạt động, hãy sao chép toàn bộ nội dung sau và gửi cho trợ lý đó:\n\n```text\nHãy cài đặt và chuẩn bị khởi chạy ứng dụng desktop cục bộ AllY · Djinni (v0.1) trên PC Windows này từ kho mã https://github.com/AyarZero/ally-dzhinni:\n1. Kiểm tra trong terminal xem đã có `git`, `python` (Python 3) và `node` chưa (cần phiên bản Node.js 24+ và lệnh kiểm tra `node -e \"require('node:sqlite')\"` phải chạy thành công). Nếu thiếu thành phần nào hoặc phiên bản Node thấp hơn 24, hãy báo cho tôi và hỗ trợ cài bổ sung trước khi dựng.\n2. Sao chép kho mã vào đường dẫn ngắn, không có ký tự Cyrillic và dấu cách, chẳng hạn `C:\\AllY`, rồi chuyển vào thư mục đó.\n3. Chạy cài đặt: `powershell -NoProfile -ExecutionPolicy Bypass -File .\\ustanovka.ps1` và đợi dựng xong `programma\\Dzhinni.exe`.\n4. Kiểm tra bản dựng bằng lệnh `powershell -NoProfile -ExecutionPolicy Bypass -File .\\ustanovka.ps1 -Proverka`.\n5. Kiểm tra những bộ máy CLI nào (Claude Code, Codex, Antigravity, DeepSeek Harness, Qoder) hoặc khóa OpenRouter đã có sẵn trong hệ thống, rồi cho tôi biết ngắn gọn những gì đã sẵn sàng.\n6. Khởi chạy `programma\\Dzhinni.exe` (hoặc `.\\AllY.exe`) và báo cho tôi rằng có thể mở cửa sổ AllY để bắt đầu làm việc.\n```\n\n*Lưu ý: các công cụ thực thi CLI đã kết nối làm việc trực tiếp với tệp trong thư mục làm việc đang mở mà không hỏi lại mỗi lần đọc hoặc sửa — hãy dùng Git để quản lý các dự án quan trọng.*\n\n---\n\n## Phản hồi và tham gia phát triển dự án\n\nỞ bên phải thanh đầu trang (bên trái đồng hồ) có nút **biểu tượng con bọ — “Phản hồi”**. Ngay trong giao diện, bạn có thể dùng nút này để:\n\n- báo lỗi, sự cố giao diện hoặc vấn đề khởi chạy;\n- đính kèm tối đa **3 tệp** minh họa: nhật ký văn bản `.txt` / `.md` (tối đa `2 MB`), ảnh chụp màn hình `.png` / `.jpg` / `.jpeg` / `.webp` / `.gif` (tối đa `10 MB`) hoặc video ngắn `.mp4` / `.webm` / `.mov` (tối đa `25 MB`, tổng cộng tối đa `30 MB`);\n- đề xuất mô-đun, kỹ năng hoặc tình huống sử dụng mới.\n\n**Chỉ nội dung biểu mẫu và những tệp bạn chọn** được gửi đi — cuộc trò chuyện, ghi chú cá nhân và khóa vẫn được lưu cục bộ. Phản hồi của nhà phát triển sẽ được gửi về cuộc trò chuyện trong ứng dụng. Dự án mã nguồn mở theo giấy phép MIT: bạn có thể tạo kỹ năng riêng trong `.claude/skills/` và tham gia cải tiến phần lõi.\n\n---\n\n## Các vấn đề và giới hạn đã biết của v0.1 đang được xử lý\n\nChúng tôi ghi rõ những giới hạn hiện có và những phần đang được hoàn thiện:\n\n1. **Phải cài sẵn các thành phần môi trường:** để cài `v0.1`, cần có sẵn `Node.js 24+`, `Python 3` và `Git` — bộ cài `.exe` độc lập, trọn gói, không cần chuẩn bị phần mềm thủ công vẫn đang được phát triển.\n2. **Nhập liệu bằng giọng nói và đọc thành tiếng bị ẩn trong bản dựng ứng dụng v0.1:** các nút micrô và giọng nói tạm thời được gỡ trong khi hoàn thiện nhận dạng giọng nói cục bộ (`GigaAM`) và bộ cài của tính năng này.\n3. **Nhật ký (“Trò chuyện chân thành”) được ẩn trong bản dựng v0.1:** tính năng đa nền tảng AI đang được hoàn thiện và sẽ mở lại ở bản cập nhật sắp tới.\n4. **Cầu nối nền tắt trễ sau khi đóng cửa sổ:** khi đóng cửa sổ, máy chủ cầu nối cục bộ có thể chỉ kết thúc sau thời gian chờ không hoạt động (tối đa khoảng 9 phút), nếu bạn mở lại ngay một phiên bản khác.\n5. **Qoder đang được tích hợp:** trình hướng dẫn kết nối nhận diện CLI Qoder cục bộ và trạng thái đăng nhập, nhưng việc dùng Qoder làm công cụ chính trong trò chuyện vẫn chưa được mở cho đến bản phát hành tiếp theo.\n6. **Máy chủ đang được cập nhật để nhận tệp đính kèm lớn trong phản hồi:** nếu máy chủ phản hồi báo lỗi kích thước hoặc từ chối tệp khi gửi ảnh chụp màn hình hay video trước khi hoàn tất cập nhật backend, bạn có thể gửi ngay biểu mẫu chỉ có văn bản mà không mất bản nháp.\n7. **Nền tảng:** chỉ được kiểm thử và dựng cho **Windows 10/11**.\n\n---\n\n## Lộ trình và thời gian dự kiến\n\nCác mốc thời gian chỉ mang tính dự kiến — những bản phát hành gần nhất được lên lịch theo tuần, các bản xa hơn dùng khoảng thời gian rộng hơn và có thể điều chỉnh theo phản hồi thực tế của người dùng:\n\n| Thời gian dự kiến | Nội dung dự kiến phát hành |\n|---|---|\n| **Cuối tháng 11 — đầu tháng 12 năm 2026** *(1–2 tuần)* | Sửa lỗi theo những phản hồi đầu tiên gửi từ giao diện, hỗ trợ đầy đủ phía máy chủ cho ảnh/video đính kèm trong phản hồi, kết thúc cầu nối nền ngay khi đóng cửa sổ |\n| **Nửa cuối tháng 12 năm 2026** | Công cụ theo dõi **“Tác vụ và Dự án”** tích hợp (trọng tâm trong ngày, bảng, lịch, thẻ) và tab **“Nhật ký”** hoạt động qua bất kỳ bộ máy nào được chọn |\n| **Tháng 1 năm 2027** | Đưa **chế độ giọng nói cục bộ** trở lại (nhập liệu giọng nói ngoại tuyến, không qua đám mây + đọc câu trả lời) và bộ cài đơn giản hơn, không cần cài `Node.js` và `Git` thủ công |\n| **Tháng 2 — tháng 3 năm 2027** | Mục **“Học tập”** (thư viện bài học ngay trong cửa sổ và khóa nhập môn miễn phí về AllY và chuẩn bị bản phát hành), công cụ tạo tiện ích tùy chỉnh và các mô-đun rà soát/nội dung |\n| **Tháng 4 — tháng 5 năm 2027** | **Đồ thị tri thức** tương tác của không gian làm việc, bảng **“Sức khỏe dự án”** (độ bao phủ liên kết và các nút lỗi thời) cùng khả năng dùng Qoder đầy đủ làm trợ lý đọc mã |\n| **Tháng 6 — tháng 7 năm 2027** | Bản beta của **ứng dụng Android**, kết nối với PC tại nhà qua kênh bảo mật, không cần cơ sở dữ liệu thứ hai + điều chỉnh ứng dụng desktop cho macOS và Linux |\n| **Từ tháng 8 năm 2027 trở đi** | Bản phát hành ổn định `v1.0`, danh mục kỹ năng dùng chung của cộng đồng và đồng bộ không gian làm việc giữa nhiều thiết bị của người dùng |\n"}, "hi": {"label": "हिन्दी", "dir": "ltr", "rawFile": "readme/README.hi.md", "markdown": "# AllY · जिन्नी (v0.1)\n\nWindows के लिए स्थानीय डेस्कटॉप ऐप, जो कई AI मॉडल को एक ही विंडो में साझा बातचीत के इतिहास, डिस्क पर स्थानीय मेमोरी, कार्य कतार और उपयोग सीमाओं की निगरानी के साथ जोड़ता है।\n\n*AllY · जिन्नी का जन्मदिन — 23 नवंबर 2026। लाइसेंस: MIT।*\n\n---\n\n## यह ऐप क्या है और किस समस्या को हल करता है\n\nAI के नियमित इस्तेमाल में काम जल्दी ही ब्राउज़र के अलग-अलग टैब, कंसोल विंडो और अलग-अलग कुंजियों में बिखर जाते हैं। जब एक मॉडल की पाँच घंटे की सीमा खत्म होती है, तो दूसरा खोलकर प्रोजेक्ट का संदर्भ फिर से समझाना पड़ता है।\n\n**AllY · जिन्नी** चार व्यावहारिक समस्याएँ हल करता है:\n\n- **मॉडल के बीच साझा संदर्भ।** बातचीत का इतिहास और आपके नियमों का संग्रह स्थानीय Markdown फ़ाइलों (`pamyat/`) में रहता है। इनपुट पंक्ति से ही AI इंजन, मॉडल या तर्क की गहराई बदल सकते हैं, ताकि अगला मॉडल काम वहीं से जारी रखे।\n- **CLI एजेंट की गतिविधियों की स्पष्ट जानकारी।** सामान्य टर्मिनल में एजेंट का मौजूदा चरण समय पर देखना और बीच में हस्तक्षेप करना कठिन होता है। AllY में बाईं ओर स्थिति का गोला और वर्तमान गतिविधियों की फ़ीड है, जिसे चौड़ाई बदलने वाले सहज लंबवत विभाजक से अलग किया गया है। दाईं ओर बातचीत और कार्य कतार है, जिसमें चलते-चलते निर्देश स्पष्ट करना (`live-steer`), कतार संपादित करना और ज़रूरी संदेश को प्राथमिकता देना संभव है।\n- **उपयोग सीमाओं और कॉन्टेक्स्ट विंडो की निगरानी।** **«संसाधन»** विजेट मुख्य AI इंजन, कॉन्टेक्स्ट का भराव (`350k` सीमा के साथ), सदस्यताओं के 5-घंटे और साप्ताहिक कोटे दिखाता है। **«सहायक»** टैब बाकी कनेक्शन के बैलेंस दिखाता है। आँकड़े स्थानीय रूप से पढ़े जाते हैं, बिना किसी सशुल्क बैकग्राउंड कॉल के।\n- **डेटा पर नियंत्रण और सीधे कनेक्शन।** बातचीत, `pamyat/` के नोट्स, `.claude/skills/` के कौशल और `.ally-data/` की स्थानीय सेटिंग आपके कंप्यूटर पर ही रहती हैं। आप चुने हुए प्रदाताओं की अपनी सदस्यताएँ और कुंजियाँ सीधे इस्तेमाल करते हैं।\n\n---\n\n## यह ऐप किसके लिए है\n\n- **डेवलपर और वाइब कोडर**, जो Claude Code, Codex, Antigravity या DeepSeek से प्रोजेक्ट पर काम करते हैं और एजेंट के चरण, कार्य कतार तथा कॉन्टेक्स्ट की खपत एक नियंत्रित विंडो में देखना चाहते हैं।\n- **लेखक, उद्यमी और विशेषज्ञ**, जिन्हें अपने पीसी पर अपने प्रोजेक्ट के लिए साझा स्थानीय मेमोरी चाहिए।\n- **Windows 10/11 उपयोगकर्ता**, जिन्हें अपने काम के अनुसार लेआउट बदलने वाला स्थानीय टूल चाहिए और जो ऐप में मौजूद फ़ीडबैक के ज़रिए अगले रिलीज़ को दिशा देना चाहते हैं।\n\n---\n\n## संस्करण 0.1 में वास्तव में क्या काम करता है\n\n### 1. कनेक्शन और «ऑटो» मोड\nशुरू करने के लिए कम से कम एक विकल्प कनेक्ट करना पर्याप्त है। **«ऑटो»** मोड में सिस्टम उपलब्ध एजेंट खुद चुनता है:\n\n| कनेक्शन | काम करने का तरीका | v0.1 में क्षमताएँ |\n|---|---|---|\n| **Claude Code** | Anthropic Pro / Max सदस्यता वाला आधिकारिक CLI | जटिल कार्य, कोड, लेखन, योजना और कॉन्टेक्स्ट का स्वतः संक्षेपण |\n| **Codex** | ChatGPT Plus / Pro सदस्यता वाला आधिकारिक CLI | रिपॉज़िटरी पर काम और उत्तर के दौरान ही निर्देश स्पष्ट करना (`live-steer`) |\n| **Antigravity** | Google AI का आधिकारिक CLI | बड़े कॉन्टेक्स्ट का विश्लेषण (विंडो सीमा `350k`) और कोटे की निगरानी |\n| **DeepSeek Harness** | DeepSeek बैलेंस पर चलने वाला स्थानीय headless प्रोफ़ाइल `dsh` | वैकल्पिक और किफ़ायती एजेंट, «सहायक» टैब में बैलेंस की जाँच |\n| **API एग्रीगेटर (OpenRouter)** | Base URL और कुंजी के ज़रिए कोई भी Anthropic-संगत गेटवे | स्थानीय Claude Code CLI प्रक्रिया से बाहरी मॉडल कनेक्ट करना (Anthropic सदस्यता के बिना) |\n| **Qoder CLI** | स्थानीय CLI (पहचान और लॉगिन) | कनेक्शन विज़ार्ड इसे पहचानता है (विंडो से लॉगिन सहित); चैट में मुख्य एजेंट की भूमिका अगले अपडेट में आएगी |\n\n### 2. कार्यक्षेत्र और इंटरफ़ेस\n- **शुरुआती स्क्रीन:** बाईं ओर साफ स्थिति-गोले और चरण-प्रवाह के साथ **«बातचीत»**, और दाईं ओर **«संसाधन» / «सहायक»** (ऊपर) तथा **«लैपटॉप»** मॉनिटर (नीचे) खुले हैं; लेआउट मोड में इनकी ऊँचाई-चौड़ाई बदली जा सकती है।\n- **ऊपरी बार (दाएँ से बाएँ):** दाईं ओर घड़ी, चौड़ा **फ़ीडबैक पैनल (कीड़े का चिह्न)**, **ब्रश** (विजेट खींचना व आकार बदलना, लेआउट रीसेट), **थीम** (डिफ़ॉल्ट **ग्रेफ़ाइट**, साथ ही फ़िरोज़ी, मध्यरात्रि, गहरी, हल्की), ऐप के भीतर **पुस्तक चिह्न (गाइड व संस्करण इतिहास)** और **बिजली का चिह्न** (पूर्ण-चौड़ाई **«रीडिंग मोड»** सहित 3-चरणीय विज़ार्ड)।\n- **स्थानीय संग्रहण:** `pamyat/` (स्थानीय Markdown मेमोरी), `.claude/skills/` (स्थानीय कौशल), `.ally-data/` (कुंजियाँ और विंडो लेआउट; Git से बाहर रखा गया है)।\n\n## इंस्टॉलेशन और शुरुआत (Windows 10/11)\n\n**इंस्टॉल करने से पहले सुनिश्चित करें कि ये सिस्टम में पहले से स्थापित हैं और `PATH` में उपलब्ध हैं:**\n1. **Node.js 24+** (बिल्ट-इन `node:sqlite` मॉड्यूल के समर्थन के साथ)\n2. **Python 3**\n3. **Git**\n4. पहली बिल्ड के दौरान इंटरनेट कनेक्शन (`npm ci` और Electron डाउनलोड के लिए) और कम से कम एक कनेक्ट किया हुआ AI इंजन या कुंजी।\n\nइंस्टॉलेशन के तीन तरीकों में से कोई एक चुनें:\n\n### तरीका 1 — आर्काइव और परिचित `.exe` से\n1. रिपॉज़िटरी का ZIP आर्काइव डाउनलोड करें और उसे सिरिलिक अक्षरों के बिना किसी छोटे पथ, जैसे `C:\\AllY`, में निकालें।\n2. **`AllY.exe`** पर डबल-क्लिक करें — पहली बार चलने पर यह `node` 24+, `python` और `git` की जाँच करेगा, निर्भरताएँ इंस्टॉल करेगा, Electron डाउनलोड करेगा, **`programma\\Dzhinni.exe`** बनाएगा, डेस्कटॉप पर **`AllY`** शॉर्टकट बनाएगा और ऐप की विंडो खोल देगा।\n  *यदि Windows SmartScreen नए अनसाइंड `.exe` पर चेतावनी दिखाए, तो **More info → Run anyway** चुनें (लॉन्चर का स्रोत कोड `docs/launchers/` में खुला है, या सीधे `.\\ustanovka.ps1` चलाएँ)।*\n3. आगे से ऐप चलाने के लिए **`AllY.exe`**, डेस्कटॉप के **`AllY`** शॉर्टकट या सीधे **`programma\\Dzhinni.exe`** पर डबल-क्लिक करें। अलग ऐप विंडो में दस्तावेज़ और संस्करण इतिहास खोलने के लिए **`AllY-Guide.exe`** चलाएँ।\n4. पहली बार चलाने पर 3-चरणीय शुरुआती विज़ार्ड खुलेगा — अपना AI इंजन कनेक्ट करें और पहला संदेश भेजें।\n\n### तरीका 2 — टर्मिनल कमांड से (PowerShell / cmd)\nPowerShell खोलें और क्रम से ये कमांड चलाएँ:\n\n```powershell\ngit clone https://github.com/AyarZero/ally-dzhinni.git C:\\AllY\ncd C:\\AllY\n.\\AllY.exe\n```\n\nबाद में बिल्ड तैयार होने की जाँच इस कमांड से कर सकते हैं:\n\n```powershell\n.\\AllY.exe -Proverka\n```\n\nटर्मिनल से चलाना:\n\n```powershell\n.\\AllY.exe\n```\n\n### तरीका 3 — आपके स्थानीय AI के लिए तैयार प्रॉम्प्ट\nयदि आपके कंप्यूटर पर Claude Code, Codex, Antigravity या कोई अन्य AI सहायक पहले से काम कर रहा है, तो यह पूरा पाठ कॉपी करके उसे भेजें:\n\n```text\nइस Windows पीसी पर रिपॉज़िटरी https://github.com/AyarZero/ally-dzhinni से स्थानीय डेस्कटॉप ऐप AllY · जिन्नी (v0.1) इंस्टॉल करके चलाने के लिए तैयार करो:\n1. टर्मिनल में `git`, `python` (Python 3) और `node` की उपलब्धता जाँचो (Node.js 24+ चाहिए और `node -e \"require('node:sqlite')\"` जाँच सफल होनी चाहिए)। यदि कुछ उपलब्ध नहीं है या Node का संस्करण 24 से कम है, तो मुझे बताओ और बिल्ड से पहले उसे इंस्टॉल करने में मदद करो।\n2. रिपॉज़िटरी को सिरिलिक अक्षरों और स्पेस के बिना किसी छोटे पथ, जैसे `C:\\AllY`, में क्लोन करो और उस फ़ोल्डर में जाओ।\n3. इंस्टॉलेशन चलाओ: `powershell -NoProfile -ExecutionPolicy Bypass -File .\\ustanovka.ps1` और `programma\\Dzhinni.exe` बनने तक प्रतीक्षा करो।\n4. इस कमांड से बिल्ड जाँचो: `powershell -NoProfile -ExecutionPolicy Bypass -File .\\ustanovka.ps1 -Proverka`।\n5. जाँचो कि सिस्टम में कौन-से CLI इंजन (Claude Code, Codex, Antigravity, DeepSeek Harness, Qoder) या OpenRouter कुंजियाँ पहले से उपलब्ध हैं, और संक्षेप में बताओ कि क्या तैयार है।\n6. `programma\\Dzhinni.exe` (या `.\\AllY.exe`) चलाओ और मुझे बताओ कि अब AllY की विंडो खोलकर काम शुरू कर सकता हूँ।\n```\n\n*ध्यान दें: कनेक्ट किए गए CLI एजेंट खुले कार्य फ़ोल्डर की फ़ाइलों को हर बार पढ़ने या बदलने की अनुमति माँगे बिना सीधे इस्तेमाल करते हैं — महत्वपूर्ण प्रोजेक्ट को Git के अंतर्गत रखें।*\n\n---\n\n## फ़ीडबैक और प्रोजेक्ट के विकास में भागीदारी\n\nऊपरी बार के दाएँ हिस्से में (घड़ी के बाईं ओर) **कीड़े के चिह्न वाला «फ़ीडबैक»** बटन है। इससे सीधे इंटरफ़ेस में आप:\n\n- बग, इंटरफ़ेस में खराबी या ऐप शुरू होने की समस्या बता सकते हैं;\n- संदेश के साथ प्रमाण के रूप में अधिकतम **3 फ़ाइलें** जोड़ सकते हैं: टेक्स्ट लॉग `.txt` / `.md` (अधिकतम `2 MB`), स्क्रीनशॉट `.png` / `.jpg` / `.jpeg` / `.webp` / `.gif` (अधिकतम `10 MB`) या छोटे वीडियो `.mp4` / `.webm` / `.mov` (अधिकतम `25 MB`, सभी फ़ाइलें मिलाकर अधिकतम `30 MB`);\n- नया मॉड्यूल, कौशल या उपयोग का तरीका सुझा सकते हैं।\n\n**केवल फ़ॉर्म का पाठ और आपके चुने हुए फ़ाइलें** भेजी जाती हैं — बातचीत, निजी नोट्स और कुंजियाँ स्थानीय रहती हैं। डेवलपर के जवाब ऐप की बातचीत में आते हैं। प्रोजेक्ट MIT लाइसेंस के तहत खुला है: आप `.claude/skills/` में अपने कौशल बना सकते हैं और कोर को बेहतर बनाने में योगदान दे सकते हैं।\n\n---\n\n## v0.1 की ज्ञात समस्याएँ और सीमाएँ, जिन पर हम अभी काम कर रहे हैं\n\nजो अभी सीमित है या जिस पर काम चल रहा है, उसे हम स्पष्ट रूप से दर्ज करते हैं:\n\n1. **परिवेश की निर्भरताएँ पहले से इंस्टॉल करनी होती हैं:** `v0.1` इंस्टॉल करने के लिए `Node.js 24+`, `Python 3` और `Git` पहले से स्थापित होने चाहिए — बिना मैन्युअल सॉफ़्टवेयर तैयारी वाला एकल स्वतंत्र `.exe` इंस्टॉलर अभी बन रहा है।\n2. **v0.1 की क्लाइंट बिल्ड में वॉइस इनपुट और आवाज़ में उत्तर छिपाए गए हैं:** स्थानीय वाक् पहचान (`GigaAM`) और उसके इंस्टॉलर को तैयार करने के दौरान माइक्रोफ़ोन और आवाज़ के बटन अस्थायी रूप से हटाए गए हैं।\n3. **डायरी («खुलकर बातचीत») v0.1 क्लाइंट बिल्ड में छिपी हुई है:** सभी इंजनों के लिए समर्थन तैयार किया जा रहा है; यह टैब आगामी अपडेट में उपलब्ध होगा।\n4. **विंडो बंद होने के बाद बैकग्राउंड ब्रिज धीरे बंद होता है:** यदि तुरंत दूसरा इंस्टेंस खोलते हैं, तो विंडो बंद होने के बाद स्थानीय ब्रिज सर्वर निष्क्रियता टाइमआउट (लगभग 9 मिनट तक) के बाद बंद हो सकता है।\n5. **Qoder का एकीकरण जारी है:** कनेक्शन विज़ार्ड स्थानीय Qoder CLI और लॉगिन स्थिति पहचानता है, लेकिन बातचीत में Qoder को मुख्य एजेंट के रूप में इस्तेमाल करना अगले रिलीज़ तक उपलब्ध नहीं है।\n6. **फ़ीडबैक में बड़े अटैचमेंट स्वीकार करने के लिए सर्वर अपडेट जारी है:** बैकएंड अपडेट पूरा होने से पहले स्क्रीनशॉट या वीडियो भेजते समय यदि फ़ीडबैक सर्वर आकार या फ़ाइल स्वीकार न होने की त्रुटि लौटाता है, तो ड्राफ़्ट खोए बिना फ़ॉर्म तुरंत केवल पाठ के रूप में भेज सकते हैं।\n7. **प्लैटफ़ॉर्म:** केवल **Windows 10/11** के लिए बनाया और परीक्षण किया गया है।\n\n---\n\n## रोडमैप और अनुमानित समयसीमाएँ\n\nसमयसीमाएँ अनुमानित हैं — निकटवर्ती रिलीज़ सप्ताह के हिसाब से तय हैं, जबकि बाद के रिलीज़ के लिए व्यापक समयावधि दी गई है। वास्तविक उपयोगकर्ता फ़ीडबैक के अनुसार इनमें बदलाव होगा:\n\n| अनुमानित समय | क्या जारी करने की योजना है |\n|---|---|\n| **नवंबर का अंत — दिसंबर की शुरुआत 2026** *(1–2 सप्ताह)* | इंटरफ़ेस से मिले शुरुआती फ़ीडबैक के आधार पर सुधार, फ़ीडबैक में फ़ोटो/वीडियो अटैचमेंट का पूर्ण सर्वर समर्थन, विंडो बंद होते ही बैकग्राउंड ब्रिज का तुरंत बंद होना |\n| **दिसंबर 2026 का दूसरा भाग** | बिल्ट-इन **«कार्य और प्रोजेक्ट»** ट्रैकर (दिन का फ़ोकस, बोर्ड, कैलेंडर, कार्ड) और किसी भी चुने हुए इंजन से **«डायरी»** टैब का संचालन |\n| **जनवरी 2027** | **स्थानीय वॉइस मोड** की वापसी (क्लाउड के बिना ऑफ़लाइन डिक्टेशन + उत्तर आवाज़ में सुनना) और `Node.js` तथा `Git` को मैन्युअल रूप से इंस्टॉल किए बिना सरल इंस्टॉलर |\n| **फ़रवरी — मार्च 2027** | **«सीखें»** अनुभाग (विंडो के भीतर पाठों की लाइब्रेरी और AllY तथा रिलीज़ तैयार करने पर मुफ़्त परिचयात्मक कोर्स), कस्टम विजेट बिल्डर और समीक्षा/कंटेंट मॉड्यूल |\n| **अप्रैल — मई 2027** | कार्यक्षेत्र का इंटरैक्टिव **नॉलेज ग्राफ़**, **«प्रोजेक्ट की सेहत»** पैनल (संबंधों का कवरेज और पुराने नोड) और कोड पढ़ने के सहायक के रूप में Qoder का पूर्ण समर्थन |\n| **जून — जुलाई 2027** | दूसरी डेटाबेस के बिना सुरक्षित चैनल से घरेलू पीसी से जुड़ने वाले **Android क्लाइंट** का बीटा रिलीज़ + macOS और Linux के लिए डेस्कटॉप ऐप का अनुकूलन |\n| **अगस्त 2027 और उसके बाद** | स्थिर `v1.0` रिलीज़, समुदाय के साझा कौशलों की सूची और उपयोगकर्ता के कई उपकरणों के बीच कार्यक्षेत्र का सिंक्रोनाइज़ेशन |\n"}, "ja": {"label": "日本語", "dir": "ltr", "rawFile": "readme/README.ja.md", "markdown": "# AllY · ジンニー (v0.1)\n\n複数のAIを1つのウィンドウにまとめるWindows向けローカルデスクトップシェル。会話履歴の共有、ディスク上のローカルメモリ、タスクキュー、利用上限の管理に対応します。\n\n*AllY · ジンニーの誕生日は2026年11月23日です。ライセンス：MIT。*\n\n---\n\n## このアプリと解決する課題\n\nAIを日常的に使うと、作業はブラウザーのタブ、コンソールウィンドウ、個別のキーに分散しがちです。あるモデルの5時間枠の利用上限に達すると、別のモデルを開き、プロジェクトの背景を最初から説明し直す必要があります。\n\n**AllY · ジンニー**は、4つの実用的な課題を解決します。\n\n- **モデル間でコンテキストを共有。** 会話履歴と独自のルール集は、ローカルのMarkdownファイル（`pamyat/`）に保存されます。入力欄からAI、モデル、推論の深さを切り替え、次のモデルが同じ地点から作業を引き継げます。\n- **CLIエージェントの動作を可視化。** 通常のターミナルでは、エージェントの現在の処理を把握し、途中で介入するのは簡単ではありません。AllYでは、幅を調整できる滑らかな縦の境界線の左側に状態を示す球体と実行中の操作フィード、右側に会話とタスクキューを表示します。実行中の指示追加（`live-steer`）、キューの編集、重要なメッセージの優先処理に対応します。\n- **利用上限とコンテキストウィンドウを管理。** **「リソース」**ウィジェットには、メインのAI、コンテキスト使用量（しきい値は`350k`）、サブスクリプションの5時間枠・週間枠が表示されます。**「アシスタント」**タブには、ほかの接続先の残高がまとまります。数値はローカルで取得し、有料のバックグラウンド呼び出しは行いません。\n- **データの管理と直接接続。** 会話、`pamyat/`のメモ、`.claude/skills/`のスキル、`.ally-data/`のローカル設定は、自分のコンピューターに保存されます。自分のサブスクリプションとキーを使い、選んだプロバイダーに直接接続します。\n\n---\n\n## 対象ユーザー\n\n- Claude Code、Codex、Antigravity、DeepSeekでプロジェクトを進め、エージェントの処理、キュー、コンテキスト消費を1つの操作可能なウィンドウで確認したい**開発者やバイブコーダー**。\n- 自分のPC上で、プロジェクト用の共通ローカルメモリを使いたい**著述家、起業家、各分野の専門家**。\n- 作業に合わせてレイアウトを調整でき、組み込みのフィードバック機能で今後のリリースに意見を届けられるローカルツールを求める**Windows 10/11ユーザー**。\n\n---\n\n## バージョン0.1で実際に動く機能\n\n### 1. 接続と「自動」モード\n少なくとも1つの接続先を設定すれば使い始められます。**「自動」**モードでは、利用可能な実行エンジンをシステムが選択します。\n\n| 接続先 | 動作方式 | v0.1でできること |\n|---|---|---|\n| **Claude Code** | Anthropic Pro / Maxサブスクリプションの公式CLI | 複雑なタスク、コード、文章、計画、コンテキストの自動圧縮 |\n| **Codex** | ChatGPT Plus / Proサブスクリプションの公式CLI | リポジトリでの作業と、回答生成中の指示追加（`live-steer`） |\n| **Antigravity** | Google AIの公式CLI | 大規模コンテキストでの分析（ウィンドウのしきい値は`350k`）と利用枠の追跡 |\n| **DeepSeek Harness** | DeepSeek残高を使用するローカルのヘッドレスプロファイル`dsh` | 予備の低コスト実行エンジン。「アシスタント」タブで残高を確認 |\n| **APIアグリゲーター（OpenRouter）** | Base URLとキーを使用する任意のAnthropic互換ゲートウェイ | ローカルの
