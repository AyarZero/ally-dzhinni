n\n```text\n이 Windows PC에 https://github.com/AyarZero/ally-dzhinni 저장소로부터 로컬 데스크톱 앱 AllY · 지니 (v0.1)를 설치하고 실행할 수 있도록 준비해 줘:\n1. 터미널에서 `git`, `python`(Python 3), `node`(Node.js 24+ 및 `node -e \"require('node:sqlite')\"` 정상 동작 확인 필요) 유무를 점검해 줘. 누락된 항목이 있거나 Node 버전이 24 미만이면 빌드 전에 알려주고 설치를 도와줘.\n2. `C:\\AllY`처럼 공백이나 비영문 문자가 없는 짧은 경로로 저장소를 클론하고 해당 폴더로 이동해 줘.\n3. `powershell -NoProfile -ExecutionPolicy Bypass -File .\\ustanovka.ps1`로 설치를 실행하고 `programma\\Dzhinni.exe` 빌드가 완료될 때까지 기다려 줘.\n4. `powershell -NoProfile -ExecutionPolicy Bypass -File .\\ustanovka.ps1 -Proverka` 명령어로 빌드를 검증해 줘.\n5. 시스템에 어떤 CLI 엔진(Claude Code, Codex, Antigravity, DeepSeek Harness, Qoder)이나 OpenRouter 키가 이미 사용 가능한지 확인하고, 현재 준비된 항목을 간단히 알려줘.\n6. `programma\\Dzhinni.exe`(또는 `.\\AllY.exe`)를 실행하고 AllY 창을 열어 작업을 시작해도 된다고 알려줘.\n```\n\n*참고: 연결된 CLI 실행기는 매번 읽기/수정 확인을 묻지 않고 열려 있는 작업 폴더의 파일에 직접 작업합니다. 중요한 프로젝트는 Git으로 관리하세요.*\n\n---\n\n## 피드백 및 프로젝트 참여\n\n상단 헤더 오른쪽(시계 왼쪽)에는 **벌레 아이콘 버튼 — 「피드백」**이 있습니다. 이 버튼을 통해 인터페이스에서 바로 다음 작업을 수행할 수 있습니다:\n\n- 버그, 인터페이스 깨짐 또는 실행 오류 보고;\n- 메시지에 증빙 파일 최대 **3개** 첨부: 텍스트 로그 `.txt` / `.md` (최대 `2 MB`), 스크린샷 `.png` / `.jpg` / `.jpeg` / `.webp` / `.gif` (최대 `10 MB`) 또는 짧은 동영상 `.mp4` / `.webm` / `.mov` (최대 `25 MB`, 총합 최대 `30 MB`);\n- 새로운 모듈, 스킬 또는 활용 시나리오 제안.\n\n전송되는 것은 **양식 텍스트와 직접 선택한 파일뿐**이며 대화 기록, 개인 메모, 키는 로컬에 유지됩니다. 개발자의 답변은 앱 내 대화창으로 다시 전달됩니다. 이 프로젝트는 MIT 라이선스로 공개되어 있으므로 `.claude/skills/`에 자신만의 스킬을 만들고 코어 개선에도 참여할 수 있습니다.\n\n---\n\n## 현재 작업 중인 v0.1의 알려진 문제 및 제한 사항\n\n현재 제한되어 있거나 개선 작업이 진행 중인 사항을 투명하게 공유합니다:\n\n1. **환경 의존성 사전 설치 필요:** `v0.1` 설치에는 이미 설치된 `Node.js 24+`, `Python 3`, `Git`이 필요합니다. 수동 사전 준비가 필요 없는 단일 독립형 `.exe` 설치 프로그램은 아직 개발 중입니다.\n2. **v0.1 클라이언트 빌드에서 음성 입력 및 음성 출력 비활성화:** 로컬 음성 인식(`GigaAM`) 및 설치 프로그램 마무리 단계에서 마이크 및 음성 버튼이 일시적으로 숨겨져 있습니다.\n3. **일기(「솔직한 대화」)는 v0.1 클라이언트 빌드에서 숨김 처리되어 있습니다:** 다중 엔진 지원이 완성되는 대로 다음 업데이트에서 열릴 예정입니다.\n4. **창을 닫은 후 백그라운드 브리지의 점진적 절전 전환:** 창을 닫은 직후 다른 인스턴스를 바로 다시 열 경우, 로컬 브리지 서버가 유휴 타임아웃(최대 약 9분)을 거쳐 종료될 수 있습니다.\n5. **Qoder 통합 진행 중:** 연결 마법사가 로컬 Qoder CLI와 로그인 상태를 감지하지만, 대화창에서 Qoder를 주도 역할로 사용하는 기능은 다음 릴리스까지 비활성화되어 있습니다.\n6. **피드백 대용량 첨부 파일 서버 수신 업데이트 진행 중:** 백엔드 업데이트 완료 전까지 스크린샷이나 동영상 전송 시 피드백 서버가 크기 또는 파일 거부 오류를 반환할 경우, 작성 중인 초안을 잃지 않고 텍스트만으로 즉시 전송할 수 있습니다.\n7. **플랫폼:** **Windows 10/11** 환경에서만 테스트 및 빌드되었습니다.\n\n---\n\n## 로드맵 및 예상 일정\n\n일정은 예상치입니다. 가까운 릴리스는 주 단위로 계획되어 있으며, 먼 일정은 큰 구간으로 잡혀 있고 실제 사용자 피드백에 따라 조정됩니다:\n\n| 예상 일정 | 출시 계획 |\n|---|---|\n| **2026년 11월 말 — 12월 초** *(1~2주)* | 인터페이스 초기 피드백 반영 수정, 피드백 내 사진/동영상 첨부 파일 전체 서버 수신 지원, 창 종료 시 백그라운드 브리지 즉시 종료 |\n| **2026년 12월 하반기** | 내장 트래커 **「작업 및 프로젝트」**(오늘의 집중, 보드, 캘린더, 카드) 및 선택한 모든 엔진을 통한 **「일기」** 탭 지원 |\n| **2027년 1월** | **로컬 음성 모드** 복원(클라우드 없는 오프라인 받아쓰기 + 응답 음성 읽기) 및 `Node.js`와 `Git` 수동 설치가 필요 없는 간소화된 설치 프로그램 |\n| **2027년 2월 — 3월** | **「학습」** 섹션(창 내부 강의 라이브러리 및 AllY와 릴리스 준비 무료 입문 코스), 사용자 정의 위젯 빌더, 검수/콘텐츠 모듈 |\n| **2027년 4월 — 5월** | 작업 공간의 인터랙티브 **지식 그래프**, **「프로젝트 상태」** 패널(연결 커버리지 및 오래된 노드) 및 코드 읽기 보조로서의 Qoder 정식 지원 |\n| **2027년 6월 — 7월** | 별도 데이터베이스 없이 보안 채널로 가정용 PC에 연결하는 **Android 클라이언트** 베타 릴리스 + macOS 및 Linux용 데스크톱 지원 |\n| **2027년 8월 이후** | `v1.0` 정식 릴리스, 커뮤니티 공용 스킬 카탈로그 및 사용자의 여러 기기 간 작업 공간 동기화 |\n"}, "tr": {"label": "Türkçe", "dir": "ltr", "rawFile": "readme/README.tr.md", "markdown": "# AllY · Genie (v0.1)\n\nBirden fazla yapay zekâ modelini ortak konuşma geçmişi, diskte yerel bellek, görev kuyruğu ve limit kontrolü ile tek pencerede birleştiren Windows için yerel masaüstü kabuğu.\n\n*AllY · Genie'nin doğum günü: 23 Kasım 2026. Lisans: MIT.*\n\n---\n\n## Bu uygulama nedir ve hangi sorunu çözer\n\nYapay zekâ ile düzenli çalışırken görevler kısa sürede farklı tarayıcı sekmelerine, konsol pencerelerine ve ayrı anahtarlara dağılır. Bir modelin beş saatlik limiti dolduğunda başka bir model açıp proje bağlamını baştan anlatmak gerekir.\n\n**AllY · Genie** dört pratik ihtiyacı karşılar:\n\n- **Modeller arasında ortak bağlam.** Konuşma geçmişi ve kural tabanınız yerel olarak Markdown dosyalarında (`pamyat/`) saklanır. Bir sonraki modelin göreve kaldığı yerden devam edebilmesi için yapay zekâ motorunu, modeli veya akıl yürütme derinliğini doğrudan giriş satırından değiştirebilirsiniz.\n- **Şeffaf CLI ajanı çalışması.** Standart bir terminalde ajanın mevcut adımını zamanında görmek ve süreç içinde müdahale etmek zordur. AllY'de sol tarafta genişliği ayarlanabilir akıcı bir dikey ayırıcının arkasında durum küresi ve anlık eylem akışı yer alır; sağ tarafta ise anlık yönlendirme (`live-steer`), kuyruk düzenleme ve önemli mesajı öne alma desteğiyle sohbet ve görev kuyruğu bulunur.\n- **Limit ve bağlam penceresi kontrolü.** **\"Kaynaklar\"** bileşeni ana yapay zekâyı, bağlam doluluğunu (`350k` eşiğiyle), 5 saatlik ve haftalık abonelik kotalarını gösterir; **\"Yardımcılar\"** sekmesi ise diğer bağlantıların bakiyelerini bir araya getirir. Göstergeler ücretli arka plan çağrıları olmadan yerel olarak okunur.\n- **Veri kontrolü ve doğrudan bağlantılar.** Sohbetler, `pamyat/` notları, `.claude/skills/` becerileri ve `.ally-data/` yerel ayarları bilgisayarınızda kalır. Kendi aboneliklerinizi ve anahtarlarınızı doğrudan seçtiğiniz sağlayıcılarla kullanırsınız.\n\n---\n\n## Uygulama kimler için tasarlandı\n\n- **Geliştiriciler ve vibe coder'lar** — projelerini Claude Code, Codex, Antigravity veya DeepSeek üzerinden yönetip ajan adımlarını, kuyruğu ve bağlam tüketimini tek bir yönetilebilir pencerede takip etmek isteyenler.\n- **Yazarlar, girişimciler ve uzmanlar** — kendi bilgisayarlarında projeleri için ortak bir yerel belleğe ihtiyaç duyanlar.\n- **Windows 10/11 kullanıcıları** — iş akışlarına göre düzeni özelleştirilebilen yerel bir araç ve yerleşik geri bildirim üzerinden sonraki sürümlere yön verebilme imkânı arayanlar.\n\n---\n\n## v0.1 sürümünde fiilen çalışan özellikler\n\n### 1. Bağlantılar ve \"Oto\" modu\nBaşlamak için en az bir seçeneği bağlamanız yeterlidir. **\"Oto\"** modunda sistem uygun yürütücüyü kendisi seçer:\n\n| Bağlantı | Çalışma yöntemi | v0.1 sürümündeki yetenekleri |\n|---|---|---|\n| **Claude Code** | Anthropic Pro / Max aboneliğiyle resmi CLI | Karmaşık görevler, kod, metinler, planlama ve otomatik bağlam sıkıştırma |\n| **Codex** | ChatGPT Plus / Pro aboneliğiyle resmi CLI | Depolar üzerinde çalışma ve yanıt sırasında anlık yönlendirme (`live-steer`) |\n| **Antigravity** | Resmi Google AI CLI | Büyük bağlamlı analizler (`350k` pencere eşiği) ve kota takibi |\n| **DeepSeek Harness** | DeepSeek bakiyesiyle çalışan yerel headless `dsh` profili | Yedek ve ekonomik yürütücü, \"Yardımcılar\" sekmesinde bakiye kontrolü |\n| **API Toplayıcı (OpenRouter)** | Base URL ve anahtar ile Anthropic uyumlu herhangi bir ağ geçidi | Yerel Claude Code CLI süreci üzerinden harici modellerin bağlanması (Anthropic aboneliği gerekmeden) |\n| **Qoder CLI** | Yerel CLI (algılama ve oturum açma) | Bağlantı sihirbazı tarafından algılanır (pencere içinden giriş dahil); sohbette ana model rolü bir sonraki güncellemede eklenecektir |\n\n### 2. Çalışma alanı ve arayüz\n- **Başlangıç ekranı:** Solda temiz durum küresi, canlı adım akışı ve akıcı ayırıcısı ile **\"Sohbet\"** yer alır; sağda üstte **\"Kaynaklar\" / \"Yardımcılar\"**, altta **\"Dizüstü\"** izleyicisi bulunur ve yükseklikleri serbestçe ayarlanır.\n- **Üst çubuk (sağdan sola):** Sağda saat, geniş **geri bildirim paneli (böcek)**, **fırça** (bileşen taşıma, boyutlandırma ve düzen sıfırlama), **temalar** (varsayılan **Grafit** ile Turkuaz, Gece Yarısı, Koyu, Açık), uygulama içi **kitap simgesi (Rehber ve Sürüm Geçmişi)** ve tam genişlikli **\"Okuma Modu\"** içeren 3 adımlı **şimşek** sihirbazı.\n- **Yerel depolama:** `pamyat/` (yerel Markdown belleği), `.claude/skills/` (yerel beceriler), `.ally-data/` (anahtarlar ve pencere düzeni; Git kapsamı dışındadır).\n\n## Kurulum ve başlatma (Windows 10/11)\n\n**Kurulumdan önce sisteminizde aşağıdakilerin kurulu olduğundan ve `PATH` içinde erişilebilir olduğundan emin olun:**\n1. **Node.js 24+** (yerleşik `node:sqlite` modülü desteğiyle)\n2. **Python 3**\n3. **Git**\n4. İlk derleme sırasında (`npm ci` ve Electron indirmesi için) internet erişimi ve en az bir bağlı yapay zekâ motoru veya anahtarı.\n\nSize uygun üç kurulum yönteminden birini seçin:\n\n### Yöntem 1 — Arşiv ve alışıldık `.exe` dosyası ile\n1. Deponun ZIP arşivini indirin ve Kiril veya özel karakter içermeyen kısa bir yola, örneğin `C:\\AllY` dizinine çıkarın.\n2. **`AllY.exe`** dosyasına çift tıklayın — ilk çalıştırmada `node` 24+, `python` ve `git` kurulumlarını kontrol eder, bağımlılıkları yükler, Electron'u indirir, **`programma\\Dzhinni.exe`** dosyasını derler, masaüstünde **`AllY`** kısayolunu oluşturur ve pencereyi otomatik açar.\n  *Windows SmartScreen imzasız yeni `.exe` için uyarı verirse **Ek bilgi → Yine de çalıştır** seçeneğine tıklayın (başlatıcı kaynak kodu `docs/launchers/` içinde açıktır veya doğrudan `.\\ustanovka.ps1` çalıştırabilirsiniz).*\n3. Daha sonra uygulamayı **`AllY.exe`**, masaüstündeki **`AllY`** kısayolu veya doğrudan **`programma\\Dzhinni.exe`** üzerinden başlatabilirsiniz. Belgeleri ve sürüm geçmişini ayrı bir uygulama penceresinde açmak için **`AllY-Guide.exe`** dosyasını çalıştırın.\n4. İlk çalıştırmada 3 adımlı başlangıç sihirbazı açılır — istediğiniz yapay zekâ motorunu bağlayın ve ilk mesajınızı gönderin.\n\n### Yöntem 2 — Terminal komutlarıyla (PowerShell / cmd)\nPowerShell'i açın ve sırasıyla şu komutları çalıştırın:\n\n```powershell\ngit clone https://github.com/AyarZero/ally-dzhinni.git C:\\AllY\ncd C:\\AllY\n.\\AllY.exe\n```\n\nDerlemenin hazır olup olmadığını daha sonra şu komutla kontrol edebilirsiniz:\n\n```powershell\n.\\AllY.exe -Proverka\n```\n\nTerminalden başlatma:\n\n```powershell\n.\\AllY.exe\n```\n\n### Yöntem 3 — Yerel yapay zekânız için hazır kurulum istemi\nBilgisayarınızda hâlihazırda Claude Code, Codex, Antigravity veya başka bir yapay zekâ yardımcısı çalışıyorsa, aşağıdaki metnin tamamını kopyalayıp ona gönderin:\n\n```text\nBu Windows bilgisayarda https://github.com/AyarZero/ally-dzhinni deposundan AllY · Genie (v0.1) yerel masaüstü uygulamasını kur ve çalıştırmaya hazır hale getir:\n1. Terminalde `git`, `python` (Python 3) ve `node` (çalışan `node -e \"require('node:sqlite')\"` doğrulamasıyla Node.js 24+ sürümü gereklidir) kurulumlarının varlığını kontrol et. Eksik bir bileşen varsa veya Node sürümü 24'ün altındaysa bana bildir ve derlemeden önce kurmama yardımcı ol.\n2. Depoyu boşluk ve özel/Kiril karakter içermeyen kısa bir yola, örneğin `C:\\AllY` dizinine klonla ve bu klasöre geç.\n3. Kurulumu başlat: `powershell -NoProfile -ExecutionPolicy Bypass -File .\\ustanovka.ps1` ve `programma\\Dzhinni.exe` dosyasının derlenmesini bekle.\n4. Derlemeyi `powershell -NoProfile -ExecutionPolicy Bypass -File .\\ustanovka.ps1 -Proverka` komutuyla doğrula.\n5. Sistemde hangi CLI motorlarının (Claude Code, Codex, Antigravity, DeepSeek Harness, Qoder) veya OpenRouter anahtarlarının halihazırda erişilebilir olduğunu kontrol et ve nelerin hazır olduğunu bana kısaca özetle.\n6. `programma\\Dzhinni.exe` (veya `.\\AllY.exe`) dosyasını başlat ve AllY penceresini açıp çalışmaya başlayabileceğimi söyle.\n```\n\n*Not: Bağlı CLI yürütücüleri, açık olan çalışma klasöründeki dosyalar üzerinde her okuma veya düzenleme için onay istemeden doğrudan çalışır — önemli projelerinizi Git altında tutun.*\n\n---\n\n## Geri bildirim ve projeye katkı\n\nÜst çubuğun sağ tarafında (saatin solunda) **böcek simgeli \"Geri Bildirim\"** düğmesi bulunur. Bu düğme üzerinden doğrudan arayüzden şunları yapabilirsiniz:\n\n- bir hatayı, arayüz bozulmasını veya başlatma sorununu bildirmek;\n- mesaja kanıt olarak en fazla **3 dosya** eklemek: metin günlükleri `.txt` / `.md` (`2 MB`'a kadar), ekran görüntüleri `.png` / `.jpg` / `.jpeg` / `.webp` / `.gif` (`10 MB`'a kadar) veya kısa videolar `.mp4` / `.webm` / `.mov` (`25 MB`'a kadar, toplam en fazla `30 MB`);\n- yeni bir modül, beceri veya kullanım senaryosu önermek.\n\nYalnızca **form metni ve seçtiğiniz dosyalar** gönderilir — sohbetleriniz, kişisel notlarınız ve anahtarlarınız yerel olarak cihazınızda kalır. Geliştirici yanıtları doğrudan uygulamanın sohbet ekranına geri döner. Proje MIT lisansı altında açık kaynaklıdır: `.claude/skills/` içinde kendi becerilerinizi oluşturabilir ve çekirdek geliştirmeye katkıda bulunabilirsiniz.\n\n---\n\n## Üzerinde çalıştığımız bilinen v0.1 sorunları ve kısıtlamaları\n\nHenüz kısıtlı olan veya şu anda geliştirilmeye devam edilen noktaları şeffaf biçimde paylaşıyoruz:\n\n1. **Ortam bağımlılıkları önceden kurulmalıdır:** `v0.1` kurulumu için `Node.js 24+`, `Python 3` ve `Git` yazılımlarının sistemde önceden kurulu olması gerekir — manuel yazılım hazırlığı gerektirmeyen tek parça bağımsız `.exe` kurulum dosyası henüz geliştirme aşamasındadır.\n2. **v0.1 istemci derlemesinde sesli giriş ve seslendirme gizlenmiştir:** Yerel konuşma tanıma (`GigaAM`) ve kurucusunun son iyileştirmeleri tamamlanana kadar mikrofon ve ses düğmeleri geçici olarak kaldırılmıştır.\n3. **Günlük (\"Dürüst Sohbet\") v0.1 istemci derlemesinde gizlenmiştir:** Tüm motorlar için destek tamamlanmakta olup sonraki güncellemede açılacaktır.\n4. **Pencere kapatıldıktan sonra arka plan köprüsünün kademeli kapanması:** Pencere kapatıldığında hemen başka bir örnek yeniden açılırsa, yerel köprü sunucusu boşta kalma zaman aşımıyla (~9 dakikaya kadar) kapanabilir.\n5. **Qoder entegrasyon aşamasındadır:** Bağlantı sihirbazı yerel Qoder CLI kurulumunu ve oturum durumunu algılar, ancak Qoder'in sohbette ana model olarak kullanılması bir sonraki sürüme kadar kapalıdır.\n6. **Geri bildirimlerde büyük ekler için sunucu tarafı güncelleme süreci:** Arka uç güncellemesi tamamlanana kadar ekran görüntüsü veya video gönderirken geri bildirim sunucusu boyut ya da dosya reddi hatası döndürürse, taslağınızı kaybetmeden formu hemen yalnızca metin olarak gönderebilirsiniz.\n7. **Platform:** Yalnızca **Windows 10/11** için test edilmiş ve derlenmiştir.\n\n---\n\n## Yol haritası ve tahmini takvim\n\nTarihler tahminidir — yakın sürümler haftalık olarak planlanmıştır, daha ileri tarihli sürümler ise geniş aralıklarla verilmiştir ve gerçek kullanıcı geri bildirimlerine göre güncellenir:\n\n| Tahmini tarih | Yayımlanması planlanan özellikler |\n|---|---|\n| **Kasım sonu – Aralık 2026 başı** *(1–2 hafta)* | Arayüz üzerinden gelen ilk geri bildirimlere göre düzeltmeler, geri bildirimlerde fotoğraf/video eklerinin sunucu tarafında tam kabulü, pencere kapatıldığında arka plan köprüsünün anında sonlandırılması |\n| **Aralık 2026'nın ikinci yarısı** | Yerleşik **\"Görevler ve Projeler\"** takipçisi (günlük odak, pano, takvim, kartlar) ve **\"Günlük\"** sekmesinin seçilen herhangi bir motor üzerinden çalışması |\n| **Ocak 2027** | **Yerel ses modunun** geri dönmesi (bulut gerektirmeyen çevrimdışı dikte + yanıt seslendirme) ve manuel `Node.js` ve `Git` kurulumu gerektirmeyen basitleştirilmiş kurucu |\n| **Şubat – Mart 2027** | **\"Eğitim\"** bölümü (pencere içi ders kütüphanesi ve AllY ile sürüm hazırlığına dair ücretsiz başlangıç kursu), özel bileşen oluşturucu ve denetim/içerik modülleri |\n| **Nisan – Mayıs 2027** | Çalışma alanı için etkileşimli **bilgi grafiği**, **\"Proje Sağlığı\"** paneli (bağlantı kapsamı ve güncelliğini yitirmiş düğümler) ve Qoder'in kod okuma yardımcısı olarak tam kapsamlı çalışması |\n| **Haziran – Temmuz 2027** | İkinci bir veritabanı olmadan güvenli kanal üzerinden ev bilgisayarına bağlanan **Android istemcisi** beta sürümü + masaüstü uygulamasının macOS ve Linux uyarlaması |\n| **Ağustos 2027 ve sonrası** | Kararlı `v1.0` sürümü, topluluk ortak becerileri kataloğu ve kullanıcının birden fazla cihazı arasında çalışma alanı senkronizasyonu |\n"}, "id": {"label": "Bahasa Indonesia", "dir": "ltr", "rawFile": "readme/README.id.md", "markdown": "# AllY · Jin (v0.1)\n\nAntarmuka desktop lokal untuk Windows yang menyatukan beberapa AI dalam satu jendela dengan riwayat percakapan bersama, memori lokal di disk, antrean tugas, dan pemantauan batas penggunaan.\n\n*Ulang tahun AllY · Jin — 23 November 2026. Lisensi: MIT.*\n\n---\n\n## Apa aplikasi ini dan masalah apa yang diselesaikannya\n\nSaat rutin bekerja dengan AI, tugas cepat tersebar di berbagai tab browser, jendela konsol, dan kunci akses terpisah. Ketika batas penggunaan lima jam suatu model habis, Anda harus membuka model lain dan menjelaskan ulang konteks proyek.\n\n**AllY · Jin** menangani empat kebutuhan praktis:\n\n- **Konteks bersama antarmodel.** Riwayat percakapan dan kumpulan aturan Anda disimpan secara lokal dalam file Markdown (`pamyat/`). Anda dapat mengganti AI, model, atau kedalaman penalaran langsung dari kolom input agar model berikutnya melanjutkan tugas dari titik yang sama.\n- **Aktivitas agen CLI yang transparan.** Di terminal biasa, sulit memantau langkah agen saat ini dan melakukan intervensi tepat waktu. Di AllY, sisi kiri menampilkan bola status dan aliran aktivitas terkini di balik pembatas vertikal halus yang dapat digeser untuk mengatur lebar, sedangkan sisi kanan menampilkan percakapan dan antrean tugas dengan dukungan klarifikasi saat proses berjalan (`live-steer`), penyuntingan antrean, dan prioritas untuk pesan penting.\n- **Pemantauan batas penggunaan dan jendela konteks.** Widget **“Sumber Daya”** menampilkan AI utama, penggunaan konteks (dengan ambang `350k`), serta kuota langganan 5 jam dan mingguan, sementara tab **“Asisten”** merangkum saldo koneksi lainnya. Metrik dibaca secara lokal tanpa panggilan latar belakang berbayar.\n- **Kontrol data dan koneksi langsung.** Percakapan, catatan `pamyat/`, keterampilan `.claude/skills/`, dan pengaturan lokal `.ally-data/` tetap berada di komputer Anda. Anda menggunakan langganan dan kunci sendiri langsung dengan penyedia yang dipilih.\n\n---\n\n## Untuk siapa aplikasi ini dibuat\n\n- **Pengembang dan pelaku vibe coding** yang mengelola proyek melalui Claude Code, Codex, Antigravity, atau DeepSeek dan ingin memantau langkah agen, antrean, serta penggunaan konteks dalam satu jendela yang mudah dikendalikan.\n- **Penulis, pengusaha, dan profesional** yang memerlukan memori lokal terpadu untuk proyek mereka di PC sendiri.\n- **Pengguna Windows 10/11** yang membutuhkan alat lokal dengan tata letak yang dapat disesuaikan untuk tugas mereka serta kesempatan memengaruhi rilis berikutnya melalui umpan balik bawaan.\n\n---\n\n## Yang benar-benar berfungsi di versi 0.1\n\n### 1. Koneksi dan mode “Otomatis”\nUntuk memulai, cukup hubungkan setidaknya satu opsi. Dalam mode **“Otomatis”**, sistem memilih sendiri agen yang tersedia:\n\n| Koneksi | Cara kerja | Kemampuan di v0.1 |\n|---|---|---|\n| **Claude Code** | CLI resmi dengan langganan Anthropic Pro / Max | Tugas kompleks, kode, teks, perencanaan, dan pemadatan konteks otomatis |\n| **Codex** | CLI resmi dengan langganan ChatGPT Plus / Pro | Bekerja pada repositori dan menerima klarifikasi saat respons sedang berlangsung (`live-steer`) |\n| **Antigravity** | CLI resmi Google AI | Analisis dengan konteks besar (ambang jendela `350k`) dan pemantauan kuota |\n| **DeepSeek Harness** | Profil headless lokal `dsh` yang menggunakan saldo DeepSeek | Agen cadangan yang hemat biaya, pemeriksaan saldo di tab “Asisten” |\n| **Agregator API (OpenRouter)** | Gateway apa pun yang kompatibel dengan Anthropic melalui Base URL dan kunci | Menghubungkan model eksternal melalui proses lokal Claude Code CLI (tanpa langganan Anthropic) |\n| **Qoder CLI** | CLI lokal (deteksi dan login) | Terdeteksi oleh wizard koneksi (termasuk login dari jendela); peran sebagai agen utama dalam percakapan akan hadir pada pembaruan berikutnya |\n\n### 2. Ruang kerja dan antarmuka\n- **Layar awal:** di kiri terbuka **“Percakapan”** dengan bola status bersih tanpa teks dan alur langkah langsung; di kanan tersedia **“Sumber Daya” / “Asisten”** (atas) dan **“Laptop”** (bawah) yang dapat diubah tingginya secara bebas.\n- **Panel atas (dari kanan ke kiri):** jam di kanan, panel **umpan balik lebar (serangga)**, **kuas** (geser & ubah ukuran widget, atur ulang tata letak), **tema** (**Grafit** secara default, serta Toska, Tengah Malam, Gelap, Terang), **ikon buku** (Panduan & Riwayat Versi di dalam aplikasi), dan **petir** (wizard 3 langkah dengan **“Mode Baca”** penuh).\n- **Penyimpanan lokal:** `pamyat/` (memori Markdown lokal), `.claude/skills/` (keterampilan lokal), `.ally-data/` (kunci dan tata letak jendela, dikecualikan dari Git).\n\n## Instalasi dan menjalankan aplikasi (Windows 10/11)\n\n**Sebelum instalasi, pastikan komponen berikut sudah terinstal dan tersedia di `PATH`:**\n1. **Node.js 24+** (dengan dukungan modul bawaan `node:sqlite`)\n2. **Python 3**\n3. **Git**\n4. Akses internet selama build pertama (`npm ci` dan pengunduhan Electron), serta setidaknya satu mesin AI atau kunci yang sudah terhubung.\n\nPilih salah satu dari tiga cara instalasi berikut:\n\n### Cara 1 — melalui arsip dan `.exe` yang familier\n1. Unduh arsip ZIP repositori dan ekstrak ke jalur pendek tanpa karakter Kiril, misalnya `C:\\AllY`.\n2. Klik dua kali **`AllY.exe`** — saat pertama kali dijalankan, peluncur akan memeriksa `node` 24+, `python`, dan `git`, menginstal dependensi, mengunduh Electron, membangun **`programma\\Dzhinni.exe`**, membuat pintasan **`AllY`** di desktop, lalu langsung membuka jendela.\n  *Jika Windows SmartScreen menampilkan peringatan untuk `.exe` baru tanpa tanda tangan digital, klik **Info selengkapnya → Tetap jalankan** (kode sumber peluncur terbuka di `docs/launchers/`, atau jalankan `.\\ustanovka.ps1` langsung).*\n3. Untuk penggunaan selanjutnya, jalankan aplikasi dengan mengeklik dua kali **`AllY.exe`**, pintasan **`AllY`** di desktop, atau langsung melalui **`programma\\Dzhinni.exe`**. Untuk membuka panduan dan riwayat versi di jendela aplikasi tersendiri, jalankan **`AllY-Guide.exe`**.\n4. Saat pertama kali dijalankan, wizard awal 3 langkah akan terbuka — hubungkan AI yang diinginkan dan kirim pesan pertama.\n\n### Cara 2 — menggunakan perintah di terminal (PowerShell / cmd)\nBuka PowerShell dan jalankan secara berurutan:\n\n```powershell\ngit clone https://github.com/AyarZero/ally-dzhinni.git C:\\AllY\ncd C:\\AllY\n.\\AllY.exe\n```\n\nAnda dapat memeriksa kesiapan build nanti dengan perintah:\n\n```powershell\n.\\AllY.exe -Proverka\n```\n\nMenjalankan dari terminal:\n\n```powershell\n.\\AllY.exe\n```\n\n### Cara 3 — prompt siap pakai untuk AI lokal Anda\nJika Claude Code, Codex, Antigravity, atau asisten AI lain sudah berjalan di komputer Anda, salin seluruh teks berikut dan kirimkan kepadanya:\n\n```text\nInstal dan siapkan aplikasi desktop lokal AllY · Jin (v0.1) agar siap dijalankan di PC Windows ini dari repositori https://github.com/AyarZero/ally-dzhinni:\n1. Periksa di terminal apakah `git`, `python` (Python 3), dan `node` tersedia (diperlukan Node.js 24+ yang lolos pemeriksaan `node -e \"require('node:sqlite')\"`). Jika ada yang belum tersedia atau versi Node di bawah 24, beri tahu saya dan bantu instal komponen yang diperlukan sebelum build.\n2. Klon repositori ke jalur pendek tanpa karakter Kiril dan spasi, misalnya `C:\\AllY`, lalu masuk ke folder tersebut.\n3. Jalankan instalasi: `powershell -NoProfile -ExecutionPolicy Bypass -File .\\ustanovka.ps1` dan tunggu hingga build `programma\\Dzhinni.exe` selesai.\n4. Periksa build dengan perintah `powershell -NoProfile -ExecutionPolicy Bypass -File .\\ustanovka.ps1 -Proverka`.\n5. Periksa mesin CLI (Claude Code, Codex, Antigravity, DeepSeek Harness, Qoder) atau kunci OpenRouter yang sudah tersedia di sistem, lalu jelaskan secara singkat apa yang sudah siap.\n6. Jalankan `programma\\Dzhinni.exe` (atau `.\\AllY.exe`) dan beri tahu saya bahwa jendela AllY sudah dapat dibuka untuk mulai bekerja.\n```\n\n*Catatan: agen CLI yang terhubung bekerja langsung dengan file di folder kerja yang terbuka tanpa meminta izin untuk setiap pembacaan atau penyuntingan — kelola proyek penting dengan Git.*\n\n---\n\n## Umpan balik dan partisipasi dalam pengembangan proyek\n\nDi sisi kanan header (sebelah kiri jam) terdapat tombol dengan **ikon serangga — “Umpan Balik”**. Melalui tombol ini, langsung dari antarmuka Anda dapat:\n\n- melaporkan bug, kerusakan antarmuka, atau masalah saat menjalankan aplikasi;\n- melampirkan hingga **3 file** pendukung pada pesan: log teks `.txt` / `.md` (hingga `2 MB`), tangkapan layar `.png` / `.jpg` / `.jpeg` / `.webp` / `.gif` (hingga `10 MB`), atau video pendek `.mp4` / `.webm` / `.mov` (hingga `25 MB`, total hingga `30 MB`);\n- mengusulkan modul, keterampilan, atau skenario penggunaan baru.\n\nYang dikirim **hanya teks formulir dan file yang Anda pilih** — percakapan, catatan pribadi, dan kunci tetap tersimpan secara lokal. Balasan pengembang akan masuk ke percakapan aplikasi. Proyek ini terbuka di bawah lisensi MIT: Anda dapat membuat keterampilan sendiri di `.claude/skills/` dan ikut mengembangkan inti aplikasi.\n\n---\n\n## Masalah yang diketahui dan batasan v0.1 yang sedang kami tangani\n\nKami mencatat secara terbuka hal-hal yang masih terbatas atau sedang disempurnakan:\n\n1. **Dependensi lingkungan harus diinstal terlebih dahulu:** instalasi `v0.1` memerlukan `Node.js 24+`, `Python 3`, dan `Git` yang sudah terinstal — penginstal `.exe` mandiri terpadu tanpa persiapan perangkat lunak manual masih dikerjakan.\n2. **Input suara dan pembacaan suara disembunyikan di build klien v0.1:** tombol mikrofon dan suara untuk sementara dihapus selama penyempurnaan pengenalan ucapan lokal (`GigaAM`) dan penginstalnya.\n3. **Jurnal (“Percakapan Jujur”) disembunyikan pada build klien v0.1:** dukungan multi-mesin sedang diselesaikan dan tab akan dibuka pada pembaruan mendatang.\n4. **Penghentian bertahap bridge latar belakang setelah jendela ditutup:** saat jendela ditutup, server bridge lokal dapat baru berhenti setelah batas waktu tidak aktif (hingga ~9 menit) jika instans lain langsung dibuka kembali.\n5. **Qoder sedang diintegrasikan:** wizard koneksi mendeteksi CLI Qoder lokal dan status login, tetapi penggunaan Qoder sebagai agen utama dalam percakapan belum diaktifkan hingga rilis berikutnya.\n6. **Pembaruan bertahap server untuk menerima lampiran besar dalam umpan balik:** jika saat mengirim tangkapan layar atau video server umpan balik mengembalikan kesalahan ukuran atau menolak file sebelum pembaruan backend selesai, formulir dapat langsung dikirim sebagai teks tanpa kehilangan draf.\n7. **Platform:** hanya diuji dan dibangun untuk **Windows 10/11**.\n\n---\n\n## Peta jalan dan perkiraan jadwal\n\nJadwal bersifat perkiraan — rilis terdekat direncanakan per minggu, sedangkan rencana yang lebih jauh menggunakan rentang waktu lebih luas dan dapat bergeser sesuai umpan balik nyata pengguna:\n\n| Perkiraan waktu | Rencana rilis |\n|---|---|\n| **Akhir November — awal Desember 2026** *(1–2 minggu)* | Perbaikan berdasarkan umpan balik awal dari antarmuka, dukungan penuh server untuk menerima lampiran foto/video dalam umpan balik, penghentian langsung bridge latar belakang saat jendela ditutup |\n| **Paruh kedua Desember 2026** | Pelacak bawaan **“Tugas dan Proyek”** (fokus harian, papan, kalender, kartu) dan tab **“Jurnal”** yang dapat menggunakan mesin apa pun yang dipilih |\n| **Januari 2027** | Kembalinya **mode suara lokal** (dikte offline tanpa cloud + pembacaan respons) dan penginstal yang lebih sederhana tanpa instalasi manual `Node.js` dan `Git` |\n| **Februari — Maret 2027** | Bagian **“Pembelajaran”** (pustaka pelajaran di dalam jendela dan kursus pengantar gratis tentang AllY serta persiapan rilis), pembuat widget pengguna, dan modul audit/konten |\n| **April — Mei 2027** | **Graf pengetahuan** ruang kerja yang interaktif, panel **“Kesehatan Proyek”** (cakupan hubungan dan simpul usang), serta dukungan penuh Qoder sebagai asisten pembacaan kode |\n| **Juni — Juli 2027** | Rilis beta **klien Android** dengan koneksi ke PC rumah melalui saluran aman tanpa basis data kedua + adaptasi aplikasi desktop untuk macOS dan Linux |\n| **Agustus 2027 dan seterusnya** | Rilis stabil `v1.0`, katalog keterampilan bersama komunitas, dan sinkronisasi ruang kerja di beberapa perangkat pengguna |\n"}}, "versions": {"current": "0.1", "birthday": "2026-11-23", "license": "MIT", "releases": [{"version": "v0.1", "date": "2026-11-23", "status": "released", "ru": {"title": "AllY · Джинни v0.1 — первый публичный релиз", "summary": "Первое рабочее десктопное ядро для Windows 10/11: единое окно переписки, локальная память на диске, сфера состояния, контроль квот и 3-шаговый мастер подключения нейросетей.", "added": ["Подключения и режим «Авто»: Claude Code CLI, Codex CLI, Antigravity CLI, DeepSeek Harness, агрегатор API (OpenRouter) и обнаружение Qoder CLI с входом из окна.", "Стартовый экран в теме «Графит» по умолчанию: слева «Переписка» с чистой сферой состояния, лентой шагов и плавной вертикальной границей; справа «Ресурсы» / «Помощники» (сверху) и «Ноутбук» (снизу) с изменяемой высотой.", "Виджет «Ресурсы» и вкладка «Помощники»: 5-часовые/недельные квоты, контроль контекстного окна (порог 350k) и баланс без платных фоновых опросов.", "Нативный анимированный установщик и сплеш-экран AllY.exe + встроенная кнопка-книга «Справка и свод версий» (и автономное окно AllY-Guide.exe).", "3-шаговый мастер старта с широким «Режимом чтения», 5 тем оформления, перетаскивание виджетов и иконок, широкая панель обратной связи с прикреплением файлов (.txt/.md, фото, видео).", "Документация на 16 языках, PDF-версия и интерактивный свод версий docs/index.html."], "knownLimits": ["Требуются заранее установленные Node.js 24+, Python 3 и Git.", "Голосовой режим и «Дневник» («Честный разговор») временно скрыты в клиентской сборке v0.1 на время доработки.", "Qoder пока определяется мастером подключений, а роль ведущей модели выйдет в ближайшем обновлении."], "nextFocus": "Правки v0.1 по первым отзывам, серверный приём вложений к отзывам и мгновенное закрытие моста при выходе."}, "en": {"title": "AllY · Genie v0.1 — initial public release", "summary": "First working Windows 10/11 desktop core uniting multiple AI models in one window with local Markdown memory, status orb, quota visibility, and 3-step onboarding.", "added": ["Connections & Auto routing: Claude Code CLI, Codex CLI, Antigravity CLI, DeepSeek Harness, OpenRouter-compatible API gateway, and Qoder CLI discovery + login.", "Graphite default workspace: Chat on the left with a clean status orb, live activity rail and smooth parallax splitter; resizable Resources / Helpers (top-right) and Laptop hardware monitor (bottom-right).", "Resources & Helpers widgets: 5h/weekly subscription quotas, 350k context threshold tracking, and balance checks with zero paid background polling.", "Native animated AllY.exe setup & splash window + built-in Book Guide button inside the app (and standalone AllY-Guide.exe).", "3-step connection wizard with full-width Reading Mode, 5 themes, drag-and-drop layout/header customization, and wide feedback drawer with file attachments (.txt/.md, images, video).", "16-language documentation, printable PDF, and interactive version archive docs/index.html."], "knownLimits": ["Requires pre-installed Node.js 24+, Python 3, and Git.", "Local voice input/output and the Diary tab ('Honest Conversation') remain hidden in v0.1 client builds while multi-engine support is finalized.", "Qoder CLI is detected in onboarding; lead chat selection is slated for a subsequent update."], "nextFocus": "Early user feedback fixes, full backend media attachment rollout, and instant bridge shutdown on window close."}, "zh-CN": {"title": "AllY · 精灵 v0.1 — 首个公开发布版", "summary": "面向 Windows 10/11 的首个可用桌面核心：单一窗口整合多模型对话、磁盘本地 Markdown 记忆、状态光球、额度监控与 3 步快速接入向导。", "added": ["连接与自动路由：支持 Claude Code CLI、Codex CLI、Antigravity CLI、DeepSeek Harness、兼容 OpenRouter 的 API 网关以及 Qoder CLI 自动检测与窗内登录。", "默认「石墨」工作区：左侧为对话区与纯净状态光球、实时步骤流和平滑视差分隔条；右侧上方为「资源」/「助手」、下方为「笔记本硬件监控」，高度均可自由调整。", "「资源」与「助手」组件：展示 5 小时/每周订阅额度、350k 上下文阈值与余额查询，全程零付费后台轮询。", "原生动画安装与启动器 AllY.exe + 窗内书本图标「指南与版本记录」（另附独立窗口 AllY-Guide.exe）。", "3 步快速上手向导与宽屏「阅读模式」、5 套主题、拖拽自定义布局与顶栏图标、加宽反馈抽屉（支持 .txt/.md、图片与视频附件）。", "16 种语言文档、可打印 PDF 与交互式版本档案馆 docs/index.html。"], "knownLimits": ["需预先安装 Node.js 24+、Python 3 和 Git。", "本地语音输入/输出与「日记」（「坦诚对话」）在 v0.1 客户端构建中暂时隐藏，待多引擎适配完成后开放。", "Qoder CLI 已可在向导中检测，主对话模型支持将在后续更新中推出。"], "nextFocus": "基于首批用户反馈快速修复 v0.1、上线完整服务端附件接收以及关闭窗口时立即停止本地桥接服务。"}, "uk": {"title": "AllY · Джинні v0.1 — перший публічний реліз", "summary": "Перше робоче десктопне ядро для Windows 10/11: єдине вікно листування, локальна пам’ять на диску, сфера стану, контроль квот і 3-кроковий майстер підключення нейромереж.", "added": ["Підключення та режим «Авто»: Claude Code CLI, Codex CLI, Antigravity CLI, DeepSeek Harness, агрегатор API (OpenRouter) та виявлення Qoder CLI зі входом із вікна.", "Стартовий екран у темі «Графіт» за замовчуванням: ліворуч «Переписка» з чистою сферою стану, стрічкою кроків і плавною вертикальною межею; праворуч «Ресурси» / «Помічники» (зверху) та «Ноутбук» (знизу) зі змінною висотою.", "Віджет «Ресурси» і вкладка «Помічники»: 5-годинні й тижневі квоти, контроль контекстного вікна (поріг 350k) та баланс без платних фонових запитів.", "Нативний анімований інсталятор і сплеш-екран AllY.exe + вбудована кнопка-книга «Довідка та звід версій» (і автономне вікно AllY-Guide.exe).", "3-кроковий майстер старту з широким «Режимом читання», 5 тем оформлення, перетягування віджетів та іконок, широка панель зворотного зв’язку з прикріпленням файлів (.txt/.md, фото, відео).", "Документація 16 мовами, PDF-версія та інтерактивний звід версій docs/index.html."], "knownLimits": ["Потрібні заздалегідь встановлені Node.js 24+, Python 3 і Git.", "Голосовий режим та «Щоденник» («Чесна розмова») тимчасово приховані в клієнтській збірці v0.1 на час доопрацювання.", "Qoder поки визначається майстром підключень, а роль провідної моделі з’явиться в найближчому оновленні."], "nextFocus": "Виправлення v0.1 за першими відгуками, серверне приймання вкладень до відгуків і миттєве закриття мосту при виході."}, "vi": {"title": "AllY · Djinni v0.1 — bản phát hành công khai đầu tiên", "summary": "Nhân ứng dụng desktop Windows 10/11 đầu tiên hợp nhất nhiều mô hình AI trong một cửa sổ với bộ nhớ Markdown cục bộ, quả cầu trạng thái, theo dõi hạn mức và trình hướng dẫn kết nối 3 bước.", "added": ["Kết nối & định tuyến Tự động: Claude Code CLI, Codex CLI, Antigravity CLI, DeepSeek Harness, cổng API tương thích OpenRouter và phát hiện/đăng nhập Qoder CLI ngay trong cửa sổ.", "Màn hình mặc định chủ đề Than chì: khung trò chuyện bên trái với quả cầu trạng thái sạch, dòng tiến trình và thanh chia mượt; bên phải là Tài nguyên / Trợ lý (trên) và Theo dõi máy tính (dưới) tùy chỉnh kích thước.", "Tiện ích Tài nguyên & Trợ lý: hạn mức 5 giờ/tuần, ngưỡng ngữ cảnh 350k và kiểm tra số dư không gọi API nền tốn phí.", "Trình cài đặt & màn hình khởi động hoạt họa gốc AllY.exe + nút biểu tượng sách Hướng dẫn tích hợp trong ứng dụng (cùng cửa sổ độc lập AllY-Guide.exe).", "Trình hướng dẫn 3 bước với Chế độ đọc toàn chiều rộng, 5 chủ đề, kéo thả bố cục/biểu tượng và ngăn phản hồi rộng hỗ trợ đính kèm tệp (.txt/.md, ảnh, video).", "Tài liệu 16 ngôn ngữ, bản PDF in ấn và kho lưu trữ phiên bản tương tác docs/index.html."], "knownLimits": ["Cần cài sẵn Node.js 24+, Python 3 và Git.", "Chế độ giọng nói cục bộ và thẻ Nhật ký tạm ẩn trong bản khách v0.1 trong khi hoàn thiện hỗ trợ đa động cơ.", "Qoder CLI được phát hiện trong trình thiết lập; vai trò mô hình dẫn chính sẽ ra mắt ở bản cập nhật kế tiếp."], "nextFocus": "Sửa lỗi v0.1 theo phản hồi sớm, hoàn tất nhận tệp đính kèm trên máy chủ và tắt cầu nối ngay khi đóng cửa sổ."}, "hi": {"title": "AllY · जिन्नी v0.1 — पहला सार्वजनिक रिलीज़", "summary": "Windows 10/11 के लिए पहला कार्यशील डेस्कटॉप कोर, जो एक ही विंडो में कई AI मॉडल, डिस्क पर स्थानीय Markdown मेमोरी, स्टेटस ऑर्ब, कोटा निगरानी और 3-चरणीय कनेक्शन विज़ार्ड को जोड़ता है।", "added": ["कनेक्शन और ऑटो रूटिंग: Claude Code CLI, Codex CLI, Antigravity CLI, DeepSeek Harness, OpenRouter-संगत API गेटवे और विंडो से Qoder CLI पहचान व लॉगिन।", "डिफ़ॉल्ट ग्रेफ़ाइट कार्यक्षेत्र: बाईं ओर स्वच्छ स्टेटस ऑर्ब, लाइव गतिविधि पट्टी और स्मूद स्प्लिटर के साथ चैट; दाईं ओर ऊपर संसाधन/सहायक और नीचे लैपटॉप मॉनिटर (ऊँचाई समायोज्य)।", "संसाधन और सहायक विजेट: 5-घंटे/साप्ताहिक सदस्यता कोटा, 350k संदर्भ सीमा ट्रैकिंग और बिना सशुल्क बैकग्राउंड पोलिंग के बैलेंस जांच।", "नेटिव एनिमेटेड इंस्टॉलर और स्प्लैश AllY.exe + ऐप के भीतर बुक आइकन «गाइड और संस्करण» (तथा स्वतंत्र विंडो AllY-Guide.exe)।", "फुल-विड्थ रीडिंग मोड के साथ 3-चरणीय स्टार्ट विज़ार्ड, 5 थीम, ड्रैग-एंड-ड्रॉप लेआउट और फ़ाइल अटैचमेंट (.txt/.md, चित्र, वीडियो) वाला चौड़ा फ़ीडबैक पैनल।", "16 भाषाओं में दस्तावेज़, प्रिंट योग्य PDF और इंटरैक्टिव संस्करण संग्रह docs/index.html।"], "knownLimits": ["पहले से स्थापित Node.js 24+, Python 3 और Git आवश्यक हैं।", "स्थानीय वॉइस मोड और डायरी टैब को बहु-इंजन समर्थन पूरा होने तक v0.1 क्लाइंट बिल्ड में छिपा रखा गया है।", "Qoder CLI की पहचान विज़ार्ड में होती है; मुख्य चैट मॉडल का समर्थन आगामी अपडेट में आएगा।"], "nextFocus": "प्रारंभिक उपयोगकर्ता प्रतिक्रिया के आधार पर v0.1 सुधार, सर्वर पर पूर्ण मीडिया अटैचमेंट और विंडो बंद होते ही ब्रिज का त्वरित बंद होना।"}, "ja": {"title": "AllY · ジンニー v0.1 — 初回パブリックリリース", "summary": "複数のAIモデルを1つのウィンドウに統合するWindows 10/11向け初回デスクトップコア。ローカルMarkdownメモリ、ステータスオーブ、利用枠の可視化、3ステップ接続ウィザードを搭載。", "added": ["接続とオートルーティング：Claude Code CLI、Codex CLI、Antigravity CLI、DeepSeek Harness、OpenRouter互換APIゲートウェイ、Qoder CLIの検出とウィンドウ内ログインに対応。", "デフォルト「グラファイト」ワークスペース：左にクリーンなステータスオーブ・ライブ手順レール・滑らかな境界線付きのチャット、右上にリソース/ヘルパー、右下にノートPCハードウェア監視（高さ調整可）。", "リソース＆ヘルパーウィジェット：5時間/週間サブスク枠、350kコンテキスト閾値、有料バックグラウンド通信なしの残高確認。", "ネイティブアニメーション付きインストーラー＆スプラッシュ AllY.exe ＋ アプリ内蔵ブックボタン「ガイドと更新履歴」（単体ウィンドウ AllY-Guide.exe も同梱）。", "ワイド「リーディングモード」付き3ステップ導入ウィザード、5テーマ、ドラッグ＆ドロップ配置、ファイル添付（.txt/.md・画像・動画）対応のワイドフィードバックパネル。", "16言語ドキュメント、印刷用PDF、インタラクティブ更新履歴 docs/index.html。"], "knownLimits": ["Node.js 24+、Python 3、Git の事前インストールが必要です。", "ローカル音声入出力と「日記」タブはマルチエンジン対応の仕上げ中のため v0.1 クライアントビルドでは一時非表示です。", "Qoder CLI はウィザードで検出されますが、主導モデルとしての選択は次回以降のアップデートで対応予定です。"], "nextFocus": "初期フィードバックに基づく v0.1 修正、フィードバック添付ファイルのサーバー受信完了、ウィンドウ終了時のブリッジ即時停止。"}, "de": {"title": "AllY · Dschinni v0.1 — Erste öffentliche Version", "summary": "Erster produktiver Windows-10/11-Desktop-Kern, der mehrere KI-Modelle in einem Fenster mit lokalem Markdown-Speicher, Status-Orb, Kontingent-Übersicht und 3-Schritt-Einrichtung vereint.", "added": ["Verbindungen & Auto-Routing: Claude Code CLI, Codex CLI, Antigravity CLI, DeepSeek Harness, OpenRouter-kompatibles API-Gateway sowie Qoder-CLI-Erkennung und Login im Fenster.", "Standard-Workspace im Design «Graphit»: links der Chat mit sauberem Status-Orb, Live-Aktivitätsspur und flüssiger Trennlinie; rechts oben Ressourcen/Helfer und rechts unten Laptop-Hardwaremonitor (höhenverstellbar).", "Ressourcen- & Helfer-Widgets: 5-Stunden-/Wochenkontingente, 350k-Kontextschwelle und Guthabenanzeige ganz ohne kostenpflichtiges Hintergrund-Polling.", "Nativer animierter Installer & Splash-Screen AllY.exe + integrierter Buch-Button «Handbuch & Versionen» (sowie eigenständiges Fenster AllY-Guide.exe).", "3-Schritt-Assistent mit breitem «Lesemodus», 5 Designs, Drag-and-Drop-Anpassung für Widgets/Icons und breites Feedback-Panel mit Dateianhängen (.txt/.md, Bilder, Video).", "Dokumentation in 16 Sprachen, druckfertiges PDF und interaktives Versionsarchiv docs/index.html."], "knownLimits": ["Erfordert vorinstalliertes Node.js 24+, Python 3 und Git.", "Lokale Spracheingabe/-ausgabe und der Tab «Tagebuch» bleiben im v0.1-Client-Build verborgen, bis die Multi-Engine-Unterstützung abgeschlossen ist.", "Qoder CLI wird beim Einrichten erkannt; die Auswahl als Hauptmodell folgt im nächsten Update."], "nextFocus": "Schnelle v0.1-Korrekturen anhand erster Rückmeldungen, vollständiger Server-Empfang von Feedback-Anhängen und sofortiges Beenden der Bridge beim Schließen."}, "fr": {"title": "AllY · Джинни v0.1 — Première version publique", "summary": "Premier noyau de bureau Windows 10/11 réunissant plusieurs modèles d’IA dans une même fenêtre avec mémoire Markdown locale, orbe d’état, suivi des quotas et assistant de connexion en 3 étapes.", "added": ["Connexions et routage Auto : Claude Code CLI, Codex CLI, Antigravity CLI, DeepSeek Harness, passerelle API compatible OpenRouter ainsi que détection et connexion Qoder CLI dans la fenêtre.", "Espace par défaut en thème Graphite : discussion à gauche avec orbe d’état épuré, fil d’étapes et séparateur fluide ; Ressources / Assistants en haut à droite et moniteur matériel en bas à droite (hauteur ajustable).", "Widgets Ressources et Assistants : quotas 5 h / hebdomadaires, seuil de contexte 350k et suivi du solde sans requêtes payantes en arrière-plan.", "Installateur et écran de démarrage animés natifs AllY.exe + bouton livre intégré « Guide et versions » (et fenêtre autonome AllY-Guide.exe).", "Assistant en 3 étapes avec Mode lecture pleine largeur, 5 thèmes, disposition et icônes par glisser-déposer, et panneau de retour élargi avec pièces jointes (.txt/.md, images, vidéo).", "Documentation en 16 langues, PDF imprimable et archive interactive des versions docs/index.html."], "knownLimits": ["Nécessite Node.js 24+, Python 3 et Git préinstallés.", "La voix locale et l’onglet Journal restent masqués dans la build client v0.1 pendant la finalisation du support multi-moteur.", "Qoder CLI est détecté par l’assistant ; sa sélection comme modèle principal arrivera dans une mise à jour prochaine."], "nextFocus": "Correctifs v0.1 selon les premiers retours, réception serveur complète des pièces jointes et arrêt immédiat du pont à la fermeture."}, "he": {"title": "AllY · ג'יני v0.1 — השקה ציבורית ראשונה", "summary": "ליבת שולחן עבודה ראשונה ל-Windows 10/11 המאחדת מספר מודלי בינה מלאכותית בחלון אחד עם זיכרון Markdown מקומי, כדור מצב, מעקב מכסות ואשף חיבור בן 3 שלבים.", "added": ["חיבורים וניתוב אוטומטי: Claude Code CLI, Codex CLI, Antigravity CLI, DeepSeek Harness, שער API תואם OpenRouter וזיהוי/התחברות ל-Qoder CLI מתוך החלון.", "מסך פתיחה בערכת «גרפיט» כברירת מחדל: צ'אט בצד אחד עם כדור מצב נקי, סרגל צעדים ומפריד חלק; משאבים/עוזרים וניטור חומרת המחשב עם שינוי גובה.", "ווידג'טים של משאבים ועוזרים: מכסות 5 שעות ושבועיות, מעקב סף הקשר 350k ובדיקת יתרה ללא קריאות רקע בתשלום.", "מתקין ומסך פתיחה מונפשים AllY.exe + כפתור ספר מובנה «מדריך והיסטוריית גרסאות» (וחלון עצמאי AllY-Guide.exe).", "אשף התחלה בן 3 שלבים עם «מצב קריאה» רחב, 5 ערכות עיצוב, גרירה ושחרור של ווידג'טים ומגירת משוב רחבה עם צירוף קבצים (.txt/.md, תמונות, וידאו).", "תיעוד ב-16 שפות, קובץ PDF להדפסה וארכיון גרסאות אינטראקטיבי docs/index.html."], "knownLimits": ["נדרשים Node.js 24+, Python 3 ו-Git מותקנים מראש.", "קלט/פלט קולי מקומי ולשונית «יומן» מוסתרים זמנית בגרסת הלקוח v0.1 בזמן השלמת התמיכה הרב-מנועית.", "Qoder CLI מזוהה באשף ההגדרה; בחירה בו כמודל ראשי תצא בעדכון הקרוב."], "nextFocus": "תיקוני v0.1 לפי משוב ראשוני, קליטת קבצים מצורפים מלאה בשרת וסגירה מיידית של הגשר עם סגירת החלון."}, "ar": {"title": "AllY · جيني v0.1 — الإصدار العام الأول", "summary": "أول نواة سطح مكتب عاملة لنظام Windows 10/11 توحد عدة نماذج ذكاء اصطناعي في نافذة واحدة مع ذاكرة Markdown محلية، وكرة حالة، ومتابعة للحصص، ومعالج ربط من 3 خطوات.", "added": ["الاتصالات والتوجيه التلقائي: Claude Code CLI وCodex CLI وAntigravity CLI وDeepSeek Harness وبوابة API متوافقة مع OpenRouter واكتشاف Qoder CLI وتسجيل الدخول من النافذة.", "مساحة العمل الافتراضية بسمة «غرافيت»: المحادثة مع كرة حالة نظيفة وشريط خطوات مباشر وفاصل سلس، بالإضافة إلى «الموارد / المساعدون» و«مراقبة العتاد» بارتفاع قابل للتعديل.", "أدوات الموارد والمساعدين: حصص الاشتراك لكل 5 ساعات وأسبوعياً، وتتبع حد السياق 350k، وفحص الرصيد دون استعلامات خلفية مدفوعة.", "مثبّت وشاشة بدء متحركة أصلية AllY.exe + زر الكتاب المدمج «الدليل وسجل الإصدارات» (مع النافذة المستقلة AllY-Guide.exe).", "معالج بدء من 3 خطوات مع «وضع القراءة» الواسع، و5 سمات، وتخصيص التخطيط بالسحب والإفلات، ولوحة ملاحظات واسعة تدعم إرفاق الملفات (.txt/.md وصور وفيديو).", "توثيق بـ 16 لغة، ونسخة PDF للطباعة، وأرشيف إصدارات تفاعلي docs/index.html."], "knownLimits": ["يتطلب تثبيت Node.js 24+ وPython 3 وGit مسبقاً.", "الوضع الصوتي المحلي وتبويب «اليوميات» مخفيان مؤقتاً في إصدار العميل v0.1 لحين إكمال دعم المحركات المتعددة.", "يتم اكتشاف Qoder CLI في معالج الإعداد؛ وستصل إمكانية اختياره كنموذج رئيسي في تحديث لاحق."], "nextFocus": "إصلاحات v0.1 بناءً على أولى الملاحظات، واستقبال المرفقات بالكامل على الخادم، وإغلاق الجسر فوراً عند إغلاق النافذة."}, "es": {"title": "AllY · Genie v0.1 — Primer lanzamiento público", "summary": "Primer núcleo de escritorio funcional para Windows 10/11 que reúne varios modelos de IA en una sola ventana con memoria local en Markdown, orbe de estado, control de cuotas y asistente de 3 pasos.", "added": ["Conexiones y modo Auto: Claude Code CLI, Codex CLI, Antigravity CLI, DeepSeek Harness, pasarela API compatible con OpenRouter y detección/inicio de sesión de Qoder CLI desde la ventana.", "Espacio inicial en tema Grafito por defecto: chat a la izquierda con orbe limpio, panel de pasos en vivo y divisor suave; Recursos / Asistentes arriba a la derecha y monitor de hardware abajo (altura ajustable).", "Widgets de Recursos y Asistentes: cuotas de 5 h/semanales, seguimiento de umbral de contexto de 350k y consulta de saldo sin llamadas pagas en segundo plano.", "Instalador y pantalla de inicio nativos con animación AllY.exe + botón de libro integrado «Guía y versiones» (además de la ventana independiente AllY-Guide.exe).", "Asistente de inicio de 3 pasos con Modo lectura de ancho completo, 5 temas, personalización por arrastrar y soltar y panel amplio de comentarios con adjuntos (.txt/.md, imágenes, video).", "Documentación en 16 idiomas, PDF imprimible y archivo interactivo de versiones docs/index.html."], "knownLimits": ["Requiere tener instalados previamente Node.js 24+, Python 3 y Git.", "El modo de voz local y la pestaña Diario permanecen ocultos en la compilación cliente v0.1 mientras se completa el soporte multimotor.", "Qoder CLI se detecta en el asistente; su selección como modelo principal llegará en una actualización próxima."], "nextFocus": "Correcciones rápidas de v0.1 según los primeros reportes, recepción comp ss, OpenRouter 호환 API 게이트웨이 및 창 내 Qoder CLI 감지/로그인 지원.", "기본 「그래파이트」 작업 공간: 왼쪽에는 깔끔한 상태 오브·실시간 진행 레일·부드러운 분할선이 있는 채팅, 오른쪽 위에는 리소스/보조 모델, 아래에는 높이 조절 가능한 하드웨어 모니터.", "리소스 및 보조 모델 위젯: 5시간/주간 구독 한도, 350k 컨텍스트 임계값 추적, 유료 백그라운드 폴링 없는 잔액 확인.", "네이티브 애니메이션 설치/스플래시 AllY.exe + 앱 내 책 아이콘 「가이드 및 버전 기록」(독립 창 AllY-Guide.exe 포함).", "전체 너비 「읽기 모드」가 포함된 3단계 시작 마법사, 5개 테마, 드래그 앤 드롭 레이아웃 편집, 파일 첨부(.txt/.md, 이미지, 동영상) 지원 와이드 피드백 패널.", "16개 언어 문서, 인쇄용 PDF 및 대화형 버전 아카이브 docs/index.html."], "knownLimits": ["Node.js 24+, Python 3, Git이 미리 설치되어 있어야 합니다.", "로컬 음성 입출력과 「다이어리」 탭은 멀티 엔진 지원 마무리 전까지 v0.1 클라이언트 빌드에서 숨겨져 있습니다.", "Qoder CLI는 마법사에서 감지되며, 메인 채팅 모델 선택은 다음 업데이트에서 제공될 예정입니다."], "nextFocus": "초기 피드백 기반 v0.1 수정, 서버 측 미디어 첨부 처리 완료, 창 종료 시 브리지 즉시 종료."}, "tr": {"title": "AllY · Genie v0.1 — İlk genel sürüm", "summary": "Windows 10/11 için birden fazla yapay zekâ modelini yerel Markdown belleği, durum küresi, kota takibi ve 3 adımlı kurulum sihirbazıyla tek pencerede birleştiren ilk masaüstü çekirdeği.", "added": ["Bağlantılar ve Otomatik yönlendirme: Claude Code CLI, Codex CLI, Antigravity CLI, DeepSeek Harness, OpenRouter uyumlu API ağ geçidi ve pencereden Qoder CLI algılama/giriş.", "Varsayılan Grafit çalışma alanı: solda sade durum küresi, canlı adım şeridi ve akıcı ayırıcıyla sohbet; sağ üstte Kaynaklar / Yardımcılar ve altta yüksekliği ayarlanabilir donanım monitörü.", "Kaynaklar ve Yardımcılar araçları: 5 saatlik/haftalık abonelik kotaları, 350k bağlam eşiği takibi ve ücretli arka plan sorgusu olmadan bakiye kontrolü.", "Yerel animasyonlu kurulum ve açılış ekranı AllY.exe + uygulama içi kitap simgesi «Rehber ve sürümler» (ayrıca bağımsız AllY-Guide.exe penceresi).", "Tam genişlik «Okuma modu» ile 3 adımlı başlangıç sihirbazı, 5 tema, sürükle-bırak düzen özelleştirme ve dosya ekli (.txt/.md, görsel, video) geniş geri bildirim paneli.", "16 dilde dokümantasyon, yazdırılabilir PDF ve etkileşimli sürüm arşivi docs/index.html."], "knownLimits": ["Önceden kurulu Node.js 24+, Python 3 ve Git g <script>
const ALLY_THEMES = ['graphite', 'teal', 'midnight', 'noir', 'light'];
const escHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const safeUrl = raw => {
  const u = String(raw || '').trim();
  if (/^(https?:\/\/|\.\/|\.\.\/|docs\/|#|readme\/)/i.test(u)) return u;
  return '';
};
function formatInline(raw) {
  const stash = [];
  let text = String(raw ?? '').replace(/`([^`\n]+)`/g, (_, code) => {
    stash.push('<code>' + escHtml(code) + '</code>');
    return '\u0001C' + (stash.length - 1) + '\u0001';
  });
  text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, url) => {
    const clean = safeUrl(url);
    if (!clean) return escHtml(label);
    const ext = /^https?:\/\//i.test(clean) ? ' target="_blank" rel="noopener noreferrer"' : '';
    stash.push('<a href="' + escHtml(clean) + '"' + ext + '>' + escHtml(label) + '</a>');
    return '\u0001L' + (stash.length - 1) + '\u0001';
  });
  text = escHtml(text)
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
  return text.replace(/\u0001[CL](\d+)\u0001/g, (_, idx) => stash[Number(idx)] || '');
}
function renderMarkdown(src, copyLabel) {
  const lines = String(src || '').replace(/\r/g, '').split('\n');
  const out = [];
  const headings = [];
  let i = 0, secSeq = 0;
  const isFence = s => /^```/.test(s.trim());
  const isTableRow = s => /^\|/.test(s.trim());
  const isUl = s => /^\s*[-*]\s+/.test(s);
  const isOl = s => /^\s*\d{1,3}[.)]\s+/.test(s);
  while (i < lines.length) {
    const line = lines[i], trimmed = line.trim();
    if (!trimmed) { i++; continue; }
    if (isFence(line)) {
      const lang = trimmed.slice(3).trim() || 'text';
      const buf = [];
      i++;
      while (i < lines.length && !isFence(lines[i])) { buf.push(lines[i]); i++; }
      if (i < lines.length) i++;
      out.push('<div class="code-box"><div class="code-head"><span>' + escHtml(lang) + '</span><button type="button" class="copy-btn">' + escHtml(copyLabel || 'Copy') + '</button></div><pre><code>' + escHtml(buf.join('\n')) + '</code></pre></div>');
      continue;
    }
    const hm = /^(#{1,4})\s+(.*)$/.exec(trimmed);
    if (hm) {
      const lvl = hm[1].length, title = hm[2].trim();
      const id = 'sec-' + (++secSeq);
      if (lvl === 2) headings.push({ id, title });
      out.push('<h' + lvl + ' id="' + id + '">' + formatInline(title) + '</h' + lvl + '>');
      i++;
      continue;
    }
    if (/^---+$/.test(trimmed)) { out.push('<hr>'); i++; continue; }
    if (isTableRow(line)) {
      const rows = [];
      while (i < lines.length && isTableRow(lines[i])) {
        const rawRow = lines[i].trim();
        if (!/^\|[\s|:-]+\|$/.test(rawRow)) {
          rows.push(rawRow.replace(/^\||\|$/g, '').split('|').map(c => c.trim()));
        }
        i++;
      }
      if (rows.length) {
        const head = rows[0], body = rows.slice(1);
        out.push('<div class="table-wrap"><table><thead><tr>' + head.map(c => '<th>' + formatInline(c) + '</th>').join('') + '</tr></thead><tbody>' + body.map(r => '<tr>' + r.map(c => '<td>' + formatInline(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>');
      }
      continue;
    }
    if (trimmed.startsWith('>')) {
      const q = [];
      while (i < lines.length && lines[i].trim().startsWith('>')) { q.push(lines[i].trim().replace(/^>\s?/, '')); i++; }
      out.push('<blockquote><p>' + formatInline(q.join(' ')) + '</p></blockquote>');
      continue;
    }
    if (isUl(line) || isOl(line)) {
      const ordered = isOl(line), tag = ordered ? 'ol' : 'ul';
      const items = [];
      while (i < lines.length && (ordered ? isOl(lines[i]) : isUl(lines[i]))) {
        let itemText = lines[i].replace(ordered ? /^\s*\d{1,3}[.)]\s+/ : /^\s*[-*]\s+/, '').trim();
        i++;
        while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !isUl(lines[i]) && !isOl(lines[i])) {
          itemText += ' ' + lines[i].trim();
          i++;
        }
        items.push('<li>' + formatInline(itemText) + '</li>');
      }
      out.push('<' + tag + '>' + items.join('') + '</' + tag + '>');
      continue;
    }
    const para = [];
    while (i < lines.length && lines[i].trim() && !isFence(lines[i]) && !/^(#{1,4}\s+|---+$|>|\|)/.test(lines[i].trim()) && !isUl(lines[i]) && !isOl(lines[i])) {
      para.push(lines[i].trim());
      i++;
    }
    if (para.length) out.push('<p>' + formatInline(para.join(' ')) + '</p>');
  }
  return { html: out.join('\n'), headings };
}
function allyGuideApp() {
  const data = JSON.parse(document.getElementById('ally-guide-data').textContent);
  const langSelect = document.getElementById('langSelect');
  const themeSelect = document.getElementById('themeSelect');
  const quickLangs = document.getElementById('quickLangs');
  const tocNav = document.getElementById('tocNav');
  const sheet = document.getElementById('sheet');
  const tabGuide = document.getElementById('tabGuide');
  const tabVersions = document.getElementById('tabVersions');
  const printBtn = document.getElementById('printBtn');
  const verPill = document.getElementById('verPill');
  const brandTitle = document.getElementById('brandTitle');
  const searchInput = document.getElementById('searchInput');
  const searchClear = document.getElementById('searchClear');
  const searchCount = document.getElementById('searchCount');
  const topBtn = document.getElementById('topBtn');
  const urlParams = new URLSearchParams(location.search);
  const embedded = urlParams.get('embedded') === '1' || (() => { try { return window.self !== window.top; } catch { return false; } })();
  if (embedded) document.documentElement.classList.add('is-embedded');

  let curLang = 'ru', curMode = 'guide', verFilter = 'all', searchQuery = '';
  const uiFor = code => data.ui?.[code] || data.ui?.en || data.ui?.ru;
  const normalizeTheme = v => v === 'paper' ? 'light' : (ALLY_THEMES.includes(v) ? v : null);
  const applyTheme = (raw, persist) => {
    const t = normalizeTheme(raw) || 'graphite';
    document.documentElement.dataset.theme = t;
    themeSelect.value = t;
    if (persist) { try { localStorage.setItem('ally-guide-theme-v1', t); } catch {} }
  };

  let initTheme = normalizeTheme(urlParams.get('theme'));
  if (!initTheme) {
    try { initTheme = normalizeTheme(window.parent?.document?.documentElement?.dataset?.theme); } catch {}
  }
  if (!initTheme) {
    try { initTheme = normalizeTheme(localStorage.getItem('ally-guide-theme-v1')); } catch {}
  }
  applyTheme(initTheme || 'graphite', false);

  try {
    if (embedded && window.parent?.document?.documentElement && typeof MutationObserver !== 'undefined') {
      new MutationObserver(() => {
        const pt = normalizeTheme(window.parent.document.documentElement.dataset.theme);
        if (pt) applyTheme(pt, false);
      }).observe(window.parent.document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    }
  } catch {}
  window.addEventListener('message', ev => {
    if (ev?.data?.type === 'ally-theme') applyTheme(ev.data.theme, false);
  });

  const urlLang = urlParams.get('lang');
  const savedLang = (() => { try { return localStorage.getItem('ally-guide-lang-v1'); } catch { return null; } })();
  if (urlLang && data.docs[urlLang]) curLang = urlLang;
  else if (savedLang && data.docs[savedLang]) curLang = savedLang;
  if (urlParams.get('tab') === 'versions') curMode = 'versions';
  langSelect.innerHTML = data.order.map(c => '<option value="' + escHtml(c) + '">' + escHtml(data.docs[c].label + ' (' + c + ')') + '</option>').join('');
  langSelect.value = curLang;
  quickLangs.innerHTML = ['ru', 'en', 'zh-CN', 'es'].map(c => '<button type="button" class="lang-chip" data-qlang="' + c + '">' + escHtml(c === 'zh-CN' ? '中文' : c.toUpperCase()) + '</button>').join('');
  verPill.textContent = 'v' + (data.versions?.current || '0.1');

  function syncThemeOptionLabels(ui) {
    const val = themeSelect.value;
    for (const opt of themeSelect.options) {
      if (ui.themes[opt.value]) opt.textContent = ui.themes[opt.value];
    }
    themeSelect.value = val;
  }

  function applySearchFilter() {
    const q = searchQuery.trim().toLowerCase();
    searchClear.hidden = !q;
    const prevEmpty = sheet.querySelector('.empty-search');
    if (prevEmpty) prevEmpty.remove();
    const ui = uiFor(curLang);

    if (curMode === 'guide') {
      const groups = new Map();
      let bucket = '__intro__';
      for (const el of sheet.children) {
        if (el.classList.contains('meta-foot')) continue;
        if (el.tagName === 'H2' && el.id) bucket = el.id;
        if (!groups.has(bucket)) groups.set(bucket, []);
        groups.get(bucket).push(el);
      }
      let matchedSections = 0;
      for (const [key, nodes] of groups.entries()) {
        if (!q) {
          nodes.forEach(n => { n.hidden = false; });
          const link = tocNav.querySelector('a[href="#' + key + '"]');
          if (link) link.hidden = false;
          continue;
        }
        const hay = nodes.map(n => n.textContent || '').join(' ').toLowerCase();
        const hit = hay.includes(q);
        if (hit && key !== '__intro__') matchedSections++;
        nodes.forEach(n => { n.hidden = !hit; });
        const link = tocNav.querySelector('a[href="#' + key + '"]');
        if (link) link.hidden = !hit;
      }
      if (q) {
        const total = [...groups.entries()].some(([k, ns]) => k === '__intro__' && ns.every(n => !n.hidden)) ? matchedSections : matchedSections;
        searchCount.hidden = false;
        searchCount.textContent = String(total);
        const anyVisible = [...sheet.children].some(el => !el.hidden && !el.classList.contains('meta-foot'));
        if (!anyVisible) {
          const empty = document.createElement('div');
          empty.className = 'empty-search';
          empty.textContent = ui.noHits;
          sheet.append(empty);
        }
      } else {
        searchCount.hidden = true;
      }
    } else {
      const cards = [...sheet.querySelectorAll('.rel-card')];
      let hits = 0;
      for (const card of cards) {
        const show = !q || (card.textContent || '').toLowerCase().includes(q);
        card.hidden = !show;
        if (show) hits++;
      }
      searchCount.hidden = !q;
      if (q) {
        searchCount.textContent = String(hits);
        if (!hits) {
          const empty = document.createElement('div');
          empty.className = 'empty-search';
          empty.textContent = ui.noHits;
          sheet.querySelector('.timeline')?.append(empty);
        }
      }
    }
    updateActiveToc();
  }

  function updateActiveToc() {
    if (curMode !== 'guide' || tocNav.hidden) return;
    const links = [...tocNav.querySelectorAll('a')].filter(a => !a.hidden);
    let active = links[0]?.getAttribute('href')?.slice(1) || '';
    for (const a of links) {
      const id = a.getAttribute('href').slice(1);
      const h = document.getElementById(id);
      if (h && !h.hidden && h.getBoundingClientRect().top <= 130) active = id;
    }
    for (const a of links) a.classList.toggle('on', a.getAttribute('href') === '#' + active);
  }

  function render() {
    const doc = data.docs[curLang] || data.docs.ru;
    const ui = uiFor(curLang);
    document.documentElement.lang = curLang;
    document.documentElement.dir = doc.dir || 'ltr';
    if (brandTitle && ui.brand) brandTitle.textContent = ui.brand;
    if (ui.docTitle) document.title = ui.docTitle;
    tabGuide.textContent = ui.guide;
    tabVersions.textContent = ui.versions;
    printBtn.textContent = ui.print;
    searchInput.placeholder = ui.searchPh;
    searchInput.setAttribute('aria-label', ui.searchPh);
    if (ui.clear) searchClear.setAttribute('aria-label', ui.clear);
    if (ui.top) { topBtn.setAttribute('aria-label', ui.top); topBtn.title = ui.top; }
    if (embedded && window.parent && window.parent !== window && location.origin !== 'null' && ui.docTitle) {
      try { window.parent.postMessage({ type: 'ally-guide-title', title: ui.docTitle }, location.origin); } catch {}
    }
    syncThemeOptionLabels(ui);
    tabGuide.classList.toggle('on', curMode === 'guide');
    tabVersions.classList.toggle('on', curMode === 'versions');
    quickLangs.querySelectorAll('.lang-chip').forEach(b => b.classList.toggle('on', b.dataset.qlang === curLang));
    if (curMode === 'guide') {
      const rendered = renderMarkdown(doc.markdown, ui.copy);
      const srcHref = escHtml(doc.rawFile === 'README.md' ? '../README.md' : doc.rawFile);
      const srcHtml = embedded ? escHtml(doc.rawFile) : '<a href="' + srcHref + '">' + escHtml(doc.rawFile) + '</a>';
      sheet.innerHTML = rendered.html + '<div class="meta-foot"><span>' + escHtml(ui.birthday) + '</span><span>' + escHtml(ui.srcLabel) + ' ' + srcHtml + '</span></div>';
      tocNav.hidden = false;
      sheet.parentElement?.classList.remove('no-toc');
      tocNav.innerHTML = '<h3>' + escHtml(ui.toc) + '</h3>' + rendered.headings.map(h => '<a href="#' + escHtml(h.id) + '">' + escHtml(h.title) + '</a>').join('');
    } else {
      const rels = (data.versions?.releases || []).filter(r => verFilter === 'all' || r.status === verFilter);
      const cards = rels.map(r => {
        const block = r[curLang] || r.en || r.ru;
        const badgeText = r.status === 'released' ? ui.released : ui.planned;
        const added = (block.added || []).map(x => '<li>' + formatInline(x) + '</li>').join('');
        const limits = (block.knownLimits || []).length ? '<p><strong>' + escHtml(ui.knownTitle) + '</strong></p><ul>' + block.knownLimits.map(x => '<li>' + formatInline(x) + '</li>').join('') + '</ul>' : '';
        const next = block.nextFocus ? '<p class="rel-next"><strong>' + escHtml(ui.nextTitle) + '</strong> ' + escHtml(block.nextFocus) + '</p>' : '';
        return '<article class="rel-card"><div class="rel-head"><span class="rel-ver">' + escHtml(r.version) + '</span><span class="rel-date">' + escHtml(r.date) + '</span><span class="badge ' + escHtml(r.status) + '">' + escHtml(badgeText) + '</span></div><h3>' + escHtml(block.title) + '</h3><p>' + escHtml(block.summary) + '</p><ul>' + added + '</ul>' + limits + next + '</article>';
      }).join('');
      sheet.innerHTML = '<h1>' + escHtml(ui.vTitle) + '</h1><p>' + escHtml(ui.vLead) + '</p><div class="rel-filters"><button type="button" class="lang-chip ' + (verFilter === 'all' ? 'on' : '') + '" data-vfilter="all">' + escHtml(ui.all) + '</button><button type="button" class="lang-chip ' + (verFilter === 'released' ? 'on' : '') + '" data-vfilter="released">' + escHtml(ui.released) + '</button><button type="button" class="lang-chip ' + (verFilter === 'planned' ? 'on' : '') + '" data-vfilter="planned">' + escHtml(ui.planned) + '</button></div><div class="timeline">' + cards + '</div>';
      tocNav.hidden = true;
      sheet.parentElement?.classList.add('no-toc');
    }
    applySearchFilter();
  }
  const setLang = code => {
    if (!data.docs[code]) return;
    curLang = code;
    langSelect.value = code;
    try { localStorage.setItem('ally-guide-lang-v1', code); } catch {}
    render();
  };
  langSelect.addEventListener('change', () => setLang(langSelect.value));
  quickLangs.addEventListener('click', e => { const b = e.target.closest('[data-qlang]'); if (b) setLang(b.dataset.qlang); });
  themeSelect.addEventListener('change', () => applyTheme(themeSelect.value, true));
  searchInput.addEventListener('input', () => { searchQuery = searchInput.value; applySearchFilter(); });
  searchClear.addEventListener('click', () => { searchQuery = ''; searchInput.value = ''; applySearchFilter(); searchInput.focus(); });
  tabGuide.addEventListener('click', () => { curMode = 'guide'; render(); });
  tabVersions.addEventListener('click', () => { curMode = 'versions'; render(); });
  printBtn.addEventListener('click', () => window.print());
  topBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
  window.addEventListener('scroll', () => {
    topBtn.hidden = window.scrollY < 320;
    updateActiveToc();
  }, { passive: true });
  sheet.addEventListener('click', async e => {
    const f = e.target.closest('[data-vfilter]');
    if (f) { verFilter = f.dataset.vfilter; render(); return; }
    const btn = e.target.closest('.copy-btn');
    if (!btn) return;
    const text = btn.closest('.code-box')?.querySelector('pre')?.textContent || '';
    let copied = false;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      try { await navigator.clipboard.writeText(text); copied = true; } catch {}
    }
    if (!copied) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        copied = document.execCommand('copy');
        document.body.removeChild(ta);
      } catch {}
    }
    const ui = uiFor(curLang);
    btn.textContent = ui.copied;
    setTimeout(() => { btn.textContent = ui.copy; }, 1600);
  });
  render();
}
if (typeof document !== 'undefined') document.addEventListener('DOMContentLoaded', allyGuideApp);
if (typeof globalThis !== 'undefined') globalThis.__allyGuideRenderMarkdown = renderMarkdown;
</script>
</body>
