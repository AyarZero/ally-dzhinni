Claude Code CLIプロセスを介して外部モデルに接続（Anthropicのサブスクリプションは不要） |\n| **Qoder CLI** | ローカルCLI（検出とログイン） | 接続ウィザードで検出（ウィンドウ内からのログインを含む）。チャットのメインエンジンとしての利用は次回更新で対応予定 |\n\n### 2. ワークスペースとインターフェース\n- **起動画面：** 左側に文字なしの状態球体とステップ表示を持つ**「会話」**、右側に高さ調整可能な**「リソース」/「アシスタント」**（上）と**「ノートPC」**モニター（下）が配置されています。\n- **上部バー（右から左へ）：** 右端の時計、ワイド表示の**フィードバックパネル（虫）**、**ブラシ**（ウィジェットの移動とサイズ変更、レイアウト初期化）、**テーマ**（既定は**グラファイト**、ほかにターコイズ・ミッドナイト・ダーク・ライト）、ウィンドウ内で開く**本アイコン（ガイド＆更新履歴）**、**稲妻**（全幅**「閲覧モード」**付き3ステップ接続ウィザード）。\n- **ローカル保存：** `pamyat/`（ローカルMarkdownメモリ）、`.claude/skills/`（ローカルスキル）、`.ally-data/`（キーとウィンドウのレイアウト。Gitの管理対象外）。\n\n## インストールと起動（Windows 10/11）\n\n**インストール前に、以下がインストール済みで、`PATH`から利用できることを確認してください。**\n1. **Node.js 24+**（組み込みモジュール`node:sqlite`に対応）\n2. **Python 3**\n3. **Git**\n4. 初回ビルド時のインターネット接続（`npm ci`とElectronのダウンロード用）、および少なくとも1つの接続済みAIエンジンまたはキー。\n\n次の3つの方法から選んでインストールできます。\n\n### 方法1 — アーカイブと使い慣れた`.exe`\n1. リポジトリのZIPアーカイブをダウンロードし、`C:\\AllY`など、キリル文字を含まない短いパスに展開します。\n2. **`AllY.exe`**をダブルクリックします。初回起動時は`node` 24+、`python`、`git`を確認し、依存関係のインストール、Electronのダウンロード、実行ファイル**`programma\\Dzhinni.exe`**のビルド、デスクトップへの**`AllY`**ショートカット作成を行い、そのままアプリウィンドウを開きます。\n  *未署名の新しい `.exe` に対し Windows SmartScreen の警告が出た場合は「詳細情報」→「実行」を押してください（ランチャーのソースは `docs/launchers/` に公開されており、`.\\ustanovka.ps1` を直接実行することもできます）。*\n3. 次回からは**`AllY.exe`**、デスクトップの**`AllY`**ショートカット、または**`programma\\Dzhinni.exe`**をダブルクリックして起動します。ガイドと更新履歴を専用アプリウィンドウで開くには**`AllY-Guide.exe`**を実行してください。\n4. 初回起動時は3ステップのセットアップウィザードが開きます。使用するAIを接続して、最初のメッセージを送信してください。\n\n### 方法2 — ターミナルのコマンド（PowerShell / cmd）\nPowerShellを開き、順に実行します。\n\n```powershell\ngit clone https://github.com/AyarZero/ally-dzhinni.git C:\\AllY\ncd C:\\AllY\n.\\AllY.exe\n```\n\n後からビルドの準備状況を確認するには、次を実行します。\n\n```powershell\n.\\AllY.exe -Proverka\n```\n\nターミナルから起動するには、次を実行します。\n\n```powershell\n.\\AllY.exe\n```\n\n### 方法3 — ローカルAIに渡すインストール用プロンプト\nコンピューター上でClaude Code、Codex、AntigravityなどのAIアシスタントをすでに使っている場合は、以下の全文をコピーして送信してください。\n\n```text\nこのWindows PCに、リポジトリ https://github.com/AyarZero/ally-dzhinni からローカルデスクトップアプリAllY · ジンニー (v0.1) をインストールし、起動できる状態にしてください。\n1. ターミナルで`git`、`python`（Python 3）、`node`の有無を確認してください。Node.js 24+が必要です。`node -e \"require('node:sqlite')\"`が正常に実行できることも確認してください。不足するものがある場合やNodeのバージョンが24未満の場合は、私に知らせ、ビルド前の追加インストールを手伝ってください。\n2. リポジトリを`C:\\AllY`など、キリル文字と空白を含まない短いパスにクローンし、そのフォルダーに移動してください。\n3. `powershell -NoProfile -ExecutionPolicy Bypass -File .\\ustanovka.ps1`でインストールを実行し、`programma\\Dzhinni.exe`のビルド完了を待ってください。\n4. `powershell -NoProfile -ExecutionPolicy Bypass -File .\\ustanovka.ps1 -Proverka`でビルドを確認してください。\n5. システムで利用できるCLIエンジン（Claude Code、Codex、Antigravity、DeepSeek Harness、Qoder）やOpenRouterのキーを確認し、何がすでに準備できているか簡潔に教えてください。\n6. `programma\\Dzhinni.exe`（または`.\\AllY.exe`）を起動し、AllYのウィンドウを開いて作業を始められることを私に伝えてください。\n```\n\n*注意：接続したCLI実行エンジンは、開いている作業フォルダーのファイルを直接操作し、読み取りや編集のたびに確認を求めません。重要なプロジェクトはGitで管理してください。*\n\n---\n\n## フィードバックとプロジェクト開発への参加\n\nヘッダー右側（時計の左）には、**虫のアイコンの「フィードバック」**ボタンがあります。インターフェースから直接、次のことができます。\n\n- バグ、インターフェースの不具合、起動の問題を報告する。\n- 証拠となるファイルを最大**3ファイル**添付する。テキストログ`.txt` / `.md`（最大`2 MB`）、スクリーンショット`.png` / `.jpg` / `.jpeg` / `.webp` / `.gif`（最大`10 MB`）、短い動画`.mp4` / `.webm` / `.mov`（最大`25 MB`、添付全体で最大`30 MB`）に対応。\n- 新しいモジュール、スキル、利用方法を提案する。\n\n送信されるのは**フォームのテキストと自分で選んだファイルだけ**です。会話、個人メモ、キーはローカルに残ります。開発者からの返信は、アプリ内の会話に届きます。プロジェクトはMITライセンスで公開されています。`.claude/skills/`に独自のスキルを作成したり、コアの改善に参加したりできます。\n\n---\n\n## 現在対応中のv0.1の既知の問題と制限\n\n現時点の制限や調整中の項目を、率直に記載します。\n\n1. **実行環境の依存ソフトは事前インストールが必要：** `v0.1`のインストールには、`Node.js 24+`、`Python 3`、`Git`がインストール済みである必要があります。ソフトの手動準備が不要な単体の`.exe`インストーラーは開発中です。\n2. **v0.1のクライアントビルドでは音声入力と読み上げを非表示：** ローカル音声認識（`GigaAM`）とそのインストーラーを調整しているため、マイクと音声のボタンを一時的に削除しています。\n3. **日記（「率直な対話」）はv0.1クライアントビルドでは非表示です：** 複数エンジン対応を仕上げている段階であり、次期アップデートで公開予定です。\n4. **ウィンドウを閉じた後、バックグラウンドブリッジの停止まで時間がかかる場合がある：** ウィンドウを閉じてすぐに別のインスタンスを開くと、ローカルのブリッジサーバーがアイドルタイムアウト（最大約9分）まで終了しない場合があります。\n5. **Qoderは統合作業中：** 接続ウィザードはローカルのQoder CLIとログイン状態を検出しますが、会話のメインエンジンとしての利用は次回リリースまで無効です。\n6. **フィードバックの大容量添付に対するサーバー側の受け入れ対応は段階的に更新中：** バックエンドの更新完了前にスクリーンショットや動画を送信し、サイズやファイル受け入れのエラーが返った場合は、下書きを失わず、そのままテキストのみで送信できます。\n7. **プラットフォーム：** ビルドとテストは**Windows 10/11**のみで実施しています。\n\n---\n\n## ロードマップとおおよその時期\n\n日程は目安です。直近のリリースは週単位、それ以降は幅のある期間で示しており、実際のユーザーフィードバックに応じて変更します。\n\n| おおよその時期 | リリース予定 |\n|---|---|\n| **2026年11月末〜12月初め** *（1〜2週間）* | アプリ内から寄せられた初期フィードバックに基づく修正、フィードバックに添付された画像・動画のサーバー側での全面的な受け入れ対応、ウィンドウを閉じた際のバックグラウンドブリッジの即時終了 |\n| **2026年12月後半** | 組み込みの**「タスクとプロジェクト」**トラッカー（今日の重点、ボード、カレンダー、カード）と、選択した任意のエンジンによる**「日記」**タブの動作 |\n| **2027年1月** | **ローカル音声モード**の復帰（クラウドを使わないオフライン音声入力＋回答の読み上げ）と、`Node.js`や`Git`の手動インストールが不要な簡易インストーラー |\n| **2027年2〜3月** | **「学習」**セクション（アプリ内のレッスンライブラリと、AllYおよびリリース準備に関する無料入門コース）、カスタムウィジェットビルダー、レビュー・コンテンツ用モジュール |\n| **2027年4〜5月** | ワークスペースのインタラクティブな**ナレッジグラフ**、**「プロジェクトの健全性」**パネル（リンクの網羅状況と古くなったノード）、コード読解アシスタントとしてのQoderの本格対応 |\n| **2027年6〜7月** | 第2のデータベースを持たず、保護された通信経路で自宅PCに接続する**Androidクライアント**のベータ版と、macOS・Linux向けのデスクトップ対応 |\n| **2027年8月以降** | 安定版`v1.0`、コミュニティ共有スキルのカタログ、ユーザーの複数デバイス間でのワークスペース同期 |\n"}, "de": {"label": "Deutsch", "dir": "ltr", "rawFile": "readme/README.de.md", "markdown": "# AllY · Dschinni (v0.1)\n\nLokale Desktop-Oberfläche für Windows, die mehrere KI-Systeme in einem Fenster vereint – mit gemeinsamem Gesprächsverlauf, lokalem Speicher auf der Festplatte, Aufgabenwarteschlange und Limitüberwachung.\n\n*Geburtstag von AllY · Dschinni: 23. November 2026. Lizenz: MIT.*\n\n---\n\n## Was ist diese Anwendung und welches Problem löst sie?\n\nBei regelmäßiger Arbeit mit KI verteilen sich Aufgaben schnell auf verschiedene Browser-Tabs, Konsolenfenster und separate Schlüssel. Wenn das Fünf-Stunden-Limit eines Modells erreicht ist, muss man ein anderes öffnen und den Projektkontext erneut erklären.\n\n**AllY · Dschinni** löst vier praktische Aufgaben:\n\n- **Gemeinsamer Kontext über Modellgrenzen hinweg.** Gesprächsverlauf und persönliche Regeln werden lokal in Markdown-Dateien (`pamyat/`) gespeichert. KI-System, Modell oder Denktiefe lassen sich direkt in der Eingabezeile wechseln, damit das nächste Modell an derselben Stelle weiterarbeitet.\n- **Transparente Arbeit mit CLI-Agenten.** In einem gewöhnlichen Terminal ist es schwer, den aktuellen Schritt eines Agenten rechtzeitig zu erkennen und während der Ausführung einzugreifen. AllY zeigt links eine Statuskugel und einen Verlauf der aktuellen Aktionen hinter einer fließenden vertikalen Trennlinie mit verstellbarer Breite. Rechts befinden sich Chat und Aufgabenwarteschlange – mit Unterstützung für Präzisierungen während der Ausführung (`live-steer`), das Bearbeiten der Warteschlange und das Vorziehen wichtiger Nachrichten.\n- **Überwachung von Limits und Kontextfenster.** Das Widget **„Ressourcen“** zeigt das führende KI-System, die Kontextauslastung (mit einem Schwellenwert von `350k`) sowie die 5-Stunden- und Wochenkontingente der Abonnements. Der Tab **„Assistenten“** bündelt die Guthaben der übrigen Anbindungen. Die Werte werden lokal und ohne kostenpflichtige Hintergrundaufrufe ausgelesen.\n- **Datenkontrolle und direkte Anbindungen.** Chatverläufe, Notizen in `pamyat/`, Skills in `.claude/skills/` und lokale Einstellungen in `.ally-data/` bleiben auf Ihrem Computer. Sie nutzen Ihre eigenen Abonnements und Schlüssel direkt bei den gewählten Anbietern.\n\n---\n\n## Für wen die Anwendung gedacht ist\n\n- **Entwickler und Vibe-Coder**, die Projekte mit Claude Code, Codex, Antigravity oder DeepSeek bearbeiten und Agentenschritte, Warteschlange und Kontextverbrauch in einem steuerbaren Fenster sehen möchten.\n- **Autoren, Unternehmer und Fachleute**, die einen gemeinsamen lokalen Speicher für ihre Projekte auf dem eigenen PC benötigen.\n- **Nutzer von Windows 10/11**, die ein lokales Werkzeug mit anpassbarem Layout suchen und über integriertes Feedback Einfluss auf kommende Releases nehmen möchten.\n\n---\n\n## Was in Version 0.1 tatsächlich funktioniert\n\n### 1. Anbindungen und Modus „Auto“\nZum Einstieg genügt mindestens eine Anbindung. Im Modus **„Auto“** wählt das System selbst einen verfügbaren Agenten:\n\n| Anbindung | Betriebsweise | Funktionen in v0.1 |\n|---|---|---|\n| **Claude Code** | Offizielles CLI mit Anthropic-Pro-/Max-Abonnement | Komplexe Aufgaben, Code, Texte, Planung und automatische Kontextkomprimierung |\n| **Codex** | Offizielles CLI mit ChatGPT-Plus-/Pro-Abonnement | Arbeit an Repositorys und Präzisierungen während der Antwort (`live-steer`) |\n| **Antigravity** | Offizielles CLI von Google AI | Analysen mit großem Kontext (Fensterschwelle `350k`) und Kontingentüberwachung |\n| **DeepSeek Harness** | Lokales Headless-Profil `dsh` auf Basis des DeepSeek-Guthabens | Kostengünstiger Reserveagent, Guthabenprüfung im Tab „Assistenten“ |\n| **API-Aggregator (OpenRouter)** | Beliebiges Anthropic-kompatibles Gateway mit Base URL und Schlüssel | Anbindung externer Modelle über einen lokalen Claude Code CLI-Prozess (ohne Anthropic-Abonnement) |\n| **Qoder CLI** | Lokales CLI (Erkennung und Anmeldung) | Wird vom Verbindungsassistenten erkannt (einschließlich Anmeldung im Fenster); die Rolle als führender Agent im Chat folgt im nächsten Update |\n\n### 2. Arbeitsbereich und Oberfläche\n- **Startansicht:** Links öffnet sich **„Chat“** mit reiner Statuskugel, Schritt-Timeline und fließendem Trenner; rechts sitzen **„Ressourcen“ / „Assistenten“** (oben) und **„Laptop“** (unten) mit frei verstellbarer Höhe.\n- **Obere Leiste (von rechts nach links):** Uhr rechts, breites **Feedback-Panel (Käfer)**, **Pinsel** (Widgets verschieben und skalieren, Layout zurücksetzen), **Designs** (Standard: **Graphit**, dazu Türkis, Mitternacht, Dunkel, Hell), **Buch-Symbol** (integrierter Guide & Versionsverlauf im Fenster) und **Blitz** (3-stufiger Assistent mit vollbreitem **„Lesemodus“**).\n- **Lokale Speicherung:** `pamyat/` (lokaler Markdown-Speicher), `.claude/skills/` (lokale Skills), `.ally-data/` (Schlüssel und Fensterlayout, von Git ausgeschlossen).\n\n## Installation und Start (Windows 10/11)\n\n**Stellen Sie vor der Installation sicher, dass Folgendes bereits installiert und über `PATH` verfügbar ist:**\n1. **Node.js 24+** (mit Unterstützung für das integrierte Modul `node:sqlite`)\n2. **Python 3**\n3. **Git**\n4. Internetzugang für den ersten Build (`npm ci` und Download von Electron) sowie mindestens eine angebundene KI-Engine oder ein Schlüssel.\n\nWählen Sie eine der drei Installationsmethoden:\n\n### Methode 1 — per Archiv und vertrauter `.exe`\n1. Laden Sie das ZIP-Archiv des Repositorys herunter und entpacken Sie es in einen kurzen Pfad ohne kyrillische Zeichen, zum Beispiel `C:\\AllY`.\n2. Doppelklicken Sie auf **`AllY.exe`**. Beim ersten Start prüft das Programm `node` 24+, `python` und `git`, installiert Abhängigkeiten, lädt Electron herunter, erstellt **`programma\\Dzhinni.exe`**, legt die Verknüpfung **`AllY`** auf dem Desktop an und öffnet direkt das Fenster.\n  *Falls Windows SmartScreen bei einer neuen unsignierten `.exe` warnt, klicke auf **Weitere Informationen → Trotzdem ausführen** (der Quellcode liegt offen in `docs/launchers/`, alternativ direkt `.\\ustanovka.ps1` starten).*\n3. Starten Sie die Anwendung künftig per Doppelklick auf **`AllY.exe`**, die Desktop-Verknüpfung **`AllY`** oder direkt über **`programma\\Dzhinni.exe`**. Dokumentation und Versionsverlauf in einem eigenen Anwendungsfenster öffnet **`AllY-Guide.exe`**.\n4. Beim ersten Start öffnet sich ein 3-stufiger Einrichtungsassistent. Verbinden Sie das gewünschte KI-System und senden Sie die erste Nachricht.\n\n### Methode 2 — mit Terminalbefehlen (PowerShell / cmd)\nÖffnen Sie PowerShell und führen Sie diese Befehle nacheinander aus:\n\n```powershell\ngit clone https://github.com/AyarZero/ally-dzhinni.git C:\\AllY\ncd C:\\AllY\n.\\AllY.exe\n```\n\nDen Build können Sie später mit folgendem Befehl prüfen:\n\n```powershell\n.\\AllY.exe -Proverka\n```\n\nStart über das Terminal:\n\n```powershell\n.\\AllY.exe\n```\n\n### Methode 3 — fertiger Prompt für Ihren lokalen KI-Assistenten\nWenn Claude Code, Codex, Antigravity oder ein anderer KI-Assistent bereits auf Ihrem Computer läuft, kopieren Sie diesen Text vollständig und senden Sie ihn an den Assistenten:\n\n```text\nInstalliere die lokale Desktop-Anwendung AllY · Dschinni (v0.1) aus dem Repository https://github.com/AyarZero/ally-dzhinni auf diesem Windows-PC und bereite sie für den Start vor:\n1. Prüfe im Terminal, ob `git`, `python` (Python 3) und `node` vorhanden sind (benötigt wird Node.js 24+ mit erfolgreicher Prüfung durch `node -e \"require('node:sqlite')\"`). Falls etwas fehlt oder die Node-Version unter 24 liegt, informiere mich und hilf mir, die fehlende Software vor dem Build zu installieren.\n2. Klone das Repository in einen kurzen Pfad ohne kyrillische Zeichen und Leerzeichen, zum Beispiel `C:\\AllY`, und wechsle in diesen Ordner.\n3. Starte die Installation mit `powershell -NoProfile -ExecutionPolicy Bypass -File .\\ustanovka.ps1` und warte, bis `programma\\Dzhinni.exe` erstellt wurde.\n4. Prüfe den Build mit dem Befehl `powershell -NoProfile -ExecutionPolicy Bypass -File .\\ustanovka.ps1 -Proverka`.\n5. Prüfe, welche CLI-Engines (Claude Code, Codex, Antigravity, DeepSeek Harness, Qoder) oder OpenRouter-Schlüssel bereits im System verfügbar sind, und teile mir kurz mit, was schon einsatzbereit ist.\n6. Starte `programma\\Dzhinni.exe` (oder `.\\AllY.exe`) und teile mir mit, dass ich das AllY-Fenster öffnen und mit der Arbeit beginnen kann.\n```\n\n*Hinweis: Angebundene CLI-Agenten greifen direkt auf die Dateien des geöffneten Arbeitsordners zu, ohne jedes Lesen oder Bearbeiten einzeln bestätigen zu lassen. Verwalten Sie wichtige Projekte mit Git.*\n\n---\n\n## Feedback und Mitwirkung am Projekt\n\nRechts in der Kopfzeile (links neben der Uhr) befindet sich die Schaltfläche mit dem **Käfersymbol — „Feedback“**. Damit können Sie direkt aus der Oberfläche:\n\n- Fehler, defekte Oberflächenelemente oder Startprobleme melden;\n- bis zu **3 Dateien** als Belege anhängen: Textprotokolle `.txt` / `.md` (bis `2 MB`), Screenshots `.png` / `.jpg` / `.jpeg` / `.webp` / `.gif` (bis `10 MB`) oder kurze Videos `.mp4` / `.webm` / `.mov` (bis `25 MB`, insgesamt bis `30 MB`);\n- ein neues Modul, einen Skill oder einen Anwendungsfall vorschlagen.\n\nÜbertragen werden **nur der Formulartext und die von Ihnen ausgewählten Dateien**. Chatverläufe, persönliche Notizen und Schlüssel bleiben lokal. Antworten der Entwickler erscheinen im Chat der Anwendung. Das Projekt steht unter der MIT-Lizenz: Sie können eigene Skills in `.claude/skills/` erstellen und an der Weiterentwicklung des Kerns mitwirken.\n\n---\n\n## Bekannte Probleme und Einschränkungen in v0.1, an denen wir derzeit arbeiten\n\nWir dokumentieren offen, was derzeit eingeschränkt ist oder noch überarbeitet wird:\n\n1. **Umgebungsabhängigkeiten müssen vorab installiert werden:** Für die Installation von `v0.1` müssen `Node.js 24+`, `Python 3` und `Git` bereits installiert sein. Ein eigenständiger `.exe`-Installer ohne manuelle Softwarevorbereitung ist noch in Arbeit.\n2. **Spracheingabe und Sprachausgabe sind im Client-Build v0.1 ausgeblendet:** Die Mikrofon- und Sprachschaltflächen wurden vorübergehend entfernt, während die lokale Spracherkennung (`GigaAM`) und deren Installer überarbeitet werden.\n3. **Das Tagebuch („Ehrliches Gespräch“) ist in Client-Build v0.1 ausgeblendet:** Die Unterstützung aller Engines wird noch fertiggestellt und erscheint in einem der nächsten Updates.\n4. **Verzögertes Herunterfahren der Hintergrund-Bridge nach dem Schließen des Fensters:** Beim Schließen des Fensters kann sich der lokale Bridge-Server erst nach einem Inaktivitäts-Timeout (bis zu ~9 Minuten) beenden, wenn unmittelbar eine weitere Instanz geöffnet wird.\n5. **Qoder wird derzeit integriert:** Der Verbindungsassistent erkennt das lokale Qoder-CLI und den Anmeldestatus. Die Verwendung von Qoder als führendem Agenten im Chat bleibt jedoch bis zum nächsten Release deaktiviert.\n6. **Serverseitiger Rollout für den Empfang großer Feedback-Anhänge:** Falls der Feedback-Server beim Senden eines Screenshots oder Videos vor Abschluss des Backend-Updates einen Größenfehler meldet oder die Datei ablehnt, lässt sich das Formular sofort als reiner Text senden, ohne den Entwurf zu verlieren.\n7. **Plattform:** Nur für **Windows 10/11** getestet und gebaut.\n\n---\n\n## Roadmap und ungefähre Zeitplanung\n\nDie Termine sind Richtwerte. Die nächsten Releases sind nach Wochen geplant, spätere in größeren Zeiträumen. Je nach tatsächlichem Nutzerfeedback können sie sich verschieben:\n\n| Ungefährer Zeitraum | Geplante Veröffentlichung |\n|---|---|\n| **Ende November — Anfang Dezember 2026** *(1–2 Wochen)* | Korrekturen anhand erster Rückmeldungen aus der Oberfläche, vollständige serverseitige Annahme von Foto-/Videoanhängen im Feedback, sofortiges Beenden der Hintergrund-Bridge beim Schließen des Fensters |\n| **Zweite Dezemberhälfte 2026** | Integrierter Tracker **„Aufgaben und Projekte“** (Tagesfokus, Board, Kalender, Karten) und Betrieb des Tabs **„Tagebuch“** mit einer beliebigen gewählten Engine |\n| **Januar 2027** | Rückkehr des **lokalen Sprachmodus** (Offline-Diktat ohne Cloud + Vorlesen der Antworten) und vereinfachter Installer ohne manuelle Installation von `Node.js` und `Git` |\n| **Februar — März 2027** | Bereich **„Lernen“** (Lektionsbibliothek im Fenster und kostenloser Einführungskurs zu AllY und zur Release-Vorbereitung), Baukasten für eigene Widgets und Module für Prüfung/Inhalte |\n| **April — Mai 2027** | Interaktiver **Wissensgraph** des Arbeitsbereichs, Übersicht **„Projektzustand“** (Abdeckung der Verknüpfungen und veraltete Knoten) und vollständige Unterstützung von Qoder als Assistent zum Lesen von Code |\n| **Juni — Juli 2027** | Beta-Release des **Android-Clients** mit Verbindung zum heimischen PC über einen geschützten Kanal ohne zweite Datenbank + Anpassung der Desktop-Anwendung für macOS und Linux |\n| **August 2027 und später** | Stabiles Release `v1.0`, Katalog gemeinsamer Community-Skills und Synchronisierung des Arbeitsbereichs zwischen mehreren Geräten eines Nutzers |\n"}, "fr": {"label": "Français", "dir": "ltr", "rawFile": "readme/README.fr.md", "markdown": "# AllY · Джинни (v0.1)\n\nApplication de bureau locale pour Windows réunissant plusieurs IA dans une seule fenêtre, avec un historique de conversation commun, une mémoire locale sur disque, une file de tâches et un suivi des limites.\n\n*Date de naissance d’AllY · Джинни : le 23 novembre 2026. Licence : MIT.*\n\n---\n\n## Présentation de l’application et du problème qu’elle résout\n\nQuand on travaille régulièrement avec l’IA, les tâches se dispersent vite entre les onglets du navigateur, les fenêtres de terminal et les différentes clés. Lorsqu’un modèle atteint sa limite de cinq heures, il faut en ouvrir un autre et lui réexpliquer le contexte du projet.\n\n**AllY · Джинни** répond à quatre besoins pratiques :\n\n- **Un contexte commun entre les modèles.** L’historique de conversation et votre base de règles sont stockés localement dans des fichiers Markdown (`pamyat/`). Vous pouvez changer d’IA, de modèle ou de profondeur de raisonnement directement dans la zone de saisie pour que le modèle suivant reprenne la tâche au même endroit.\n- **Une visibilité sur le travail des agents CLI.** Dans un terminal classique, il est difficile de repérer à temps l’étape en cours d’un agent et d’intervenir pendant son exécution. Dans AllY, la sphère d’état et le fil des actions en cours s’affichent à gauche, derrière un séparateur vertical fluide et redimensionnable. À droite se trouvent la conversation et la file de tâches, avec la possibilité de préciser les consignes à la volée (`live-steer`), de modifier la file et de donner la priorité à un message important.\n- **Un suivi des limites et de la fenêtre de contexte.** Le widget **« Ressources »** affiche l’IA principale, le remplissage du contexte (avec un seuil de `350k`) et les quotas des abonnements sur 5 heures et sur une semaine. L’onglet **« Assistants »** regroupe les soldes des autres connexions. Les indicateurs sont relevés localement, sans appels payants en arrière-plan.\n- **La maîtrise des données et des connexions directes.** Les conversations, les notes `pamyat/`, les compétences `.claude/skills/` et les paramètres locaux `.ally-data/` restent sur votre ordinateur. Vous utilisez vos propres abonnements et clés directement auprès des fournisseurs choisis.\n\n---\n\n## À qui s’adresse l’application\n\n- **Aux développeurs et aux adeptes du vibe coding** qui gèrent leurs projets avec Claude Code, Codex, Antigravity ou DeepSeek et souhaitent voir les étapes des agents, la file de tâches et l’utilisation du contexte dans une seule fenêtre qu’ils maîtrisent.\n- **Aux auteurs, entrepreneurs et professionnels** qui ont besoin d’une mémoire locale commune pour leurs projets sur leur propre PC.\n- **Aux utilisateurs de Windows 10/11** qui cherchent un outil local dont ils peuvent adapter l’agencement à leurs tâches et influencer les prochaines versions grâce aux retours intégrés.\n\n---\n\n## Ce qui fonctionne réellement dans la version 0.1\n\n### 1. Connexions et mode « Auto »\nPour commencer, il suffit de configurer au moins une connexion. En mode **« Auto »**, le système choisit lui-même un agent disponible :\n\n| Connexion | Mode de fonctionnement | Capacités dans v0.1 |\n|---|---|---|\n| **Claude Code** | CLI officiel avec un abonnement Anthropic Pro / Max | Tâches complexes, code, textes, planification et compression automatique du contexte |\n| **Codex** | CLI officiel avec un abonnement ChatGPT Plus / Pro | Travail sur les dépôts et précisions pendant la génération de la réponse (`live-steer`) |\n| **Antigravity** | CLI officiel Google AI | Analyses avec un contexte étendu (seuil de fenêtre de `350k`) et suivi des quotas |\n| **DeepSeek Harness** | Profil local sans interface `dsh`, utilisant le solde DeepSeek | Agent de secours économique, consultation du solde dans l’onglet « Assistants » |\n| **Agrégateur d’API (OpenRouter)** | Toute passerelle compatible avec Anthropic, via une URL de base et une clé | Connexion de modèles externes via un processus local Claude Code CLI (sans abonnement Anthropic) |\n| **Qoder CLI** | CLI local (détection et connexion au compte) | Détecté par l’assistant de connexion (avec connexion au compte depuis la fenêtre) ; son utilisation comme agent principal dans la conversation arrivera dans la prochaine mise à jour |\n\n### 2. Espace de travail et interface\n- **Écran d’accueil :** à gauche s’ouvre **« Conversation »** avec une sphère d’état épurée, le fil d’étapes et un séparateur fluide ; à droite se trouvent **« Ressources » / « Assistants »** (en haut) et **« Ordinateur »** (en bas), redimensionnables librement.\n- **Barre supérieure (de droite à gauche) :** horloge à droite, large panneau **retour d’expérience (insecte)**, **pinceau** (déplacement et redimensionnement des widgets, réinitialisation), **thèmes** (**Graphite** par défaut, plus Turquoise, Minuit, Sombre et Clair), **icône de livre** (guide et historique intégrés dans l’application) et **éclair** (assistant en 3 étapes avec **« Mode lecture »** pleine largeur).\n- **Stockage local :** `pamyat/` (mémoire Markdown locale), `.claude/skills/` (compétences locales), `.ally-data/` (clés et agencement de la fenêtre, exclu de Git).\n\n## Installation et lancement (Windows 10/11)\n\n**Avant l’installation, assurez-vous que les éléments suivants sont déjà installés et accessibles dans le `PATH` :**\n1. **Node.js 24+** (avec prise en charge du module intégré `node:sqlite`)\n2. **Python 3**\n3. **Git**\n4. Une connexion Internet pendant la première compilation (`npm ci` et téléchargement d’Electron), ainsi qu’au moins un moteur d’IA connecté ou une clé.\n\nChoisissez l’une de ces trois méthodes d’installation :\n\n### Méthode 1 — avec une archive et un `.exe` classique\n1. Téléchargez l’archive ZIP du dépôt et extrayez-la dans un chemin court sans caractères cyrilliques, par exemple `C:\\AllY`.\n2. Double-cliquez sur **`AllY.exe`** : au premier lancement, il vérifiera `node` 24+, `python` et `git`, installera les dépendances, téléchargera Electron, compilera **`programma\\Dzhinni.exe`**, créera le raccourci **`AllY`** sur le bureau et ouvrira la fenêtre.\n  *Si Windows SmartScreen affiche un avertissement pour un `.exe` non signé, cliquez sur **Informations complémentaires → Exécuter quand même** (le code source des lanceurs est ouvert dans `docs/launchers/`, ou lancez directement `.\\ustanovka.ps1`).*\n3. Par la suite, lancez l’application en double-cliquant sur **`AllY.exe`**, sur le raccourci **`AllY`** du bureau ou directement sur **`programma\\Dzhinni.exe`**. Pour ouvrir la documentation et l’historique des versions dans une fenêtre dédiée, lancez **`AllY-Guide.exe`**.\n4. Au premier lancement, l’assistant de démarrage en 3 étapes s’ouvre : connectez l’IA souhaitée et envoyez votre premier message.\n\n### Méthode 2 — avec des commandes dans le terminal (PowerShell / cmd)\nOuvrez PowerShell et exécutez les commandes suivantes dans l’ordre :\n\n```powershell\ngit clone https://github.com/AyarZero/ally-dzhinni.git C:\\AllY\ncd C:\\AllY\n.\\AllY.exe\n```\n\nVous pourrez vérifier ultérieurement que la compilation est prête avec la commande :\n\n```powershell\n.\\AllY.exe -Proverka\n```\n\nLancement depuis le terminal :\n\n```powershell\n.\\AllY.exe\n```\n\n### Méthode 3 — un prompt prêt à l’emploi pour votre IA locale\nSi Claude Code, Codex, Antigravity ou un autre assistant IA fonctionne déjà sur votre ordinateur, copiez ce texte en entier et envoyez-le-lui :\n\n```text\nInstalle et prépare au lancement l’application de bureau locale AllY · Джинни (v0.1) sur ce PC Windows à partir du dépôt https://github.com/AyarZero/ally-dzhinni :\n1. Vérifie dans le terminal la présence de `git`, de `python` (Python 3) et de `node` (il faut Node.js 24+ et la commande `node -e \"require('node:sqlite')\"` doit fonctionner). Si un élément manque ou si la version de Node est inférieure à 24, préviens-moi et aide-moi à l’installer avant la compilation.\n2. Clone le dépôt dans un chemin court sans caractères cyrilliques ni espaces, par exemple `C:\\AllY`, puis place-toi dans ce dossier.\n3. Lance l’installation : `powershell -NoProfile -ExecutionPolicy Bypass -File .\\ustanovka.ps1` et attends la compilation de `programma\\Dzhinni.exe`.\n4. Vérifie la compilation avec la commande `powershell -NoProfile -ExecutionPolicy Bypass -File .\\ustanovka.ps1 -Proverka`.\n5. Vérifie quels moteurs CLI (Claude Code, Codex, Antigravity, DeepSeek Harness, Qoder) ou quelles clés OpenRouter sont déjà disponibles dans le système, et indique-moi brièvement ce qui est prêt.\n6. Lance `programma\\Dzhinni.exe` (ou `.\\AllY.exe`) et indique-moi que je peux ouvrir la fenêtre AllY et commencer à travailler.\n```\n\n*Remarque : les agents CLI connectés travaillent directement sur les fichiers du dossier de travail ouvert, sans demander d’autorisation à chaque lecture ou modification. Gardez vos projets importants sous Git.*\n\n---\n\n## Retours et participation au développement du projet\n\nDans la partie droite de l’en-tête (à gauche de l’horloge), le bouton avec une **icône d’insecte — « Retours »** permet, directement depuis l’interface, de :\n\n- signaler une erreur, un dysfonctionnement de l’interface ou un problème de démarrage ;\n- joindre au message jusqu’à **3 fichiers** justificatifs : journaux texte `.txt` / `.md` (jusqu’à `2 Mo`), captures d’écran `.png` / `.jpg` / `.jpeg` / `.webp` / `.gif` (jusqu’à `10 Mo`) ou courtes vidéos `.mp4` / `.webm` / `.mov` (jusqu’à `25 Mo`, avec un total maximal de `30 Mo`) ;\n- proposer un nouveau module, une compétence ou un cas d’usage.\n\n**Seuls le texte du formulaire et les fichiers que vous avez sélectionnés** sont envoyés : les conversations, les notes personnelles et les clés restent en local. Les réponses des développeurs arrivent dans la conversation de l’application. Le projet est ouvert sous licence MIT : vous pouvez créer vos propres compétences dans `.claude/skills/` et contribuer à l’amélioration du cœur de l’application.\n\n---\n\n## Problèmes connus et limitations de v0.1 sur lesquels nous travaillons\n\nNous indiquons clairement ce qui reste limité ou est en cours de finalisation :\n\n1. **Les dépendances de l’environnement doivent être installées au préalable :** l’installation de `v0.1` nécessite que `Node.js 24+`, `Python 3` et `Git` soient déjà installés. Un installateur `.exe` autonome unique, sans préparation manuelle des logiciels, est encore en cours de développement.\n2. **La saisie et la restitution vocales sont masquées dans la version cliente v0.1 :** les boutons de microphone et de voix ont été temporairement retirés pendant la finalisation de la reconnaissance vocale locale (`GigaAM`) et de son installateur.\n3. **Le journal (« Conversation franche ») est masqué dans la version client v0.1 :** la prise en charge multi-moteurs est en cours de finalisation pour une prochaine mise à jour.\n4. **Arrêt différé du pont en arrière-plan après la fermeture de la fenêtre :** à la fermeture de la fenêtre, le serveur local du pont peut attendre le délai d’inactivité avant de s’arrêter (jusqu’à ~9 minutes) si une autre instance est rouverte immédiatement.\n5. **L’intégration de Qoder est en cours :** l’assistant de connexion détecte le CLI local Qoder et l’état de connexion au compte, mais l’utilisation de Qoder comme agent principal dans la conversation reste désactivée jusqu’à la prochaine version.\n6. **Déploiement côté serveur de la réception des pièces jointes volumineuses dans les retours :** si le serveur de retours renvoie une erreur de taille ou refuse un fichier lors de l’envoi d’une capture d’écran ou d’une vidéo avant la fin de la mise à jour du backend, vous pouvez immédiatement envoyer le formulaire en texte seul, sans perdre le brouillon.\n7. **Plateforme :** testé et compilé uniquement pour **Windows 10/11**.\n\n---\n\n## Feuille de route et calendrier prévisionnel\n\nLes dates sont indicatives : les prochaines versions sont planifiées à l’échelle de la semaine, les plus lointaines sur des périodes plus larges. Elles peuvent évoluer en fonction des retours réels des utilisateurs :\n\n| Période indicative | Fonctionnalités prévues |\n|---|---|\n| **Fin novembre — début décembre 2026** *(1 à 2 semaines)* | Corrections issues des premiers retours depuis l’interface, prise en charge complète côté serveur des photos et vidéos jointes aux retours, arrêt immédiat du pont en arrière-plan à la fermeture de la fenêtre |\n| **Seconde moitié de décembre 2026** | Outil de suivi intégré **« Tâches et projets »** (priorité du jour, tableau, calendrier, fiches) et fonctionnement de l’onglet **« Journal »** avec n’importe quel moteur choisi |\n| **Janvier 2027** | Retour du **mode vocal local** (dictée hors ligne sans cloud + lecture des réponses) et installateur simplifié sans installation manuelle de `Node.js` et de `Git` |\n| **Février — mars 2027** | Section **« Formation »** (bibliothèque de leçons dans l’application et cours d’introduction gratuit à AllY et à la préparation des versions), éditeur de widgets personnalisés et modules de révision/contenu |\n| **Avril — mai 2027** | **Graphe de connaissances** interactif de l’espace de travail, panneau **« Santé du projet »** (couverture des liens et nœuds obsolètes) et prise en charge complète de Qoder comme assistant de lecture de code |\n| **Juin — juillet 2027** | Version bêta du **client Android**, connecté au PC personnel par un canal sécurisé sans seconde base de données + adaptation de l’application de bureau à macOS et Linux |\n| **Août 2027 et au-delà** | Version stable `v1.0`, catalogue de compétences partagées par la communauté et synchronisation de l’espace de travail entre plusieurs appareils de l’utilisateur |\n"}, "he": {"label": "עברית", "dir": "rtl", "rawFile": "readme/README.he.md", "markdown": "# AllY · ג'יני (v0.1)\n\nמעטפת שולחן עבודה מקומית עבור Windows, המאחדת מספר מודלי בינה מלאכותית בחלון אחד עם היסטוריית שיחה משותפת, זיכרון מקומי בדיסק, תור משימות ומעקב מגבלות.\n\n*יום ההולדת של AllY · ג'יני — 23 בנובמבר 2026. רישיון: MIT.*\n\n---\n\n## מהי האפליקציה הזו ואיזו בעיה היא פותרת\n\nבעבודה שוטפת עם בינה מלאכותית, משימות מתפזרות במהירות בין לשוניות דפדפן, חלונות מסוף ומפתחות נפרדים. כשמודל אחד מגיע למגבלת 5 השעות שלו, צריך לפתוח מודל אחר ולהסביר את הקשר הפרויקט מחדש.\n\n**AllY · ג'יני** נותנת מענה לארבעה צרכים מעשיים:\n\n- **הקשר אחיד בין מודלים.** היסטוריית השיחה ובסיס הכללים שלכם נשמרים מקומית בקובצי Markdown (`pamyat/`). אפשר להחליף מנוע, מודל או עומק חשיבה ישירות בשורת הקלט, כדי שהמודל הבא ימשיך את המשימה מאותה נקודה.\n- **שקיפות בעבודת סוכני CLI.** במסוף רגיל קשה להבחין בזמן בצעד הנוכחי של הסוכן ולהתערב תוך כדי תנועה. ב-AllY מוצגים בצד שמאל כדור המצב וערוץ הפעולות השוטפות מאחורי מפריד אנכי חלק הניתן לגרירה לשינוי רוחב, ובצד ימין מופיעים השיחה ותור המשימות עם תמיכה בהכוונה בזמן אמת (`live-steer`), עריכת התור וקידום הודעה חשובה.\n- **בקרת מגבלות וחלון הקשר.** הווידג'ט **«משאבים»** מציג את המנוע המוביל, ניצול חלון ההקשר (עם סף `350k`), ומכסות מנוי ל-5 שעות ולשבוע, בעוד הלשונית **«עוזרים»** מרכזת את היתרות של שאר החיבורים. המדדים נקראים מקומית ללא קריאות רקע בתשלום.\n- **שליטה בנתונים וחיבורים ישירים.** השיחות, ההערות ב-`pamyat/`, המיומנויות ב-`.claude/skills/` וההגדרות המקומיות ב-`.ally-data/` נשארים במחשב שלכם. אתם משתמשים במנויים ובמפתחות שלכם ישירות מול הספקים שבחרתם.\n\n---\n\n## למי מיועדת האפליקציה\n\n- **מפתחים ו-vibe coders** שמנהלים פרויקטים דרך Claude Code, Codex, Antigravity או DeepSeek ורוצים לראות את שלבי הסוכנים, התור וצריכת ההקשר בחלון נשלט אחד.\n- **כותבים, יזמים ואנשי מקצוע** הזקוקים לזיכרון מקומי אחיד עבור הפרויקטים שלהם על המחשב האישי.\n- **משתמשי Windows 10/11** המחפשים כלי מקומי עם פריסת ממשק מותאמת למשימות שלהם ואפשרות להשפיע על הגרסאות הבאות דרך מנגנון המשוב המובנה.\n\n---\n\n## מה עובד בפועל בגרסה 0.1\n\n### 1. חיבורים ומצב «אוטומטי»\nכדי להתחיל, מספיק לחבר אפשרות אחת לפחות. במצב **«אוטומטי»** המערכת בוחרת מבצע זמין בעצמה:\n\n| חיבור | אופן הפעולה | יכולות ב-v0.1 |\n|---|---|---|\n| **Claude Code** | CLI רשמי עם מנוי Anthropic Pro / Max | משימות מורכבות, קוד, כתיבה, תכנון ודחיסה אוטומטית של ההקשר |\n| **Codex** | CLI רשמי עם מנוי ChatGPT Plus / Pro | עבודה מול מאגרי קוד והכוונה תוך כדי תשובה (`live-steer`) |\n| **Antigravity** | CLI רשמי של Google AI | ניתוחים עם הקשר רחב (סף חלון `350k`) ומעקב מכסות |\n| **DeepSeek Harness** | פרופיל headless מקומי `dsh` לפי יתרת DeepSeek | מבצע גיבוי וחסכוני, בדיקת יתרה בלשונית «עוזרים» |\n| **מאגד API (OpenRouter)** | כל שער תואם-Anthropic לפי Base URL ומפתח | חיבור מודלים חיצוניים דרך תהליך מקומי של Claude Code CLI (ללא מנוי Anthropic) |\n| **Qoder CLI** | CLI מקומי (זיהוי והתחברות) | מזוהה על ידי אשף החיבורים (כולל התחברות מתוך החלון); תפקיד המנוע המוביל בצ'אט יגיע בעדכון הבא |\n\n### 2. סביבת העבודה והממשק\n- **מסך פתיחה:** בצד אחד פתוחה **«שיחה»** עם כדור מצב נקי מטקסט וציר שלבים חי, ובצד השני **«משאבים» / «עוזרים»** (למעלה) ו**«מחשב»** (למטה) הניתנים לשינוי גובה חופשי.\n- **הסרגל העליון (מימין לשמאל):** שעון בקצה, חלונית **משוב רחבה (חיפושית)**, **מברשת** (הזזה ושינוי גודל ווידג'טים, איפוס פריסה), **ערכות נושא** (**גרפיט** כברירת מחדל, וכן טורקיז, חצות, כהה ובהירה), **סמל ספר** (מדריך והיסטוריית גרסאות בתוך החלון) ו**ברק** (אשף חיבורים בן 3 שלבים עם **«מצב קריאה»** רחב).\n- **אחסון מקומי:** `pamyat/` (זיכרון Markdown מקומי), `.claude/skills/` (מיומנויות מקומיות), `.ally-data/` (מפתחות ופריסת החלון, מוחרגת מ-Git).\n\n## התקנה והפעלה (Windows 10/11)\n\n**לפני ההתקנה ודאו שהרכיבים הבאים כבר מותקנים וזמינים ב-`PATH`:**\n1. **Node.js 24+** (עם תמיכה במודול המובנה `node:sqlite`)\n2. **Python 3**\n3. **Git**\n4. חיבור לאינטרנט בזמן הבנייה הראשונה (`npm ci` והורדת Electron) ולפחות מנוע בינה מלאכותית או מפתח אחד מחובר.\n\nבחרו אחת משלוש דרכי ההתקנה הנוחות:\n\n### דרך 1 — דרך ארכיון וקובץ `.exe` מוכר\n1. הורידו את ארכיון ה-ZIP של המאגר וחלצו אותו לנתיב קצר ללא תווים לא-לטיניים, למשל `C:\\AllY`.\n2. לחצו לחיצה כפולה על **`AllY.exe`** — בהפעלה הראשונה הקובץ יבדוק `node` 24+, `python` ו-`git`, יתקין תלויות, יוריד את Electron, יבנה את קובץ ההפעלה **`programma\\Dzhinni.exe`**, ייצור קיצור דרך **`AllY`** בשולחן העבודה ויפתח את החלון.\n  *אם Windows SmartScreen מציג אזהרה לקובץ `.exe` חדש ללא חתימה, לחצו **מידע נוסף ← הפעל בכל זאת** (קוד המקור של המפעילים פתוח ב-`docs/launchers/`, או הפעילו ישירות `.\\ustanovka.ps1`).*\n3. בהמשך הפעילו את האפליקציה בלחיצה כפולה על **`AllY.exe`**, על קיצור הדרך **`AllY`** בשולחן העבודה או ישירות דרך **`programma\\Dzhinni.exe`**. כדי לפתוח את המדריך והיסטוריית הגרסאות בחלון יישום נפרד, הפעילו את **`AllY-Guide.exe`**.\n4. בהפעלה הראשונה ייפתח אשף ההתחלה בן 3 השלבים — חברו את המודל הרצוי ושלחו הודעה ראשונה.\n\n### דרך 2 — באמצעות פקודות במסוף (PowerShell / cmd)\nפתחו את PowerShell והריצו לפי הסדר:\n\n```powershell\ngit clone https://github.com/AyarZero/ally-dzhinni.git C:\\AllY\ncd C:\\AllY\n.\\AllY.exe\n```\n\nכדי לבדוק את תקינות הבנייה מאוחר יותר, הריצו:\n\n```powershell\n.\\AllY.exe -Proverka\n```\n\nהפעלה מהמסוף:\n\n```powershell\n.\\AllY.exe\n```\n\n### דרך 3 — פרומפט מוכן לסוכן הבינה המלאכותית המקומי שלכם\nאם כבר פועל אצלכם במחשב Claude Code, Codex, Antigravity או עוזר בינה מלאכותית אחר, העתיקו את הטקסט הבא במלואו ושלחו לו:\n\n```text\nהתקן והכן להפעלה את אפליקציית שולחן העבודה המקומית AllY · ג'יני (v0.1) על מחשב Windows זה מתוך המאגר https://github.com/AyarZero/ally-dzhinni:\n1. בדוק במסוף אם מותקנים `git`, `python` (Python 3) ו-`node` (נדרשת גרסת Node.js 24+ עם בדיקה תקינה של `node -e \"require('node:sqlite')\"`). אם חסר רכיב כלשהו או שגרסת Node נמוכה מ-24 — הודע לי ועזור להשלים את ההתקנה לפני הבנייה.\n2. שכפל (clone) את המאגר לנתיב קצר ללא רווחים ותווים מיוחדים, למשל `C:\\AllY`, ועבור לתיקייה זו.\n3. הרץ את ההתקנה: `powershell -NoProfile -ExecutionPolicy Bypass -File .\\ustanovka.ps1` והמתן לסיום הבנייה של `programma\\Dzhinni.exe`.\n4. אמת את הבנייה באמצעות `powershell -NoProfile -ExecutionPolicy Bypass -File .\\ustanovka.ps1 -Proverka`.\n5. בדוק אילו מנועי CLI (Claude Code, Codex, Antigravity, DeepSeek Harness, Qoder) או מפתחות OpenRouter כבר זמינים במערכת, וסכם לי בקצרה מה כבר מוכן.\n6. הפעל את `programma\\Dzhinni.exe` (או `.\\AllY.exe`) והודע לי שאפשר לפתוח את החלון של AllY ולהתחיל לעבוד.\n```\n\n*הערה: מבצעי CLI מחוברים עובדים ישירות מול קובצי תיקיית העבודה הפתוחה ללא אישור נפרד לכל קריאה או עריכה — שמרו פרויקטים חשובים תחת Git.*\n\n---\n\n## משוב והשתתפות בפיתוח הפרויקט\n\nבצדה הימני של הכותרת העליונה (משמאל לשעון) נמצא כפתור עם **סמל חיפושית — «משוב»**. דרכו ניתן לבצע ישירות מתוך הממשק:\n\n- לדווח על באג, תקלה בממשק או בעיית הפעלה;\n- לצרף להודעה עד **3 קבצי** תיעוד: לוגים טקסטואליים `.txt` / `.md` (עד `2 MB`), צילומי מסך `.png` / `.jpg` / `.jpeg` / `.webp` / `.gif` (עד `10 MB`) או סרטונים קצרים `.mp4` / `.webm` / `.mov` (עד `25 MB`, ובסה\"כ עד `30 MB`);\n- להציע מודול חדש, מיומנות או תרחיש שימוש.\n\nנשלחים **רק טקסט הטופס והקבצים שבחרתם** — השיחות, ההערות האישיות והמפתחות נשארים מקומיים. תשובות המפתחים חוזרות ישירות לצ'אט באפליקציה. הפרויקט פתוח תחת רישיון MIT: תוכלו ליצור מיומנויות משלכם ב-`.claude/skills/` ולהשתתף בפיתוח הליבה.\n\n---\n\n## בעיות מוכרות ומגבלות ב-v0.1 שעליהן אנו עובדים כעת\n\nאנו מתעדים בשקיפות את מה שעדיין מוגבל או נמצא בהשלמה כרגע:\n\n1. **תלויות סביבה מותקנות מראש:** התקנת `v0.1` דורשת ש-`Node.js 24+`, `Python 3` ו-`Git` כבר יהיו מותקנים — מתקין `.exe` עצמאי ללא הכנה ידנית עדיין בפיתוח.\n2. **קלט קולי והקראה מוסתרים בבניית הלקוח של v0.1:** כפתורי המיקרופון והקול הוסרו זמנית בזמן השלמת זיהוי הדיבור המקומי (`GigaAM`) והמתקין שלו.\n3. **היומן («שיחה כנה») מוסתר בגרסת הלקוח v0.1:** התמיכה בכל המנועים עדיין בהשלמה, והלשונית תיפתח בעדכון הקרוב.\n4. **כיבוי הדרגתי של גשר הרקע לאחר סגירת החלון:** בעת סגירת החלון, שרת הגשר המקומי עשוי להיסגר לאחר פסק זמן של חוסר פעילות (עד כ-9 דקות) אם פותחים מיד מופע אחר.\n5. **Qoder בתהליך שילוב:** אשף החיבורים מזהה את ה-CLI המקומי של Qoder ואת מצב ההתחברות, אך השימוש ב-Qoder כמנוע מוביל בשיחה חסום עד לשחרור הבא.\n6. **קליטת קבצים גדולים בשרת המשוב:** אם בעת שליחת צילום מסך או סרטון שרת המשוב מחזיר שגיאת גודל או אי-קבלת קובץ לפני השלמת עדכון השרת, ניתן לשלוח מיד את הטופס כטקסט מבלי לאבד את הטיוטה.\n7. **פלטפורמה:** נבדק ונבנה עבור **Windows 10/11** בלבד.\n\n---\n\n## מפת דרכים ולוחות זמנים משוערים\n\nלוחות הזמנים הם משוערים — השחרורים הקרובים מתוכננים לפי שבועות, והרחוקים יותר מוצגים בטווחים רחבים ועשויים לזוז בהתאם למשוב אמיתי ממשתמשים:\n\n| מועד משוער | מה מתוכנן לשחרור |\n|---|---|\n| **סוף נובמבר — תחילת דצמבר 2026** *(1–2 שבועות)* | תיקונים לפי משוב ראשוני מתוך הממשק, קליטה מלאה בשרת של צרופות תמונה/וידאו במשוב, סגירה מיידית של גשר הרקע עם סגירת החלון |\n| **המחצית השנייה של דצמבר 2026** | מעקב מובנה **«משימות ופרויקטים»** (מיקוד יומי, לוח, יומן שנה, כרטיסיות) ותמיכה בלשונית **«יומן»** דרך כל מנוע נבחר |\n| **ינואר 2027** | החזרת **מצב קולי מקומי** (הכתבה לא מקוונת ללא ענן + הקראת תשובות) ומתקין מפושט ללא התקנה ידנית של `Node.js` ו-`Git` |\n| **פברואר — מרץ 2027** | מדור **«למידה»** (ספריית שיעורים בתוך החלון וקורס מבוא חינמי על AllY והכנת שחרורים), בונה ווידג'טים מותאמים ומודולי ביקורת ותוכן |\n| **אפריל — מאי 2027** | **גרף ידע** אינטראקטיבי של סביבת העבודה, לוח **«בריאות הפרויקט»** (כיסוי קשרים וצמתים מיושנים) ועבודה מלאה של Qoder כעוזר לקריאת קוד |\n| **יוני — יולי 2027** | גרסת בטא של **אפליקציית Android** עם חיבור למחשב הביתי בערוץ מאובטח ללא מסד נתונים שני + התאמת גרסת שולחן העבודה עבור macOS ו-Linux |\n| **אוגוסט 2027 והלאה** | גרסה יציבה `v1.0`, קטלוג מיומנויות משותפות של הקהילה וסנכרון סביבת העבודה בין מספר מכשירים של המשתמש |\n"}, "ar": {"label": "العربية", "dir": "rtl", "rawFile": "readme/README.ar.md", "markdown": "# AllY · جيني (v0.1)\n\nواجهة سطح مكتب محلية لنظام Windows تجمع عدة نماذج ذكاء اصطناعي في نافذة واحدة مع سجل محادثات مشترك، وذاكرة محلية على القرص، وقائمة انتظار للمهام، ومراقبة للحدود.\n\n*يوم ميلاد AllY · جيني — 23 نوفمبر 2026. الترخيص: MIT.*\n\n---\n\n## ما هذا التطبيق وما المشكلة التي يحلها\n\nعند العمل المنتظم مع الذكاء الاصطناعي، تتشتت المهام بسرعة بين تبويبات المتصفح، ونوافذ الطرفية، والمفاتيح المنفصلة. وعندما ينفد حد الخمس ساعات لأحد النماذج، تضطر إلى فتح نموذج آخر وشرح سياق المشروع من جديد.\n\nيعالج **AllY · جيني** أربع مهام عملية:\n\n- **سياق موحد بين النماذج.** يُحفظ سجل المحادثة وقاعدة القواعد الخاصة بك محلياً في ملفات Markdown (`pamyat/`). يمكنك تبديل محرك الذكاء الاصطناعي أو النموذج أو عمق الاستدلال مباشرة من حقل الإدخال، ليستأنف النموذج التالي المهمة من نفس النقطة.\n- **شفافية عمل وكلاء CLI.** في الطرفية العادية، يصعب ملاحظة الخطوة الحالية للوكيل في الوقت المناسب والتدخل أثناء التنفيذ. يعرض AllY على اليسار كرة الحالة وشريط الإجراءات الجارية خلف فاصل عمودي سلس قابل لتغيير العرض، بينما تظهر على اليمين المحادثة وقائمة انتظار المهام مع دعم التوضيح الفوري أثناء التنفيذ (`live-steer`)، وتعديل قائمة الانتظار، وتسريع الرسائل المهمة.\n- **مراقبة الحدود ونافذة السياق.** تعرض أداة **«الموارد»** النموذج القيادي، ونسبة امتلاء السياق (مع عتبة `350k`)، وحصص الاشتراكات لخمس ساعات وأسبوعية، بينما يجمع تبويب **«المساعدون»** أرصدة الاتصالات الأخرى. تُقرأ المؤشرات محلياً دون أي استدعاءات خلفية مدفوعة.\n- **التحكم في البيانات والاتصالات المباشرة.** تبقى المحادثات وملاحظات `pamyat/` ومهارات `.claude/skills/` والإعدادات المحلية `.ally-data/` على جهازك. وتستخدم اشتراكاتك ومفاتيحك الخاصة مباشرة لدى المزودين الذين تختارهم.\n\n---\n\n## لمن صُمم هذا التطبيق\n\n- **المطورون ومطورو vibe coding** الذين يديرون مشاريعهم عبر Claude Code أو Codex أو Antigravity أو DeepSeek ويرغبون في رؤية خطوات الوكلاء وقائمة الانتظار واستهلاك السياق في نافذة واحدة قابلة للإدارة.\n- **الكتّاب ورواد الأعمال والمتخصصون** الذين يحتاجون إلى ذاكرة محلية موحدة لمشاريعهم على حاسوبهم الشخصي.\n- **مستخدمو Windows 10/11** الذين يبحثون عن أداة محلية مع إمكانية تخصيص تخطيط الواجهة لاحتياجاتهم، والمشاركة في توجيه الإصدارات القادمة عبر آلية الملاحظات المدمجة.\n\n---\n\n## ما يعمل فعلياً في الإصدار 0.1\n\n### 1. الاتصالات ووضع «التلقائي»\nللبدء، يكفي ربط خيار واحد على الأقل. في وضع **«التلقائي»** يختار النظام المنفذ المتاح تلقائياً:\n\n| الاتصال | آلية العمل | ما يقدمه في v0.1 |\n|---|---|---|\n| **Claude Code** | CLI رسمي عبر اشتراك Anthropic Pro / Max | المهام المعقدة، البرمجة، النصوص، التخطيط، والضغط التلقائي للسياق |\n| **Codex** | CLI رسمي عبر اشتراك ChatGPT Plus / Pro | العمل على المستودعات والتوضيح الفوري أثناء الرد (`live-steer`) |\n| **Antigravity** | CLI رسمي من Google AI | التحليلات ذات السياق الكبير (عتبة نافذة `350k`) وتتبع الحصص |\n| **DeepSeek Harness** | ملف تعريف محلي دون واجهة `dsh` عبر رصيد DeepSeek | منفذ احتياطي واقتصادي، مع التحقق من الرصيد في تبويب «المساعدون» |\n| **مجمع API (OpenRouter)** | أي بوابة متوافقة مع Anthropic عبر Base URL ومفتاح | ربط نماذج خارجية عبر عملية Claude Code CLI المحلية (دون الحاجة لاشتراك Anthropic) |\n| **Qoder CLI** | CLI محلي (اكتشاف وتسجيل دخول) | يتعرف عليه معالج الاتصال (بما في ذلك تسجيل الدخول من داخل النافذة)؛ دور النموذج القيادي في المحادثة سيصدر في التحديث القادم |\n\n### 2. مساحة العمل والواجهة\n- **شاشة البداية:** على جانب تظهر **«المحادثة»** مع كرة حالة صافية بلا نص وشريط خطوات حي وفاصل سلس، وعلى الجانب الآخر **«الموارد» / «المساعدون»** (أعلى) و**«الحاسوب»** (أسفل) مع قابلية تغيير الارتفاع بحرية.\n- **الشريط العلوي (من اليمين إلى اليسار):** الساعة عند الحافة، لوحة **الملاحظات الواسعة (أيقونة الحشرة)**، **الفرشاة** (تحريك الكتل وتغيير حجمها وإعادة الضبط)، **السمات** (**الجرافيت** افتراضياً، مع الفيروزي ومنتصف الليل والداكن والفاتح)، **أيقونة الكتاب** (الدليل وسجل الإصدارات داخل التطبيق) وأيقونة **البرق** (معالج من 3 خطوات مع **«وضع القراءة»** بعرض كامل).\n- **التخزين المحلي:** `pamyat/` (ذاكرة Markdown المحلية)، `.claude/skills/` (المهارات المحلية)، `.ally-data/` (المفاتيح وتخطيط النافذة، مستبعدة من Git).\n\n## التثبيت والتشغيل (Windows 10/11)\n\n**قبل التثبيت، تأكد من توفر الأدوات التالية في النظام وفي متغير `PATH`:**\n1. **Node.js 24+** (مع دعم الوحدة المدمجة `node:sqlite`)\n2. **Python 3**\n3. **Git**\n4. اتصال بالإنترنت أثناء البناء الأول (`npm ci` وتنزيل Electron)، وتوفر محرك ذكاء اصطناعي واحد على الأقل أو مفتاح متصل.\n\nاختر أياً من طرق التثبيت الثلاث المريحة:\n\n### الطريقة 1 — عبر الأرشيف وملف `.exe` المعتاد\n1. نزّل أرشيف ZIP للمستودع وفك ضغطه في مسار قصير خالٍ من الأحرف غير اللاتينية، مثل `C:\\AllY`.\n2. انقر نقراً مزدوجاً على **`AllY.exe`** — عند التشغيل الأول سيتحقق من وجود `node` 24+ و`python` و`git`، ويثبت الاعتماديات، وينزّل Electron، ويبني الملف التنفيذي **`programma\\Dzhinni.exe`**، وينشئ اختصار **`AllY`** على سطح المكتب ثم يفتح النافذة تلقائياً.\n  *إذا عرض Windows SmartScreen تحذيراً لملف `.exe` جديد غير موقّع، اختر **معلومات إضافية ← التشغيل على أي حال** (الشيفرة المصدرية للمشغّلات مفتوحة في `docs/launchers/`، أو شغّل `.\\ustanovka.ps1` مباشرة).*\n3. في المرات التالية، شغّل التطبيق بالنقر المزدوج على **`AllY.exe`**، أو اختصار **`AllY`** على سطح المكتب، أو مباشرة عبر **`programma\\Dzhinni.exe`**. ولفتح الدليل وسجل الإصدارات في نافذة تطبيق مستقلة، شغّل **`AllY-Guide.exe`**.\n4. عند التشغيل الأول، ستظهر شاشة معالج البداية من 3 خطوات — اربط النموذج المطلوب وأرسل رسالتك الأولى.\n\n### الطريقة 2 — بأوامر الطرفية (PowerShell / cmd)\nافتح PowerShell ونفّذ الأوامر التالية بالترتيب:\n\n```powershell\ngit clone https://github.com/AyarZero/ally-dzhinni.git C:\\AllY\ncd C:\\AllY\n.\\AllY.exe\n```\n\nيمكنك التحقق من جاهزية البناء لاحقاً عبر الأمر:\n\n```powershell\n.\\AllY.exe -Proverka\n```\n\nالتشغيل من الطرفية:\n\n```powershell\n.\\AllY.exe\n```\n\n### الطريقة 3 — موجه جاهز لنموذج الذكاء الاصطناعي المحلي لديك\nإذا كان لديك Claude Code أو Codex أو Antigravity أو أي مساعد ذكاء اصطناعي يعمل بالفعل على جهازك، فانسخ هذا النص كاملاً وأرسله إليه:\n\n```text\nقم بتثبيت وتجهيز تطبيق سطح المكتب المحلي AllY · جيني (v0.1) للتشغيل على جهاز Windows هذا من المستودع https://github.com/AyarZero/ally-dzhinni:\n1. تحقق في الطرفية من توفر `git` و`python` (Python 3) و`node` (يلزم الإصدار Node.js 24+ مع نجاح الاختبار `node -e \"require('node:sqlite')\"`). إذا كان هناك أي نقص أو كان إصدار Node أقدم من 24، فأبلغني وساعدني في التثبيت قبل البناء.\n2. استنسخ المستودع في مسار قصير خالٍ من المسافات والأحرف غير اللاتينية، مثل `C:\\AllY`، وانتقل إلى هذا المجلد.\n3. شغّل التثبيت: `powershell -NoProfile -ExecutionPolicy Bypass -File .\\ustanovka.ps1` وانتظر اكتمال بناء `programma\\Dzhinni.exe`.\n4. تحقق من البناء عبر الأمر `powershell -NoProfile -ExecutionPolicy Bypass -File .\\ustanovka.ps1 -Proverka`.\n5. افحص محركات CLI (Claude Code، Codex، Antigravity، DeepSeek Harness، Qoder) أو مفاتيح OpenRouter المتوفرة بالفعل في النظام، وأخبرني باختصار بما هو جاهز.\n6. شغّل `programma\\Dzhinni.exe` (أو `.\\AllY.exe`) وأبلغني بأنه يمكنني فتح نافذة AllY وبدء العمل.\n```\n\n*ملاحظة: تتعامل أدوات CLI المتصلة مع ملفات مجلد العمل المفتوح مباشرة دون طلب إذن لكل قراءة أو تعديل — احرص على إبقاء مشاريعك المهمة تحت إدارة Git.*\n\n---\n\n## الملاحظات والمساهمة في تطوير المشروع\n\nفي الجهة اليمنى من الشريط العلوي (على يسار الساعة) يوجد زر **أيقونة الحشرة — «الملاحظات»**. من خلاله يمكنك مباشرة من داخل الواجهة:\n\n- الإبلاغ عن خطأ برمجي، أو خلل في الواجهة، أو مشكلة في التشغيل؛\n- إرفاق حتى **3 ملفات** توضيحية مع الرسالة: سجلات نصية `.txt` / `.md` (حتى `2 MB`)، أو لقطات شاشة `.png` / `.jpg` / `.jpeg` / `.webp` / `.gif` (حتى `10 MB`)، أو مقاطع فيديو قصيرة `.mp4` / `.webm` / `.mov` (حتى `25 MB`، وبإجمالي لا يتجاوز `30 MB`)؛\n- اقتراح وحدة جديدة، أو مهارة، أو سيناريو استخدام.\n\nيتم إرسال **نص النموذج والملفات التي تختارها فقط** — بينما تبقى المحادثات والملاحظات الشخصية والمفاتيح محلياً. وتصل ردود المطورين مباشرة إلى محادثة التطبيق. المشروع مفتوح المصدر تحت رخصة MIT: يمكنك إنشاء مهاراتك الخاصة في `.claude/skills/` والمشاركة في تطوير النواة.\n\n---\n\n## المشاكل والقيود المعروفة في v0.1 التي نعمل عليها حالياً\n\nنوثق بشفافية الجوانب التي لا تزال مقيدة أو قيد الاستكمال في الوقت الحالي:\n\n1. **تُثبّت اعتماديات البيئة مسبقاً:** يتطلب تثبيت `v0.1` وجود `Node.js 24+` و`Python 3` و`Git` مثبتة مسبقاً — ولا يزال المثبت المستقل الموحد بصيغة `.exe` دون إعداد يدوي للبرامج قيد التطوير.\n2. **إخفاء الإدخال الصوتي والقراءة الصوتية في نسخة العميل v0.1:** أُزيلت أزرار المיקروفون والصوت مؤقتاً أثناء مرحلة تحسين التعرف المحلي على الكلام (`GigaAM`) ومثبّته.\n3. **المفكرة («حديث صريح») مخفية في نسخة العميل v0.1:** يجري إكمال دعم جميع المحركات، وسيُفتح التبويب في التحديث القادم.\n4. **الإغلاق المتدرج للجسر الخلفي بعد إغلاق النافذة:** عند إغلاق النافذة، قد ينتهي عمل خادم الجسر المحلي بعد مهلة الخمول (تصل إلى ~9 دقائق) إذا أعدت فتح نسخة أخرى فوراً.\n5. **Qoder قيد التكامل:** يتعرف معالج الاتصالات على Qoder CLI المحلي وحالة تسجيل الدخول، لكن استخدام Qoder كنموذج قيادي في المحادثة لا يزال مغلقاً حتى الإصدار القادم.\n6. **موجة تحديث الخادم لاستقبال المرفقات الكبيرة في الملاحظات:** إذا أعاد خادم الملاحظات خطأً حول الحجم أو رفض الملف عند إرسال لقطة شاشة أو فيديو قبل اكتمال تحديث الخادم الخلفي، يمكنك إرسال النموذج نصياً فوراً دون فقدان المسودة.\n7. **المنصة:** تم الاختبار والبناء لنظام **Windows 10/11** فقط.\n\n---\n\n## خارطة الطريق والمواعيد التقديرية\n\nالمواعيد تقديرية — الإصدارات القريبة مجدولة بالأسابيع، بينما حُددت المراحل الأبعد بفترات زمنية أوسع وتتحرك وفقاً لملاحظات المستخدمين الفعلية:\n\n| الموعد التقديري | ما يُخطط لإصداره |\n|---|---|\n| **أواخر نوفمبر — أوائل ديسمبر 2026** *(1–2 أسبوع)* | إصلاحات بناءً على الملاحظات الأولى من الواجهة، دعم كامل على الخادم لاستقبال مرفقات الصور والفيديو في الملاحظات، وإنهاء فوري للجسر الخلفي عند إغلاق النافذة |\n| **النصف الثاني من ديسمبر 2026** | متتبع مدمج **«المهام والمشاريع»** (التركيز اليومي، اللوحة، التقويم، البطاقات) وتشغيل تبويب **«المفكرة»** عبر أي محرك مختار |\n| **يناير 2027** | عودة **الوضع الصوتي المحلي** (إملاء دون اتصال بالإنترنت وبلا سحابة + قراءة صوتية للردود) ومثبّت مبسّط دون تثبيت يدوي لـ `Node.js` و`Git` |\n| **فبراير — مارس 2027** | قسم **«التعلّم»** (مكتبة دروس داخل النافذة ودورة تمهيدية مجانية حول AllY وتجهيز الإصدارات)، ومنشئ أدوات مخصصة للمستخدم، ووحدات المراجعة والمحتوى |\n| **أبريل — مايو 2027** | **رسم بياني معرفي** تفاعلي لمساحة العمل، ولوحة **«صحة المشروع»** (تغطية الروابط والعقد القديمة)، وعمل Qoder بشكل كامل كمساعد لقراءة الشيفرة |\n| **يونيو — يوليو 2027** | إصدار تجريبي لـ **تطبيق Android** يتصل بالحاسوب المنزلي عبر قناة آمنة دون قاعدة بيانات ثانية + تكييف نسخة سطح المكتب لأنظمة macOS وLinux |\n| **أغسطس 2027 وما بعده** | الإصدار المستقر `v1.0`، ودليل المهارات المشتركة للمجتمع، ومزامنة مساحة العمل بين عدة أجهزة للمستخدم |\n"}, "es": {"label": "Español", "dir": "ltr", "rawFile": "readme/README.es.md", "markdown": "# AllY · Genie (v0.1)\n\nShell de escritorio local para Windows que reúne varios modelos de IA en una sola ventana con historial de conversación compartido, memoria local en disco, cola de tareas y control de límites.\n\n*Fecha de nacimiento de AllY · Genie: 23 de noviembre de 2026. Licencia: MIT.*\n\n---\n\n## Qué es esta aplicación y qué problema resuelve\n\nAl trabajar con IA a diario, las tareas terminan repartidas entre distintas pestañas del navegador, consolas y claves separadas. Cuando un modelo agota su límite de cinco horas, toca abrir otro y volver a explicar todo el contexto del proyecto.\n\n**AllY · Genie** resuelve cuatro problemas prácticos:\n\n- **Contexto compartido entre modelos.** El historial de conversación y tu base de reglas se guardan localmente en archivos Markdown (`pamyat/`). Puedes cambiar de motor, modelo o profundidad de razonamiento directamente en el campo de entrada para que el siguiente modelo continúe desde el mismo punto.\n- **Visibilidad de agentes CLI.** En una terminal normal es difícil ver a tiempo el paso actual del agente e intervenir sobre la marcha. AllY muestra a la izquierda una esfera de estado y el flujo de actividad en vivo tras una línea divisoria vertical suave de ancho ajustable, y a la derecha el chat y la cola de tareas con aclaraciones al vuelo (`live-steer`), edición de cola y prioridad de mensajes importantes.\n- **Control de límites y ventana de contexto.** El widget **«Recursos»** muestra el motor principal, el uso del contexto (con umbral de `350k`) y las cuotas de 5 horas y semanales de las suscripciones; la pestaña **«Asistentes»** reúne los saldos del resto de conexiones. Las métricas se leen localmente sin llamadas de pago en segundo plano.\n- **Control de datos y conexiones directas.** Las conversaciones, notas en `pamyat/`, habilidades `.claude/skills/` y ajustes locales `.ally-data/` permanecen en tu PC. Usas tus propias suscripciones y claves directamente con tus proveedores.\n\n---\n\n## Para quién está pensada la aplicación\n\n- **Desarrolladores y vibe coders** que trabajan en proyectos con Claude Code, Codex, Antigravity o DeepSeek y quieren ver los pasos de los agentes, la cola y el uso de contexto en una única ventana.\n- **Autores, emprendedores y especialistas** que necesitan una memoria local unificada para sus proyectos en su propio equipo.\n- **Usuarios de Windows 10/11** que buscan una herramienta local con diseño adaptable a su flujo de trabajo y posibilidad de influir en futuras versiones desde los comentarios integrados.\n\n---\n\n## Qué funciona realmente en la versión 0.1\n\n### 1. Conexiones y modo «Auto»\nPara empezar basta con conectar una opción. En el modo **«Auto»**, el sistema elige automáticamente un motor disponible:\n\n| Conexión | Cómo funciona | Qué incluye en v0.1 |\n|---|---|---|\n| **Claude Code** | CLI oficial con suscripción Anthropic Pro / Max | Tareas complejas, código, textos, planificación y compactación automática de contexto |\n| **Codex** | CLI oficial con suscripción ChatGPT Plus / Pro | Trabajo en repositorios y aclaraciones mientras la respuesta está en curso (`live-steer`) |\n| **Antigravity** | CLI oficial de Google AI | Análisis con contexto amplio (umbral de `350k`) y seguimiento de cuotas |\n| **DeepSeek Harness** | Perfil headless local `dsh` con saldo DeepSeek | Motor de respaldo económico y consulta de saldo en la pestaña «Asistentes» |\n| **Agregador API (OpenRouter)** | Cualquier pasarela compatible con Anthropic mediante Base URL y clave | Conexión de modelos externos mediante el proceso local Claude Code CLI (sin suscripción Anthropic) |\n| **Qoder CLI** | CLI local (detección e inicio de sesión) | Lo detecta el asistente de conexión (incluido acceso desde la ventana); el rol de motor principal en chat llegará en la próxima actualización |\n\n### 2. Espacio de trabajo e interfaz\n- **Pantalla inicial:** a la izquierda abre **«Conversación»** con una esfera limpia sin texto, cinta de pasos y divisor vertical fluido; a la derecha quedan **«Recursos» / «Asistentes»** (arriba) y **«Portátil»** (abajo), con altura totalmente ajustable.\n- **Barra superior (de derecha a izquierda):** reloj a la derecha, panel amplio de **comentarios (icono de bicho)**, **pincel** (arrastrar y redimensionar bloques, restablecer diseño), **temas** (**Grafito** por defecto, más Turquesa, Medianoche, Oscuro y Claro), **icono de libro** (guía e historial integrados) y **rayo** (asistente en 3 pasos con **«Modo lectura»** a ancho completo).\n- **Almacenamiento local:** `pamyat/` (memoria Markdown local), `.claude/skills/` (habilidades locales), `.ally-data/` (claves y diseño de ventana, excluida de Git).\n\n## Instalación y ejecución (Windows 10/11)\n\n**Antes de instalar, asegúrate de tener instalados y disponibles en `PATH`:**\n1. **Node.js 24+** (con soporte para el módulo integrado `node:sqlite`)\n2. **Python 3**\n3. **Git**\n4. Acceso a internet durante la primera compilación (`npm ci` y descarga de Electron) y al menos un motor de IA o clave configurada.\n\nElige cualquiera de estos tres métodos:\n\n### Método 1 — archivo ZIP y ejecutable `.exe`\n1. Descarga el archivo ZIP del repositorio y descomprímelo en una ruta corta sin caracteres cirílicos ni espacios, por ejemplo `C:\\AllY`.\n2. Haz doble clic en **`AllY.exe`**: en el primer inicio comprobará `node` 24+, `python` y `git`, instalará dependencias, descargará Electron, compilará **`programma\\Dzhinni.exe`**, creará el acceso directo **`AllY`** en el escritorio y abrirá la ventana.\n  *Si Windows SmartScreen muestra un aviso por ser un `.exe` sin firma, pulsa **Más información → Ejecutar de todas formas** (el código fuente está abierto en `docs/launchers/`, o ejecuta `.\\ustanovka.ps1` directamente).*\n3. En adelante, inicia la aplicación con doble clic en **`AllY.exe`**, el acceso directo **`AllY`** del escritorio o directamente ejecutando **`programma\\Dzhinni.exe`**. Para abrir la guía y el historial de versiones en una ventana propia, abre **`AllY-Guide.exe`**.\n4. En el primer arranque se abrirá el asistente de 3 pasos: conecta tu motor de IA y envía tu primer mensaje.\n\n### Método 2 — comandos en la terminal (PowerShell / cmd)\nAbre PowerShell y ejecuta en orden:\n\n```powershell\ngit clone https://github.com/AyarZero/ally-dzhinni.git C:\\AllY\ncd C:\\AllY\n.\\AllY.exe\n```\n\nPara comprobar después si la compilación está lista:\n\n```powershell\n.\\AllY.exe -Proverka\n```\n\nArrancar desde la terminal:\n\n```powershell\n.\\AllY.exe\n```\n\n### Método 3 — prompt listo para tu IA local\nSi ya tienes Claude Code, Codex, Antigravity u otro asistente en tu PC, copia todo este bloque y envíaselo:\n\n```text\nInstala y prepara la aplicación de escritorio local AllY · Genie (v0.1) en este PC Windows desde el repositorio https://github.com/AyarZero/ally-dzhinni:\n1. Comprueba en la terminal que están disponibles `git`, `python` (Python 3) y `node` (se requiere Node.js 24+ con la prueba `node -e \"require('node:sqlite')\"` correcta). Si falta algo o la versión de Node es inferior a 24, avísame y ayúdame a instalarlo antes de compilar.\n2. Clona el repositorio en una ruta corta sin espacios ni caracteres cirílicos, por ejemplo `C:\\AllY`, y entra en esa carpeta.\n3. Ejecuta la instalación: `powershell -NoProfile -ExecutionPolicy Bypass -File .\\ustanovka.ps1` y espera a que compile `programma\\Dzhinni.exe`.\n4. Verifica la compilación con `powershell -NoProfile -ExecutionPolicy Bypass -File .\\ustanovka.ps1 -Proverka`.\n5. Comprueba qué motores CLI (Claude Code, Codex, Antigravity, DeepSeek Harness, Qoder) o claves de OpenRouter ya están disponibles en el sistema e indícame brevemente qué quedó listo.\n6. Inicia `programma\\Dzhinni.exe` (o `.\\AllY.exe`) y avísame cuando pueda abrir la ventana de AllY y empezar a trabajar.\n```\n\n*Nota: los agentes CLI conectados trabajan directamente con los archivos de la carpeta abierta sin pedir permiso en cada lectura o cambio; mantén tus proyectos importantes bajo control de versiones con Git.*\n\n---\n\n## Comentarios y participación en el desarrollo\n\nA la derecha de la barra superior (a la izquierda del reloj) está el botón con el **icono de bicho — «Comentarios»**. Desde ahí puedes:\n\n- informar de un fallo, problema visual o error de arranque;\n- adjuntar hasta **3 archivos** de respaldo: registros de texto `.txt` / `.md` (hasta `2 MB`), capturas `.png` / `.jpg` / `.jpeg` / `.webp` / `.gif` (hasta `10 MB`) o vídeos cortos `.mp4` / `.webm` / `.mov` (hasta `25 MB`, total máximo `30 MB`);\n- proponer un nuevo módulo, habilidad o caso de uso.\n\nSe envían **únicamente el texto del formulario y los archivos seleccionados**: tu historial, notas personales y claves siguen en tu equipo. Las respuestas de los desarrolladores llegan directamente al chat de la app. El código está publicado bajo licencia MIT: puedes crear tus propias habilidades en `.claude/skills/` y contribuir al núcleo.\n\n---\n\n## Problemas conocidos y limitaciones de v0.1 en los que estamos trabajando\n\nDocumentamos con total transparencia lo que aún está limitado o en ajuste:\n\n1. **Dependencias previas del sistema:** instalar `v0.1` requiere tener ya instalados `Node.js 24+`, `Python 3` y `Git`; el instalador `.exe` único sin preparación previa sigue en desarrollo.\n2. **Entrada y salida de voz ocultas en v0.1 cliente:** los botones de micrófono y voz se ocultaron temporalmente mientras terminamos el reconocimiento local (`GigaAM`) y su instalador.\n3. **El Diario («Conversación honesta») está oculto en la compilación v0.1:** el soporte multi-motor sigue en desarrollo y la pestaña se abrirá en una próxima actualización.\n4. **Cierre diferido del puente en segundo plano:** al cerrar la ventana, el proceso puente local puede esperar hasta su tiempo de inactividad (hasta ~9 minutos) antes de cerrarse si vuelves a abrir otra instancia enseguida.\n5. **Integración de Qoder en curso:** el asistente detecta Qoder CLI y el estado de sesión, pero su uso como motor principal del chat queda habilitado para la próxima versión.\n6. **Despliegue en servidor para adjuntos grandes en comentarios:** si al enviar una captura o vídeo el servidor de recepción rechaza el archivo antes de completar su actualización, puedes enviar el informe en texto al momento sin perder el borrador.\n7. **Plataforma:** probado y empaquetado solo para **Windows 10/11**.\n\n---\n\n## Hoja de ruta y fechas orientativas\n\nLas fechas son aproximadas: las entregas cercanas se planifican por semanas y las más lejanas por franjas amplias según los comentarios reales de la comunidad:\n\n| Plazo aproximado | Qué está previsto lanzar |\n|---|---|\n| **Finales de noviembre — principios de diciembre de 2026** *(1–2 semanas)* | Correcciones tras los primeros comentarios en la app, recepción completa de fotos y vídeos en comentarios en servidor, cierre inmediato del puente al cerrar la ventana |\n| **Segunda mitad de diciembre de 2026** | Gestor integrado **«Tareas y Proyectos»** (enfoque diario, tablero, calendario, fichas) y compatibilidad del **Diario** con cualquier motor elegido |\n| **Enero de 2027** | Regreso del **modo de voz local** (dictado sin nube + lectura en voz alta) e instalador simplificado sin instalación manual previa de `Node.js` y `Git` |\n| **Febrero — marzo de 2027** | Sección **«Formación»** (biblioteca de lecciones dentro de la ventana y curso introductorio gratuito sobre AllY y preparación de lanzamientos), creador de widgets personalizados y módulos de revisión/contenido |\n| **Abril — mayo de 2027** | **Grafo de conocimiento** interactivo del espacio de trabajo, panel **«Salud del proyecto»** (cobertura de enlaces y notas obsoletas) y Qoder activo como asistente de lectura de código |\n| **Junio — julio de 2027** | Beta del **cliente Android** conectado por canal seguro a tu PC doméstico sin segunda base de datos + adaptación de escritorio para macOS y Linux |\n| **Agosto de 2027 en adelante** | Lanzamiento estable `v1.0`, catálogo compartido de habilidades de la comunidad y sincronización del espacio de trabajo entre varios equipos del usuario |\n"}, "pt-BR": {"label": "Português (BR)", "dir": "ltr", "rawFile": "readme/README.pt-BR.md", "markdown": "# AllY · Genie (v0.1)\n\nShell desktop local para Windows que reúne várias IAs em uma única janela com histórico de conversa compartilhado, memória local em disco, fila de tarefas e controle de limites.\n\n*Aniversário do AllY · Genie: 23 de novembro de 2026. Licença: MIT.*\n\n---\n\n## O que é este aplicativo e qual problema ele resolve\n\nNo uso diário de IA, as tarefas acabam espalhadas por várias abas do navegador, terminais e chaves separadas. Quando um modelo atinge o limite de cinco horas, é preciso abrir outro e explicar todo o contexto do projeto do zero.\n\n**AllY · Genie** resolve quatro problemas práticos:\n\n- **Contexto unificado entre modelos.** O histórico da conversa e sua base de regras ficam salvos localmente em arquivos Markdown (`pamyat/`). Você pode trocar de motor, modelo ou nível de raciocínio direto no campo de entrada para o próximo modelo continuar do mesmo ponto.\n- **Visibilidade de agentes CLI.** Em um terminal comum é difícil acompanhar cada passo do agente a tempo e intervir durante a execução. No AllY, à esquerda aparecem a esfera de estado e o fluxo de atividade ao vivo separados por uma linha vertical suave e redimensionável; à direita ficam a conversa e a fila de tarefas com ajuste em tempo real (`live-steer`), edição da fila e priorização de mensagens importantes.\n- **Controle de limites e janela de contexto.** O widget **«Recursos»** mostra o motor principal, a ocupação do contexto (com limite de `350k`) e as cotas de 5 horas e semanais das assinaturas; a aba **«Assistentes»** reúne os saldos das demais conexões. As métricas são lidas localmente sem chamadas pagas em segundo plano.\n- **Controle dos dados e conexões diretas.** Conversas, notas em `pamyat/`, habilidades `.claude/skills/` e configurações locais `.ally-data/` permanecem no seu computador. Você usa suas próprias assinaturas e chaves diretamente nos provedores escolhidos.\n\n---\n\n## Para quem este aplicativo foi feito\n\n- **Desenvolvedores e vibe coders** que conduzem projetos via Claude Code, Codex, Antigravity ou DeepSeek e querem ver passos dos agentes, fila e consumo de contexto em uma só janela.\n- **Autores, empreendedores e especialistas** que precisam de memória local unificada para seus projetos no próprio PC.\n- **Usuários de Windows 10/11** que querem uma ferramenta local com layout ajustável às suas tarefas e voz direta nas próximas atualizações pelo feedback integrado.\n\n---\n\n## O que realmente funciona na versão 0.1\n\n### 1. Conexões e modo «Auto»\nPara começar basta conectar pelo menos uma opção. No modo **«Auto»**, o sistema escolhe automaticamente o executor disponível:\n\n| Conexão | Como funciona | O que faz na v0.1 |\n|---|---|---|\n| **Claude Code** | CLI oficial com assinatura Anthropic Pro / Max | Tarefas complexas, código, textos, planejamento e compactação automática de contexto |\n| **Codex** | CLI oficial com assinatura ChatGPT Plus / Pro | Trabalho em repositórios e ajustes durante a resposta (`live-steer`) |\n| **Antigravity** | CLI oficial do Google AI | Análises com contexto grande (limite `350k`) e acompanhamento de cotas |\n| **DeepSeek Harness** | Perfil headless local `dsh` via saldo DeepSeek | Executor reserva econômico e consulta de saldo na aba «Assistentes» |\n| **Agregador API (OpenRouter)** | Qualquer gateway compatível com Anthropic via Base URL e chave | Acesso a modelos externos pelo processo local Claude Code CLI (sem assinatura Anthropic) |\n| **Qoder CLI** | CLI local (detecção e login) | Detectado pelo assistente de conexão (com login pela janela); uso como motor principal no chat sai na próxima atualização |\n\n### 2. Espaço de trabalho e interface\n- **Tela inicial:** à esquerda fica **«Conversa»** com esfera limpa sem texto, fluxo de passos e divisória fluida; à direita ficam **«Recursos» / «Assistentes»** (topo) e **«Notebook»** (abaixo), com altura livremente ajustável.\n- **Barra superior (da direita para a esquerda):** relógio à direita, painel largo de **feedback (inseto)**, **pincel** (mover e redimensionar blocos, restaurar layout), **temas** (**Grafite** por padrão, além de Turquesa, Meia-noite, Escuro e Claro), **ícone de livro** (guia e versões dentro do app) e **raio** (assistente em 3 passos com **«Modo leitura»** amplo).\n- **Armazenamento local:** `pamyat/` (memória Markdown local), `.claude/skills/` (habilidades locais), `.ally-data/` (chaves e layout da janela, excluída do Git).\n\n## Instalação e execução (Windows 10/11)\n\n**Antes de instalar, confirme que estes itens já estão instalados e no `PATH`:**\n1. **Node.js 24+** (com suporte ao módulo integrado `node:sqlite`)\n2. **Python 3**\n3. **Git**\n4. Acesso à internet na primeira compilação (`npm ci` e download do Electron) e pelo menos um motor de IA ou chave configurada.\n\nEscolha qualquer um dos três métodos abaixo:\n\n### Método 1 — arquivo ZIP e executável `.exe`\n1. Baixe o ZIP do repositório e extraia em um caminho curto sem acentos ou caracteres cirílicos, como `C:\\AllY`.\n2. Dê duplo clique em **`AllY.exe`** — na primeira execução ele verifica `node` 24+, `python` e `git`, instala dependências, baixa o Electron, gera **`programma\\Dzhinni.exe`**, cria o atalho **`AllY`** na área de trabalho e abre a janela.\n  *Se o Windows SmartScreen avisar sobre um `.exe` novo sem assinatura, clique em **Mais informações → Executar assim mesmo** (o código-fonte está aberto em `docs/launchers/`, ou execute `.\\ustanovka.ps1` diretamente).*\n3. Depois, abra o aplicativo dando duplo clique em **`AllY.exe`**, no atalho **`AllY`** da área de trabalho ou diretamente em **`programma\\Dzhinni.exe`**. Para abrir o guia e o histórico de versões em uma janela própria de aplicativo, execute **`AllY-Guide.exe`**.\n4. Na primeira abertura aparece o assistente em 3 etapas — conecte sua IA e envie a primeira mensagem.\n\n### Método 2 — comandos no terminal (PowerShell / cmd)\nAbra o PowerShell e execute em sequência:\n\n```powershell\ngit clone https://github.com/AyarZero/ally-dzhinni.git C:\\AllY\ncd C:\\AllY\n.\\AllY.exe\n```\n\nPara checar depois se a compilação está pronta:\n\n```powershell\n.\\AllY.exe -Proverka\n```\n\nIniciar pelo terminal:\n\n```powershell\n.\\AllY.exe\n```\n\n### Método 3 — prompt pronto para sua IA local\nSe você já usa Claude Code, Codex, Antigravity ou outro assistente no PC, copie todo este texto e envie para ele:\n\n```text\nInstale e prepare para execução o aplicativo desktop local AllY · Genie (v0.1) neste PC Windows a partir do repositório https://github.com/AyarZero/ally-dzhinni:\n1. Verifique no terminal se `git`, `python` (Python 3) e `node` estão disponíveis (é necessário Node.js 24+ com o teste `node -e \"require('node:sqlite')\"` funcionando). Se faltar algo ou o Node for anterior ao 24, me avise e ajude a instalar antes de compilar.\n2. Clone o repositório em um caminho curto sem espaços ou caracteres cirílicos, por exemplo `C:\\AllY`, e entre nessa pasta.\n3. Execute a instalação: `powershell -NoProfile -ExecutionPolicy Bypass -File .\\ustanovka.ps1` e aguarde gerar `programma\\Dzhinni.exe`.\n4. Verifique a compilação com `powershell -NoProfile -ExecutionPolicy Bypass -File .\\ustanovka.ps1 -Proverka`.\n5. Veja quais motores CLI (Claude Code, Codex, Antigravity, DeepSeek Harness, Qoder) ou chaves OpenRouter já existem no sistema e resuma o que está pronto.\n6. Inicie `programma\\Dzhinni.exe` (ou `.\\AllY.exe`) e me avise que já posso abrir a janela do AllY e começar.\n```\n\n*Observação: executores CLI conectados operam diretamente nos arquivos da pasta aberta sem pedir confirmação a cada leitura ou edição — mantenha projetos importantes sob controle do Git.*\n\n---\n\n## Feedback e participação no projeto\n\nÀ direita do cabeçalho (à esquerda do relógio) fica o botão com o **ícone de inseto — «Feedback»**. Por ele você pode direto da interface:\n\n- relatar erro, problema visual ou falha de inicialização;\n- anexar até **3 arquivos** de evidência: logs `.txt` / `.md` (até `2 MB`), imagens `.png` / `.jpg` / `.jpeg` / `.webp` / `.gif` (até `10 MB`) ou vídeos curtos `.mp4` / `.webm` / `.mov` (até `25 MB`, total até `30 MB`);\n- sugerir um novo módulo, habilidade ou caso de uso.\n\nSão enviados **apenas o texto do formulário e os arquivos escolhidos** — conversas, notas pessoais e chaves continuam locais. As respostas dos desenvolvedores voltam direto para o chat do aplicativo. O projeto é aberto sob licença MIT: você pode criar suas próprias habilidades em `.claude/skills/` e contribuir com o núcleo.\n\n---\n\n## Problemas conhecidos e limitações da v0.1 em andamento\n\nRegistramos com transparência o que ainda tem limitações ou está em ajuste:\n\n1. **Dependências instaladas previamente:** a instalação da `v0.1` exige `Node.js 24+`, `Python 3` e `Git` já presentes no sistema — um instalador `.exe` único sem preparação manual ainda está em desenvolvimento.\n2. **Entrada e saída de voz ocultas na versão cliente v0.1:** os botões de microfone e voz foram ocultados temporariamente enquanto ajustamos o reconhecimento local (`GigaAM`) e seu instalador.\n3. **O Diário («Conversa honesta») está oculto na versão v0.1:** o suporte a todos os motores está sendo finalizado e a aba será aberta em uma próxima atualização.\n4. **Encerramento gradual do bridge ao fechar a janela:** ao fechar a janela, o servidor bridge local pode aguardar o tempo de inatividade (até ~9 minutos) para encerrar caso outra instância seja reaberta logo em seguida.\n5. **Qoder em integração:** o assistente identifica o CLI local e o status de login, mas o uso como motor principal no chat ficará liberado na próxima versão.\n6. **Atualização gradual do servidor para anexos grandes:** se ao enviar imagem ou vídeo o servidor de feedback recusar o envio antes de concluir sua atualização, você pode enviar na hora apenas como texto sem perder o rascunho.\n7. **Plataforma:** testado e compilado apenas para **Windows 10/11**.\n\n---\n\n## Roadmap e prazos estimados\n\nOs prazos são estimativos — as entregas próximas seguem por semanas e as mais distantes em faixas mais amplas, ajustadas conforme o feedback real dos usuários:\n\n| Prazo estimado | O que está previsto |\n|---|---|\n| **Fim de novembro — início de dezembro de 2026** *(1–2 semanas)* | Correções com base nos primeiros relatos no app, suporte completo no servidor para envio de fotos e vídeos no feedback, encerramento imediato do bridge ao fechar a janela |\n| **Segunda metade de dezembro de 2026** | Rastreador integrado **«Tarefas e Projetos»** (foco do dia, quadro, calendário, cartões) e aba **«Diário»** funcionando com qualquer motor escolhido |\n| **Janeiro de 2027** | Retorno do **modo de voz local** (ditado offline sem nuvem + respostas faladas) e instalador simplificado sem preparo manual de `Node.js` e `Git` |\n| **Fevereiro — março de 2027** | Seção **«Aprendizagem»** (biblioteca de aulas dentro da janela e curso introdutório gratuito sobre AllY e preparo de releases), construtor de widgets personalizados e módulos de revisão/conteúdo |\n| **Abril — maio de 2027** | **Grafo de conhecimento** interativo do espaço de trabalho, painel **«Saúde do projeto»** (cobertura de vínculos e notas desatualizadas) e Qoder completo como assistente de leitura de código |\n| **Junho — julho de 2027** | Beta do **cliente Android** conectado por canal seguro ao PC de casa sem segunda base de dados + adaptação desktop para macOS e Linux |\n| **Agosto de 2027 em diante** | Lançamento estável `v1.0`, catálogo comunitário de habilidades e sincronização do espaço de trabalho entre múltiplos dispositivos |\n"}, "ko": {"label": "한국어", "dir": "ltr", "rawFile": "readme/README.ko.md", "markdown": "# AllY · 지니 (v0.1)\n\n공유 대화 기록, 로컬 디스크 메모리, 작업 대기열, 한도 관리를 하나의 창에 통합하여 여러 AI 모델을 함께 사용할 수 있는 Windows용 로컬 데스크톱 셸입니다.\n\n*AllY · 지니의 탄생일은 2026년 11월 23일입니다. 라이선스: MIT.*\n\n---\n\n## 어떤 앱이며 어떤 문제를 해결하나요\n\nAI를 꾸준히 사용하다 보면 작업이 여러 브라우저 탭, 콘솔 창, 개별 키로 금방 흩어집니다. 한 모델의 5시간 한도가 소진되면 다른 모델을 열고 프로젝트 컨텍스트를 처음부터 다시 설명해야 합니다.\n\n**AllY · 지니**는 네 가지 실무적인 과제를 해결합니다:\n\n- **모델 간 통합 컨텍스트.** 대화 기록과 규칙 베이스는 로컬 Markdown 파일(`pamyat/`)에 저장됩니다. 입력창에서 바로 AI 엔진, 모델 또는 추론 깊이를 전환하여 다음 모델이 같은 지점에서 작업을 이어갈 수 있습니다.\n- **투명한 CLI 에이전트 작업.** 일반 터미널에서는 에이전트의 현재 단계를 제때 파악하고 작업 도중 개입하기 어렵습니다. AllY에서는 너비를 조절할 수 있는 부드러운 세로 구분선 왼쪽에 상태 구체와 실시간 작업 피드가 표시되고, 오른쪽에는 실시간 보완(`live-steer`), 대기열 편집, 중요 메시지 우선 처리를 지원하는 대화창과 작업 대기열이 배치됩니다.\n- **한도 및 컨텍스트 창 제어.** **「리소스」** 위젯은 주도 AI 모델, 컨텍스트 사용량(임계값 `350k`), 구독의 5시간 및 주간 할당량을 표시하며, **「보조」** 탭은 나머지 연결들의 잔액을 모아 보여줍니다. 지표는 유료 백그라운드 호출 없이 로컬에서 읽어옵니다.\n- **데이터 통제 및 직접 연결.** 대화 내역, `pamyat/` 메모, `.claude/skills/` 스킬, `.ally-data/` 로컬 설정은 사용자의 PC에 그대로 유지됩니다. 선택한 프로바이더에 본인의 구독과 키를 직접 연결해 사용합니다.\n\n---\n\n## 누구를 위한 앱인가요\n\n- Claude Code, Codex, Antigravity 또는 DeepSeek으로 프로젝트를 진행하며 에이전트 단계, 대기열, 컨텍스트 소모량을 하나의 제어 가능한 창에서 확인하고 싶은 **개발자와 바이브 코더**.\n- 자신의 PC에 프로젝트별 통합 로컬 메모리가 필요한 **작가, 창업가, 전문가**.\n- 작업에 맞게 레이아웃을 커스터마이징하고 내장 피드백을 통해 다음 릴리스에 의견을 반영할 수 있는 로컬 도구가 필요한 **Windows 10/11 사용자**.\n\n---\n\n## 버전 0.1에서 실제로 동작하는 기능\n\n### 1. 연결 및 「자동」 모드\n시작하려면 최소 한 가지 옵션만 연결하면 됩니다. **「자동」** 모드에서는 시스템이 사용 가능한 실행기를 자동으로 선택합니다:\n\n| 연결 | 동작 방식 | v0.1 지원 기능 |\n|---|---|---|\n| **Claude Code** | Anthropic Pro / Max 구독 기반 공식 CLI | 복잡한 작업, 코드, 텍스트, 플래닝, 컨텍스트 자동 압축 |\n| **Codex** | ChatGPT Plus / Pro 구독 기반 공식 CLI | 저장소 단위 작업 및 응답 도중 실시간 보완(`live-steer`) |\n| **Antigravity** | Google AI 공식 CLI | 대용량 컨텍스트 분석(컨텍스트 창 임계값 `350k`) 및 할당량 추적 |\n| **DeepSeek Harness** | DeepSeek 잔액 기반 로컬 headless 프로필 `dsh` | 예비 및 경제적 실행기, 「보조」 탭에서 잔액 확인 |\n| **API 애그리게이터 (OpenRouter)** | Base URL과 키 기반의 모든 Anthropic 호환 게이트웨이 | 로컬 Claude Code CLI 프로세스를 통한 외부 모델 연결 (Anthropic 구독 불필요) |\n| **Qoder CLI** | 로컬 CLI (감지 및 로그인) | 연결 마법사에서 감지(창 내부 로그인 포함); 채팅 주도 역할은 다음 업데이트에 제공 예정 |\n\n### 2. 작업 공간 및 인터페이스\n- **시작 화면:** 왼쪽에는 텍스트 없는 깨끗한 상태 구체와 실시간 단계 흐름, 부드러운 세로 구분선이 있는 **「대화」**가 배치되고, 오른쪽 위에는 **「리소스」 / 「보조」**, 아래에는 **「노트북」** 모니터가 있으며 높이를 자유롭게 조절할 수 있습니다.\n- **상단 바(오른쪽에서 왼쪽 순):** 오른쪽 시계, 넓은 **피드백 패널(벌레 아이콘)**, **브러시**(위젯 이동·크기 조절·초기화), **테마**(기본값 **그래파이트**, 청록·미드나이트·다크·라이트 포함), 창 안의 **책 아이콘(가이드 및 버전 기록)**, **번개 아이콘**(전체 폭 **「읽기 모드」**가 포함된 3단계 연결 마법사).\n- **로컬 저장소:** `pamyat/`(로컬 Markdown 메모리), `.claude/skills/`(로컬 스킬), `.ally-data/`(키 및 창 레이아웃, Git에서 제외됨).\n\n## 설치 및 실행 (Windows 10/11)\n\n**설치 전에 시스템에 다음 항목이 이미 설치되어 있고 `PATH`에 등록되어 있는지 확인하세요:**\n1. **Node.js 24+** (내장 `node:sqlite` 모듈 지원 포함)\n2. **Python 3**\n3. **Git**\n4. 초기 빌드 중 인터넷 연결(`npm ci` 및 Electron 다운로드용)과 최소 한 개 이상의 연결된 AI 엔진 또는 키.\n\n편한 세 가지 설치 방법 중 하나를 선택하세요:\n\n### 방법 1 — 압축 파일과 익숙한 `.exe` 사용\n1. 저장소 ZIP 압축 파일을 다운로드해 `C:\\AllY`처럼 영문으로 된 짧은 경로에 압축을 풉니다.\n2. **`AllY.exe`**를 더블 클릭합니다. 처음 실행할 때 `node` 24+, `python`, `git` 여부를 확인하고 의존성을 설치하며 Electron을 다운로드한 뒤 실행 파일 **`programma\\Dzhinni.exe`**를 빌드하고 바탕 화면에 **`AllY`** 바로 가기를 만든 다음 창을 바로 엽니다.\n  *서명되지 않은 새 `.exe`에 대해 Windows SmartScreen 경고가 뜨면 **추가 정보 → 실행**을 누르세요(런처 소스는 `docs/launchers/`에 공개되어 있으며 `.\\ustanovka.ps1`을 직접 실행할 수도 있습니다).*\n3. 이후에는 **`AllY.exe`**, 바탕 화면의 **`AllY`** 바로 가기 또는 **`programma\\Dzhinni.exe`**를 더블 클릭해 실행할 수 있습니다. 별도의 앱 창에서 가이드와 버전 기록을 열려면 **`AllY-Guide.exe`**를 실행하세요.\n4. 처음 실행하면 3단계 시작 마법사가 열립니다. 원하는 AI 모델을 연결하고 첫 메시지를 보내 보세요.\n\n### 방법 2 — 터미널 명령어 사용 (PowerShell / cmd)\nPowerShell을 열고 순서대로 실행하세요:\n\n```powershell\ngit clone https://github.com/AyarZero/ally-dzhinni.git C:\\AllY\ncd C:\\AllY\n.\\AllY.exe\n```\n\n나중에 빌드 준비 상태를 확인하려면 다음 명령어를 실행하세요:\n\n```powershell\n.\\AllY.exe -Proverka\n```\n\n터미널에서 실행:\n\n```powershell\n.\\AllY.exe\n```\n\n### 방법 3 — 로컬 AI 도우미용 설치 프롬프트\nPC에 이미 Claude Code, Codex, Antigravity 또는 다른 AI 도우미가 실행 중이라면 아래 텍스트 전체를 복사해 그대로 전달하세요:\
